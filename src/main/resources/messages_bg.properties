legal.footer=Правни връзки
legal.operator=[За попълване преди публикуване: име или фирма на оператора и администратора на данни, идентификатор при приложимост, адрес и официален контакт.]
legal.terms.title=Условия за ползване
legal.terms.version=Версия {0}
legal.terms.accept=Прочетох и приемам
legal.terms.required=Приеми текущата версия на условията за ползване.
legal.terms.changed=Условията са обновени. Прочети текущата версия и я приеми, за да продължиш.
legal.terms.account.title=Регистрация и профил
legal.terms.account=Профилът се създава с потребителско име, имейл и парола. При регистрация записваме приетата версия на условията и момента на приемане. Пази данните за вход и използвай актуални данни. Google вход не е наличен в тази версия.
legal.terms.plans.title=Хранене, тренировки и прогрес
legal.terms.plans=FitPulse предоставя готови тренировъчни програми и примерни хранителни режими, инструменти за персонализиране на порциите и записване на тренировки и измервания. Каталогът предоставя информация за фитнес зали.
legal.medical=FitPulse предоставя образователна информация и ориентировъчни изчисления. Услугата не предоставя медицински съвети, диагнози или лечение и не замества консултация с квалифициран специалист.
legal.terms.content.title=Коментари и потребителско съдържание
legal.terms.content=Публикувай съдържание, за което имаш необходимите права, и не споделяй чужди лични данни. Публикуваните коментари се виждат от посетители. Можеш да редактираш или изтриеш свои коментари и да сигнализираш за чужди. Администраторите преглеждат сигнали и могат да скриват съдържание.
legal.contact.title=Контакт и въпроси
legal.terms.contact=За въпроси и сигнали използвай формуляра за помощ. [За попълване: официален контакт на оператора и правила за прекратяване на профил, ако са приложими.]
legal.privacy.title=Политика за поверителност
legal.privacy.data.title=Данни и цели на обработването
legal.privacy.data.account=Регистрация и достъп: потребителско име, имейл, хеш на паролата, настройки на профила и запис за приемане на условията. Вход с Google не е активен.
legal.privacy.data.fitness=Хранене, тренировки и прогрес: когато ги въведеш, FitPulse използва пол, дата на раждане, ръст, тегло и активност за изчисления. Запазените данни могат да включват телесни обиколки, телесни мазнини, тренировки, режими и история на измерванията.
legal.privacy.data.content=Съдържание и обратна връзка: описание на профила, град, любими зали, коментари, сигнали, предложения за зали и съобщения за помощ, включително имейл за отговор и снимка, ако са предоставени.
legal.privacy.data.technical=Технически данни: идентификатор на сесията, настройки в браузъра и IP адрес, който системата използва за ограничаване на злоупотреби с формуляра за помощ. [За попълване: данни в журналите и на хостинга.]
legal.privacy.visibility=Дневникът, календарът, личните планове и измерванията са частни. При включен публичен профил посетителите могат да виждат името и представянето ти, както и града и любимите зали, ако ги споделиш. Публикуваните коментари са публични.
legal.privacy.calculation=Калкулаторът оценява енергийните нужди въз основа на въведените данни и адаптира грамажите. Резултатът е ориентировъчен.
legal.privacy.bases.title=Правни основания
legal.privacy.bases=[За попълване по цели: правно основание по чл. 6 от GDPR и съответния легитимен интерес, ако се използва такъв. Уточнете дали измерванията разкриват здравна информация и, ако чл. 9 се прилага, посочете приложимото условие. Посочете кои данни са задължителни и последиците при непредоставяне.]
legal.privacy.recipients.title=Получатели и трансфери
legal.privacy.recipients=Администраторите обработват сигнали, коментари и запитвания през административния панел. [За попълване: получатели, доставчици и обработващи, държави на обработване, трансфери извън ЕИП и приложими гаранции.]
legal.privacy.services=При разрешени външни медии вграденият YouTube плейър и външните изображения се зареждат от доставчиците им. При отваряне на външна връзка, например към карта, се прилагат правилата на съответния сайт.
legal.privacy.retention.title=Съхранение
legal.privacy.retention=[За попълване: срокове или критерии за съхранение на профили, измервания, планове, съдържание, съобщения, записите за приемане на условия, журнали и резервни копия, включително след закриване на профил.]
legal.privacy.rights.title=Права и контакт
legal.privacy.rights=При приложимите условия можеш да поискаш достъп, корекция, изтриване, ограничаване или преносимост, да възразиш срещу обработване и да оттеглиш съгласие, когато обработването се основава на него. Можеш да подадеш жалба до компетентен надзорен орган, включително КЗЛД в България.
legal.privacy.contact=Можеш да започнеш запитване през формуляра за помощ. [За попълване: специализиран контакт за искания за лични данни, длъжностно лице по защита на данните при приложимост и ред за подаване на искане.]
legal.privacy.authority=Комисия за защита на личните данни
legal.cookies.title=Политика за бисквитките
legal.cookies.necessary.title=Сесия и настройки в браузъра
legal.cookies.session=JSESSIONID е сесийна бисквитка на FitPulse за вход, защитени формуляри и запазване на действието при пренасочване към вход. В продукционния профил сървърната сесия изтича след 30 минути без активност.
legal.cookies.language=fitpulse-language запомня изрично избрания език за една година. fitpulse-theme пази избраната светла или тъмна тема в localStorage, докато изчистиш данните на сайта.
legal.cookies.browser=В sessionStorage се пазят временна чернова на полета при смяна на език, позиция в хранителен режим и незаписани серии от тренировка. Черновата за езика се възстановява само до 30 секунди. Тези помощни записи са за текущия раздел.
legal.cookies.choice=fitpulse-media-choice-v1 запазва разрешението или отказа ти за външни медии в localStorage, докато промениш избора или изчистиш данните на сайта.
legal.cookies.external=Вградените видеа от YouTube и изображенията на външни адреси се зареждат само ако разрешиш външните медии. Доставчиците могат да получат IP адрес и данни за браузъра и да използват собствено съхранение. [За попълване: доставчици, конкретни технологии и срокове, проверени в публичната среда.]
legal.cookies.withdraw=Промени избора от „Настройки за поверителност“ в долната част на страницата. Отказът спира бъдещото зареждане от FitPulse. Можеш да изчистиш вече съхранени данни от настройките на браузъра.
legal.cookies.google=Политика за поверителност на Google
legal.media.title=Външни медии
legal.media.description=Можеш да разрешиш вградени видеа от YouTube и снимки от външни доставчици. Изборът е по желание и можеш да го промениш по всяко време.
legal.media.accept=Приемам
legal.media.reject=Отказвам
legal.media.settings=Настройки за поверителност
legal.media.settings.short=Настройки
legal.media.allow=Разреши външни медии
legal.media.video=Настройки за вграденото видео
