catalog.meal.alternative.step.add.milk.to.the.cooked.grain.if=Към предварително сварената зърнена основа добави млякото, ако е посочено; затопли още 2–3 минути.
catalog.meal.alternative.step.add.the.chicken.breast.and.remaining.cooking=Добави пилешко филе и останалите продукти за готвене и вода до 400–600 мл. Готви под капак 20–30 минути.
catalog.meal.alternative.step.add.the.chicken.breast.to.a.separate=Добави пилешко филе в отделна част на тавата; печи до готовност, приблизително 20–30 минути за филета или 25–35 минути за свинско и телешко на порции.
catalog.meal.alternative.step.add.the.chickpeas.and.eggs.and.cook=добави нахута и яйцата и готви до стягане.
catalog.meal.alternative.step.add.the.chopped.fruit.and.listed.nuts=Добави нарязаните плодове и ядките от списъка към тестото. Разпредели в силиконови форми или тавичка върху хартия. Печи при 180°C за 25–30 минути до суха клечка и стегнат център.
catalog.meal.alternative.step.add.the.chopped.tomatoes.and.cooked.chickpeas=Добави нарязаните домати и сварения нахут; остави да къкри 10 минути до сгъстяване.
catalog.meal.alternative.step.add.the.cod.and.remaining.cooking.ingredients=Добави треска и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 20–30 минути.
catalog.meal.alternative.step.add.the.cooked.grain.to.the.finished=Сварената зърнена гарнитура се добавя към готовото ястие или се поднася отделно; не я вари повторно през цялото време на готвене.
catalog.meal.alternative.step.add.the.cooked.legumes.if.listed.for=Добави предварително сварените бобови, ако са посочени, за последните 10 минути; сирената за последните 5 минути. Поднеси с гарнитурата и свежите продукти от списъка.
catalog.meal.alternative.step.add.the.listed.cheeses.and.serve.with=Добави посочените сирена и поднеси с хляба или свежите продукти от списъка, ако има такива.
catalog.meal.alternative.step.add.the.mussels.and.cook.through.mussels=Добави миди и готви до готовност; за миди или скариди обикновено са нужни 5–8 минути, за телешки ленти 10–15 минути.
catalog.meal.alternative.step.add.the.mussels.and.remaining.cooking.ingredients=Добави миди и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 5–8 минути за морските дарове, след като зеленчуците омекнат.
catalog.meal.alternative.step.add.the.olive.oil.to.the.salad=Добави зехтина към салатата.
catalog.meal.alternative.step.add.the.pork.tenderloin.and.remaining.cooking=Добави свинско бонфиле и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 20–30 минути.
catalog.meal.alternative.step.add.the.remaining.cooking.ingredients.and.up=Добави останалите продукти за готвене и вода до 400–600 мл. Готви под капак 20–30 минути.
catalog.meal.alternative.step.add.the.remaining.cooking.ingredients.with.about=Добави останалите продукти за готвене и вода около 150–250 мл. Готви под капак 20–30 минути.
catalog.meal.alternative.step.add.the.shrimp.and.cook.through.mussels=Добави скариди и готви до готовност; за миди или скариди обикновено са нужни 5–8 минути, за телешки ленти 10–15 минути.
catalog.meal.alternative.step.add.the.shrimp.and.remaining.cooking.ingredients=Добави скариди и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 5–8 минути за морските дарове, след като зеленчуците омекнат.
catalog.meal.alternative.step.add.the.squid.and.remaining.cooking.ingredients=Добави калмари и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 35–45 минути.
catalog.meal.alternative.step.add.the.trimmed.beef.and.cook.through=Добави телешко месо без видима мазнина и готви до готовност; за миди или скариди обикновено са нужни 5–8 минути, за телешки ленти 10–15 минути.
catalog.meal.alternative.step.add.the.trimmed.beef.and.remaining.cooking=Добави телешко месо без видима мазнина и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 60–90 минути до омекване.
catalog.meal.alternative.step.add.the.turkey.breast.and.cook.through=Добави пуешко филе и готви до готовност; за миди или скариди обикновено са нужни 5–8 минути, за телешки ленти 10–15 минути.
catalog.meal.alternative.step.add.the.turkey.breast.and.remaining.cooking=Добави пуешко филе и останалите продукти за готвене и вода около 150–250 мл. Готви под капак 20–30 минути.
catalog.meal.alternative.step.arrange.the.remaining.ingredients.on.the.toast=Подреди останалите продукти върху филиите или поднеси отделно; сиренето може да се запече 3–4 минути под грил.
catalog.meal.alternative.step.bake.the.chicken.until.cooked.through=Изпечи пилешкото до пълна готовност.
catalog.meal.alternative.step.bake.the.fish.and.potatoes.with.the=Изпечи рибата и картофите със зехтина.
catalog.meal.alternative.step.bake.the.fish.cook.the.rice.and=Изпечи рибата, свари ориза и задуши броколите.
catalog.meal.alternative.step.bake.the.fish.fillet.at.200.c=Изпечи рибното филе при 200°C за 15–20 минути до непрозрачна среда и лесно разделяне на люспи. Използвай само част от общия посочен зехтин.
catalog.meal.alternative.step.beat.the.egg.with.the.yogurt.and=Разбий яйцето с киселото мляко, залей мусаката и печи още 15–20 минути до стегната заливка и поне 71°C в центъра.
catalog.meal.alternative.step.beat.the.eggs.and.egg.whites.if=Разбий яйцата и белтъците, ако са посочени. Добави ги в тигана; готви на слаб огън до пълно стягане.
catalog.meal.alternative.step.beat.the.eggs.and.mix.with.the=Разбий яйцата и смесѝ със зеленчуците и сирената от списъка, или направи гнезда в доматения сос за цели яйца. Печи при 180°C за 20–25 минути до стягане.
catalog.meal.alternative.step.blend.all.listed.ingredients.to.a.thick=Пасирай всички посочени продукти до гъста смес. Оформи 4–6 хапки и охлади за 30 минути. Цялото количество е една порция.
catalog.meal.alternative.step.blend.cooked.legumes.or.the.dairy.base=Пасирай сварените бобови или млечната основа с тахана, лимона, чесъна и подправките от списъка, когато са включени; разреди с вода.
catalog.meal.alternative.step.blend.the.cooked.cauliflower.with.milk.and=Пасирай сварения карфиол с млякото; поднеси граха отделно.
catalog.meal.alternative.step.blend.the.hazelnuts.with.a.little.water=Смели лешниците с малко вода до крем без добавена захар.
catalog.meal.alternative.step.blend.the.peas.with.milk.to.make=Пасирай граха с млякото за пюре.
catalog.meal.alternative.step.blend.the.walnuts.with.greek.yogurt.and=Смели орехите с гръцкото мляко и 1–2 лъжици вода до сос; добави към готовото ястие след отстраняване от огъня.
catalog.meal.alternative.step.boil.the.cauliflower.and.blend.it.with=Свари карфиола и го пасирай с млякото.
catalog.meal.alternative.step.boil.the.eggs=Свари яйцата.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes=Свари яйцата 9–10 минути след завиране, охлади, обели и нарежи за салатата. Грамажът е за ядливата част без черупките.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes.2=Свари яйцата за 9–10 минути след завиране, охлади и обели. Грамажът е за ядливата част без черупките.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes.3=Свари яйцата 9–10 минути след завиране, охлади, обели и нарежи. Препечи хляба или питката в сух тостер и подреди яйца, кашкавал. Запечи кашкавала върху тостовете за 2–3 минути под грил. Добави посоченото сирене към готовото ястие; кашкавала настържи, а моцарелата остави да се разтопи за 1–2 минути.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes.4=Свари яйцата 9–10 минути след завиране, охлади, обели и нарежи. Препечи хляба или питката в сух тостер и подреди яйца.
catalog.meal.alternative.step.boil.the.green.beans.for.10.15=Свари зеления фасул за 10–15 минути до пълно омекване; отцеди.
catalog.meal.alternative.step.boil.the.potatoes.for.15.20.minutes=Свари картофите за 15–20 минути до омекване.
catalog.meal.alternative.step.break.the.broccoli.into.florets.and.cook=Накъсай броколите и ги задуши с малко вода до омекване.
catalog.meal.alternative.step.chop.and.cook.the.turkey.breast.separately=Нарежи и сготви пуешко филе отделно преди сглобяването.
catalog.meal.alternative.step.chop.any.fruit.place.the.dairy.ingredients=Нарежи плодовете, ако има такива; разпредели млечните продукти в купа и добави останалите посочени продукти.
catalog.meal.alternative.step.chop.red.bell.pepper.and.cook.covered=Нарежи червена чушка и задуши в тиган с част от измерения зехтин и 30 г вода за 7–10 минути.
catalog.meal.alternative.step.chop.spinach.tomatoes.and.cook.covered.for=Нарежи спанак, домати и задуши 4–6 минути с посочения зехтин и 20 г вода.
catalog.meal.alternative.step.chop.the.mushrooms.and.cook.in.some=Нарежи печурките и ги задуши в част от измерения зехтин за 8–10 минути. Охлади леко и разбъркай с киселото мляко за гъбен сос, без да кипваш млякото.
catalog.meal.alternative.step.chop.the.onion.and.peppers.and.cook=Нарежи лука и чушките и задуши с посочения зехтин и 2 лъжици вода за 6–8 минути.
catalog.meal.alternative.step.chop.the.potatoes.and.boil.until.tender=Нарежи картофите и ги свари до омекване или изпечи при 200°C за 30–40 минути с част от измерената мазнина.
catalog.meal.alternative.step.chop.the.raw.peeled.potatoes.and.roast=Нарежи суровите обелени картофи и ги изпечи на 200°C за около 25–35 минути до омекване, с част от премерения зехтин.
catalog.meal.alternative.step.chop.the.remaining.vegetables.cook.the.filling=Нарежи останалите зеленчуци. Задуши плънката с посочената мазнина; добави смляното месо, ако има, и разбърквай до раздробяване. Прибави сварените зърнени или бобови продукти.
catalog.meal.alternative.step.chop.the.tomato.and.cucumber=Нарежи домата и краставицата
catalog.meal.alternative.step.chop.the.vegetables.and.cook.them.in=Нарежи зеленчуците; задуши ги с посочената мазнина и 2–3 лъжици вода за 7–10 минути.
catalog.meal.alternative.step.chop.the.vegetables.cook.the.onion.carrots=Нарежи зеленчуците; задуши лука, морковите или чушките, ако присъстват, с посочения зехтин и малко вода за 5–7 минути.
catalog.meal.alternative.step.chop.the.vegetables.for.the.pan.cook=Нарежи зеленчуците за тигана. Задуши ги 5–7 минути с посочения зехтин и малко вода; остави свежата салата и авокадото за сервиране.
catalog.meal.alternative.step.combine.the.protein.vegetables.and.any.listed=Събери протеина, зеленчуците и сварената гарнитура, ако е посочена; добави лимон, млечен сос или ядки от списъка след отстраняване от огъня.
catalog.meal.alternative.step.cook.broccoli.cauliflower.or.spinach.until.tender=Задуши броколите, карфиола или спанака, ако присъстват, до омекване. Свежите зеленчуци, маслините и млечният сос се поднасят отделно. Използвай само посочените продукти и общото измерено количество зехтин.
catalog.meal.alternative.step.cook.dry.buckwheat.separately.in.plenty.of=Свари отделно елда в достатъчно вода според опаковката; измереното количество е сухо. Отцеди; не добавяй мазнина извън посочената.
catalog.meal.alternative.step.cook.dry.bulgur.separately.in.plenty.of=Свари отделно булгур в достатъчно вода според опаковката; измереното количество е сухо. Отцеди; не добавяй мазнина извън посочената.
catalog.meal.alternative.step.cook.dry.quinoa.separately.in.plenty.of=Свари отделно киноа в достатъчно вода според опаковката; измереното количество е сухо. Отцеди; не добавяй мазнина извън посочената.
catalog.meal.alternative.step.cook.fish.and.shellfish.to.63.c=Рибата и морските дарове трябва да достигнат 63°C; скаридите и калмарите трябва да станат непрозрачни.
catalog.meal.alternative.step.cook.poultry.to.at.least.74.c=Готви птичето месо до поне 74°C в центъра.
catalog.meal.alternative.step.cook.the.apple.with.a.little.water=Задуши ябълката с малко вода и я намачкай за сос без захар.
catalog.meal.alternative.step.cook.the.broccoli.with.a.little.water=задуши броколите с вода.
catalog.meal.alternative.step.cook.the.bulgur.bake.the.fish.and=Свари булгура, изпечи рибата и задуши зеленчуците.
catalog.meal.alternative.step.cook.the.carrot.then.add.cooked.lentils=Задуши моркова, добави сварената леща и домата.
catalog.meal.alternative.step.cook.the.chicken.breast.separately.in.a=Приготви пилешко филе отделно в незалепващ тиган с посочената мазнина или малко вода; охлади преди смесване.
catalog.meal.alternative.step.cook.the.chicken.with.tomato.and.zucchini=Сготви пилешкото с домата и тиквичката до пълна готовност.
catalog.meal.alternative.step.cook.the.dry.rice.separately.in.plenty=Свари отделно ориз в достатъчно вода според опаковката; измереното количество е сухо. Отцеди; не добавяй мазнина извън посочената.
catalog.meal.alternative.step.cook.the.dry.side.dish.according.to=Свари сухата гарнитура според опаковката, без допълнителна мазнина. Отцеди при необходимост.
catalog.meal.alternative.step.cook.the.dry.whole.grain.couscous.separately=Свари отделно пълнозърнест кускус в достатъчно вода според опаковката; измереното количество е сухо. Отцеди; не добавяй мазнина извън посочената.
catalog.meal.alternative.step.cook.the.dry.whole.grain.pasta.separately=Свари отделно пълнозърнеста паста в достатъчно вода според опаковката; измереното количество е сухо. Отцеди; не добавяй мазнина извън посочената.
catalog.meal.alternative.step.cook.the.garlic.in.the.listed.olive=Задуши чесъна за 30 секунди с посочения зехтин, добави доматите за 6–8 минути и скаридите за още 3–5 минути до непрозрачност.
catalog.meal.alternative.step.cook.the.mushrooms.in.the.measured.olive=Задуши гъбите с измерения зехтин и малко вода за 10 минути; поднеси с рулцата.
catalog.meal.alternative.step.cook.the.oats.in.milk.then.add=Свари овеса в млякото, добави ябълката и фъстъченото масло.
catalog.meal.alternative.step.cook.the.oats.in.the.listed.milk=Вари овесените ядки с посоченото мляко и малко вода на слаб огън 5–7 минути при разбъркване.
catalog.meal.alternative.step.cook.the.omelet.with.spinach.and.the=Изпечи омлета със спанака и премерения зехтин.
catalog.meal.alternative.step.cook.the.pasta=Свари пастата.
catalog.meal.alternative.step.cook.the.pasta.and.saut.the.tomato=Свари пастата, задуши домата и спанака, после добави отцедената риба и зехтина.
catalog.meal.alternative.step.cook.the.pepper.and.spinach=Задуши чушката и спанака.
catalog.meal.alternative.step.cook.the.protein.separately.until.done.and=Готви протеина отделно до готовност. Извади; задуши зеленчуците с останалата мазнина и малко вода за 8–12 минути.
catalog.meal.alternative.step.cook.the.rice=Свари ориза.
catalog.meal.alternative.step.cook.the.rice.separately=Свари ориза отделно.
catalog.meal.alternative.step.cook.the.shrimp.separately.in.a.nonstick=Приготви скариди отделно в незалепващ тиган с посочената мазнина или малко вода; охлади преди смесване.
catalog.meal.alternative.step.cook.the.side.vegetables.in.the.remaining=С останалата мазнина задуши зеленчуците за гарнитурата; поднеси със сварената зърнена основа, сирената и свежите продукти от списъка.
catalog.meal.alternative.step.cook.the.spinach.for.2.3.minutes=Задуши спанака за 2–3 минути и отцеди. Разтвори филето на тънък пласт, напълни със спанака и сиренето, навий и закрепи с клечка. Печи при 190°C за около 25–30 минути до поне 74°C в центъра.
catalog.meal.alternative.step.cook.the.turkey.breast.separately.in.a=Приготви пуешко филе отделно в незалепващ тиган с посочената мазнина или малко вода; охлади преди смесване.
catalog.meal.alternative.step.cook.the.vegetables.in.the.measured.olive=Задуши зеленчуците с измерения зехтин за 5–7 минути, добави доматите, ако са включени, и готви още 8–10 минути.
catalog.meal.alternative.step.cook.whole.cuts.of.meat.to.at=За цели парчета месо достигни поне 63°C и остави 3 минути покой; при рагу продължи до омекване.
catalog.meal.alternative.step.cook.with.the.measured.olive.oil.and=изпечи с премерения зехтин и добави плодовете.
catalog.meal.alternative.step.core.or.pit.and.slice.the.fruit=Нарежи плода без семки или костилки. Изпечи при 180°C за 18–25 минути в съд с 2–3 лъжици вода, без добавена захар.
catalog.meal.alternative.step.crumble.the.tofu.into.the.vegetables.and=Натроши тофуто към зеленчуците и разбърквай 5–6 минути до равномерно загряване.
catalog.meal.alternative.step.cut.chicken.breast.into.even.cubes.thread=Нарежи пилешко филе на еднакви кубчета, нанижи на шишчета и намажи с част от премерения зехтин. Печи при 200°C за 18–25 минути, като обърнеш веднъж.
catalog.meal.alternative.step.cut.everything.into.similar.sized.pieces.and=Нарежи всичко на сходни парчета и изпечи до пълна готовност на месото.
catalog.meal.alternative.step.cut.the.meat.tofu.or.seafood.and=Нарежи месото, тофуто или морските дарове и зеленчуците на малки парчета. Загрей тиган с половината от измерения зехтин.
catalog.meal.alternative.step.cut.the.pork.into.roughly.2.cm=Нарежи свинското на кубчета около 2 см. Смеси с част от зехтина и лимона и нанижи на шишчета; печи отделно от картофите.
catalog.meal.alternative.step.cut.the.turkey.and.pepper.into.cubes=Нарежи пуешкото и чушката на кубчета, нанижи на шишчета и намажи с част от посочения зехтин.
catalog.meal.alternative.step.cut.the.vegetables.evenly.toss.with.the=Нарежи зеленчуците на равномерни парчета. Разпредели с посочената мазнина в тава върху хартия; плътните зеленчуци и картофите печи при 200°C за 30–40 минути, меките за 20–25 минути.
catalog.meal.alternative.step.dice.the.potatoes.and.boil.for.10=Нарежи картофите на малки кубчета и ги свари за 10 минути. Задуши лука и доматите с посочения зехтин и малко вода за 8 минути.
catalog.meal.alternative.step.dice.the.potatoes.and.boil.for.15=Свари картофите на кубчета за 15–20 минути до омекване.
catalog.meal.alternative.step.dice.the.potatoes.boil.for.12.15=Свари картофите на малки кубчета за 12–15 минути и отцеди. Добави ги в тигана преди яйцата.
catalog.meal.alternative.step.dice.the.potatoes.boil.for.15.20=Свари картофите на кубчета до омекване за 15–20 минути и ги добави към тигана.
catalog.meal.alternative.step.dice.the.pumpkin.and.roast.on.baking=Нарежи тиквата на кубчета и я изпечи върху хартия при 190°C за 25–30 минути до омекване.
catalog.meal.alternative.step.dice.the.turkey.and.cook.it.separately=Нарежи пуешкото на дребно и го сготви отделно до 74°C преди добавяне към яйцата.
catalog.meal.alternative.step.divide.the.olive.oil.among.them=разпредели зехтина между тях.
catalog.meal.alternative.step.divide.the.total.listed.olive.oil.between=Разпредели общото посочено количество зехтин между готвенето и салатата.
catalog.meal.alternative.step.finely.chop.the.dates.and.scatter.over=Нарежи фурмите ситно и ги разпредели върху млякото.
catalog.meal.alternative.step.for.the.tzatziki.grate.and.drain.the=За дзадзикито настържи и отцеди краставицата, после смеси с гръцкото мляко, чесъна и копъра.
catalog.meal.alternative.step.grate.and.drain.some.of.the.cucumber=Настържи част от краставицата, отцеди и смеси с млякото, чесъна и копъра за дзадзики.
catalog.meal.alternative.step.grate.the.cauliflower.into.fine.pieces.cook=Настържи карфиола на ситни трохи. Задуши го отделно с част от посочения зехтин за 5–7 минути; това е зеленчукова гарнитура без ориз.
catalog.meal.alternative.step.grind.the.meat.or.mash.the.cooked=Смели месото или намачкай сварения нахут, според продуктите. Смеси с яйцето, ситния лук и зелените подправки от списъка, ако са посочени.
catalog.meal.alternative.step.grind.the.oats.and.mix.with.the=Смели овеса, смеси с яйцата и млякото.
catalog.meal.alternative.step.grind.the.oats.and.mix.with.the.2=Смели овеса и смеси с яйцата и посоченото мляко или извара. Намачкай банана и го разбъркай в сместа. Остави 5 минути. Намажи незалепващ тиган с цялото премерено количество зехтин и изпечи малки палачинки по 2–3 минути от страна до пълно стягане.
catalog.meal.alternative.step.grind.the.oats.and.mix.with.the.3=Смели овеса и смеси с яйцата и посоченото мляко или извара. Остави 5 минути. Намажи незалепващ тиган с цялото премерено количество зехтин и изпечи малки палачинки по 2–3 минути от страна до пълно стягане. Поднеси с нарязаните ягоди.
catalog.meal.alternative.step.grind.the.oats.or.buckwheat.into.flour=Смели овеса или елдата на брашно, ако са посочени. Смеси с яйцата, млечната основа и лененото семе, ако присъства; добави малко вода само при нужда.
catalog.meal.alternative.step.ground.meat.should.reach.at.least.71=Смляното месо трябва да достигне поне 71°C в центъра.
catalog.meal.alternative.step.halve.and.hollow.out.the.eggplant.roast=Разполови и издълбай патладжана. Запечи празните половинки при 190°C за 10 минути.
catalog.meal.alternative.step.halve.and.hollow.out.the.peppers.roast=Разполови и издълбай чушките. Запечи празните половинки при 190°C за 10 минути.
catalog.meal.alternative.step.halve.and.hollow.out.the.zucchini.roast=Разполови и издълбай тиквичките. Запечи празните половинки при 190°C за 10 минути.
catalog.meal.alternative.step.halve.the.pear.and.bake.at.180=Разполови крушата и я изпечи при 180°C за 20–25 минути с 2 лъжици вода.
catalog.meal.alternative.step.heat.a.nonstick.pan.with.the.listed=Загрей незалепващ тиган с посочения зехтин. Разбий яйцата, излей в тигана и готви под капак на слаб огън до пълно стягане. Добави посоченото сирене или кашкавал през последната минута. Поднеси с пълнозърнестия хляб.
catalog.meal.alternative.step.let.cool.slightly.and.serve.with.the=Остави леко да се охлади и поднеси с млечните продукти, тахана и ядките от списъка.
catalog.meal.alternative.step.let.the.batter.rest.for.10.minutes=Остави сместа за 10 минути. Намажи тигана с цялото измерено количество мазнина и разпредели между палачинките; печи малки палачинки 2–3 минути от страна до готовност.
catalog.meal.alternative.step.let.the.batter.rest.for.5.minutes=Остави 5 минути. Намажи незалепващ тиган с цялото премерено количество зехтин и изпечи малки палачинки по 2–3 минути от страна до пълно стягане.
catalog.meal.alternative.step.let.the.oats.soften.in.the.dairy=Остави овесените ядки да омекнат в млечната основа за поне 20 минути в хладилник.
catalog.meal.alternative.step.let.the.oats.soften.in.the.yogurt=Остави овеса да омекне в млякото и добави плодовете.
catalog.meal.alternative.step.make.wells.in.the.sauce.and.crack=Направи гнезда в соса, счупи яйцата и готви под капак до пълно стягане на белтъка и жълтъка, около 8–10 минути; яйченото ястие трябва да достигне около 71°C.
catalog.meal.alternative.step.make.wells.in.the.tomatoes.and.add=Направи гнезда в доматите и добави яйцата; похлупи до пълно стягане.
catalog.meal.alternative.step.mash.the.cooked.potatoes.with.milk.and=Намачкай сварените картофи с млякото и добави моцарелата.
catalog.meal.alternative.step.measure.the.cooked.drained.legumes.warm.with=Използвай вече сварените и отцедени бобови в посоченото количество. Затопли ги с малко вода, без да добавяш непремерена мазнина.
catalog.meal.alternative.step.mix.the.greek.yogurt.and.lemon.juice=Разбъркай гръцкото мляко с лимоновия сок за студен сос; дръж го в хладилник, докато приготвяш пилешкото.
catalog.meal.alternative.step.mix.the.greek.yogurt.with.lemon.juice=Смеси гръцкото мляко с лимоновия сок за сос; запази го студено до сервиране.
catalog.meal.alternative.step.mix.the.listed.chia.oats.or.flaxseed=Разбъркай чиа, овес или лен, ако са посочени, с млечната основа. Остави за поне 2 часа в хладилник.
catalog.meal.alternative.step.mix.the.oats.and.yogurt.leave.for=Смеси овеса и млякото, остави 15 минути и добави банана и орехите.
catalog.meal.alternative.step.mix.the.oats.into.the.dairy.base=Смеси овеса с млечната основа и остави 15 минути да омекне. Претегли и поднеси заедно: кисело мляко 2%, овесени ядки.
catalog.meal.alternative.step.mix.the.potatoes.with.the.cooked.lentils=Смеси картофите със сварената леща и доматения сос; сложи в тавичка и печи при 190°C за 20 минути.
catalog.meal.alternative.step.mix.with.cooked.lentils.and.saut.ed=смеси със сварената леща и задушените зеленчуци, добави сиренето.
catalog.meal.alternative.step.place.the.plain.tofu.on.a.separate=Добави тофу натурално в отделна част на тавата; печи до готовност, приблизително 20–30 минути за филета или 25–35 минути за свинско и телешко на порции.
catalog.meal.alternative.step.place.the.pork.tenderloin.on.a.separate=Добави свинско бонфиле в отделна част на тавата; печи до готовност, приблизително 20–30 минути за филета или 25–35 минути за свинско и телешко на порции.
catalog.meal.alternative.step.place.the.trimmed.beef.on.a.separate=Добави телешко месо без видима мазнина в отделна част на тавата; печи до готовност, приблизително 20–30 минути за филета или 25–35 минути за свинско и телешко на порции.
catalog.meal.alternative.step.place.the.turkey.breast.on.a.separate=Добави пуешко филе в отделна част на тавата; печи до готовност, приблизително 20–30 минути за филета или 25–35 минути за свинско и телешко на порции.
catalog.meal.alternative.step.preheat.the.oven.to.200.c.dice=Загрей фурната на 200°C. Нарежи картофите на кубчета, разпредели част от посочения зехтин и печи 30–35 минути.
catalog.meal.alternative.step.prepare.and.slice.apple.weigh.and.serve=Почисти и нарежи: ябълка. Претегли и поднеси заедно: извара 5%, ябълка.
catalog.meal.alternative.step.prepare.and.slice.apple.weigh.and.serve.2=Почисти и нарежи: ябълка. Претегли и поднеси заедно: ябълка, кисело мляко 2%.
catalog.meal.alternative.step.prepare.and.slice.apple.weigh.and.serve.3=Почисти и нарежи: ябълка. Претегли и поднеси заедно: ябълка, орехи.
catalog.meal.alternative.step.prepare.and.slice.banana.weigh.and.serve=Почисти и нарежи: банан. Претегли и поднеси заедно: банан, бадеми.
catalog.meal.alternative.step.prepare.and.slice.banana.weigh.and.serve.2=Почисти и нарежи: банан. Претегли и поднеси заедно: банан, фъстъчено масло без захар.
catalog.meal.alternative.step.prepare.and.slice.figs=Почисти и нарежи: смокини.
catalog.meal.alternative.step.prepare.and.slice.pear.weigh.and.serve=Почисти и нарежи: круша. Претегли и поднеси заедно: извара 5%, круша.
catalog.meal.alternative.step.put.the.fish.in.a.baking.dish=Приготви рибата в тава с част от посочения зехтин и лимон, ако присъства; печи при 190°C приблизително 15–25 минути според дебелината.
catalog.meal.alternative.step.refrigerate.for.15.minutes.to.soften.the=Остави за 15 минути в хладилник, за да омекнат овесът и семената.
catalog.meal.alternative.step.remove.from.the.heat.add.cottage.cheese=Отстрани от огъня; добави изварата, киселото мляко или скира, ако присъстват, и завърши с плодовете и ядките от списъка.
catalog.meal.alternative.step.rinse.and.drain.the.beans.and.fish=Изплакни и отцеди боба и рибата, смеси със зеленчуците и зехтина.
catalog.meal.alternative.step.roast.the.carrot.sticks.on.baking.paper=Изпечи морковените пръчици при 200°C за 25 минути върху хартия.
catalog.meal.alternative.step.roast.the.meat.and.vegetables.in.the=Изпечи месото и зеленчуците със зехтина до пълна готовност.
catalog.meal.alternative.step.roast.the.meat.until.cooked.through.and=Изпечи месото до пълна готовност и картофите.
catalog.meal.alternative.step.roast.the.pepper.at.220.c.for=Изпечи чушката при 220°C за 20 минути, задуши в затворен съд за 5 минути и обели.
catalog.meal.alternative.step.roast.the.raw.turkey.until.cooked.through=Изпечи суровото пуешко до пълна готовност и картофите до омекване
catalog.meal.alternative.step.roast.the.sliced.zucchini.at.200.c=Изпечи нарязаните тиквички при 200°C за 20 минути с част от измерения зехтин.
catalog.meal.alternative.step.roast.the.zucchini.rounds.at.200.c=Изпечи тиквичките на шайби при 200°C за 20 минути.
catalog.meal.alternative.step.serve.immediately.do.not.add.unlisted.sugar=Поднеси веднага; не добавяй захар или сок извън списъка.
catalog.meal.alternative.step.serve.separately.or.together.in.a.bowl=Поднеси продуктите отделно или като купа с нарязана ябълка.
catalog.meal.alternative.step.serve.sliced.orange.with.the.yogurt=Поднеси портокала на резени с млякото.
catalog.meal.alternative.step.serve.with.cheese.and.bread=Поднеси със сирене и хляб.
catalog.meal.alternative.step.serve.with.the.bread.cheese.and.cucumber=поднеси ги с хляба, сиренето и краставицата.
catalog.meal.alternative.step.serve.with.the.chopped.vegetables.seeds.and=Поднеси с нарязаните зеленчуци, семките и хляба, ако са посочени.
catalog.meal.alternative.step.serve.with.the.listed.fruit.dairy.cream=Поднеси с плодовете, млечния крем и ядките от списъка; не добавяй захар или непосочени топинги.
catalog.meal.alternative.step.serve.with.the.listed.whole.grain.bread=Поднеси с посочения пълнозърнест хляб.
catalog.meal.alternative.step.shape.4.5.small.patties.brush.with=Оформи 4–5 малки кюфтета; намажи с половината от измерения зехтин и печи при 200°C за 20–25 минути, като обърнеш по средата.
catalog.meal.alternative.step.slice.the.pear.and.add.crushed.walnuts=Нарежи крушата и добави натрошените орехи.
catalog.meal.alternative.step.soak.the.dates.in.warm.water.for=Накисни фурмите за 10 минути в топла вода и отцеди. Смели ядките и овесените ядки.
catalog.meal.alternative.step.soak.the.oats.in.milk.for.15=Остави овеса в млякото за 15 минути и добави крушата и ядките.
catalog.meal.alternative.step.stir.in.the.yogurt.to.make.a=Направи кремообразен сос с киселото мляко; не го кипвай след добавянето.
catalog.meal.alternative.step.stir.the.berries.into.the.cottage.cheese=Разбъркай плодовете с изварата.
catalog.meal.alternative.step.stuff.the.vegetables.and.add.the.tomatoes=Напълни зеленчуците, добави доматите и 80–120 мл вода в тавата. Печи при 190°C още 25–35 минути; сложи сиренето от списъка в последните 5 минути.
catalog.meal.alternative.step.the.egg.mixture.should.be.completely.set=Яйчената смес трябва да е напълно стегната, около 71°C в центъра.
catalog.meal.alternative.step.the.listed.legumes.are.already.cooked.add=Бобовите от списъка са вече сварени: добави ги в последните 8–10 минути. Прибави млечните продукти и свежите подправки след отстраняване от огъня; хлябът се поднася отделно.
catalog.meal.alternative.step.thinly.slice.the.eggplant.brush.with.the=Нарежи патладжана на тънки шайби, намажи с измерения зехтин и печи при 200°C за 20–25 минути.
catalog.meal.alternative.step.toast.the.bread.in.a.dry.pan=Препечи хляба в сух тиган или тостер; намажи с посочената млечна основа, хумус или авокадо, ако са включени.
catalog.meal.alternative.step.toast.the.bread.or.bun.and.top=Препечи хляба или питката в сух тостер и подреди домати, фета.
catalog.meal.alternative.step.toast.the.bread.or.bun.and.top.2=Препечи хляба или питката в сух тостер и подреди яйца, домати, маслини.
catalog.meal.alternative.step.toast.the.bread.until.crisp.moisten.lightly=Препечи хляба до сухар; навлажни леко с вода и покрий с доматите.
catalog.meal.alternative.step.toss.the.sauce.with.the.cooked.pasta=Смеси соса със сварената паста; добави рикотата, бобовите и пресните подправки от списъка, ако са включени.
catalog.meal.alternative.step.use.only.the.measured.fat=не добавяй непремерена мазнина.
catalog.meal.alternative.step.use.the.cooked.drained.legumes.if.listed=Използвай сварените и отцедени бобови, ако са посочени. Нарежи зеленчуците и събери със зърнената основа, протеина и сирената от списъка.
catalog.meal.alternative.step.use.the.total.olive.oil.listed.for=зехтинът е общото количество за готвене и салатата.
catalog.meal.alternative.step.warm.the.tortilla.in.a.dry.pan=Затопли тортилата за 30 секунди в сух тиган. Нарежи свежите зеленчуци, добави готовата плънка и завий.
catalog.meal.alternative.step.wash.and.chop.the.fruit.blend.all=Измий и нарежи плодовете. Пасирай всички посочени продукти; добави вода до желаната гъстота.
catalog.meal.alternative.step.wash.and.chop.the.remaining.vegetables.mix=Измий и нарежи останалите зеленчуци. Смеси с бобовите и гарнитурата и добави останалия премерен зехтин.
catalog.meal.alternative.step.wash.and.slice.the.pear.and.serve=Измий и нарежи крушата, поднеси с млякото.
catalog.meal.alternative.step.weigh.and.serve.together.2.plain.yogurt=Претегли и поднеси заедно: кисело мляко 2%, овесени ядки, смокини.
catalog.meal.alternative.step.weigh.and.serve.together.2.plain.yogurt.2=Претегли и поднеси заедно: кисело мляко 2%, канела.
catalog.meal.alternative.step.weigh.and.serve.together.oats.2.plain=Претегли и поднеси заедно: овесени ядки, кисело мляко 2%, портокал.
catalog.meal.alternative.step.weigh.and.serve.together.orange.almonds=Претегли и поднеси заедно: портокал, бадеми.
catalog.meal.alternative.step.weigh.and.serve.together.pear.walnuts=Претегли и поднеси заедно: круша, орехи.
catalog.meal.alternative.step.weigh.the.nuts.and.serve.with.the=Премери ядките и поднеси с изварата и портокала.
catalog.meal.alternative.step.weigh.the.walnuts.and.serve.with.the=Премери орехите и поднеси с плода и млякото.
catalog.meal.alternative.step.whisk.the.listed.olive.oil.lemon.juice=Разбъркай посочените зехтин, лимонов сок или тахан с малко вода за дресинг и добави зелените подправки.
catalog.meal.alternative.strawberries.with.yogurt.cream.and.chia=Ягоди с млечен крем и чиа
catalog.meal.alternative.strawberry.yogurt.cream.with.flaxseed=Ягодов крем с кисело мляко и лен
catalog.meal.alternative.toast.with.cottage.cheese.raisins.and.pear=Филия с извара, стафиди и круша
catalog.meal.alternative.toast.with.egg.cottage.cheese.and.tomato=Филия с яйце, извара и домат
catalog.meal.alternative.toast.with.egg.tomatoes.and.olives=Тост с яйце, домати и маслини
catalog.meal.alternative.toast.with.hummus.and.cucumber=Филия с хумус и краставица
catalog.meal.alternative.toast.with.ricotta.peach.and.seeds=Филия с рикота, праскова и семки
catalog.meal.alternative.tofu.scramble.with.mushrooms.and.spinach=Тофу бърканица с гъби и спанак
catalog.meal.alternative.tofu.with.rice.broccoli.and.sesame.sauce=Тофу с ориз, броколи и сусамов сос
catalog.meal.alternative.tomato.feta.and.olive.salad=Салата от домати, фета и маслини
catalog.meal.alternative.trout.with.buckwheat.and.broccoli=Пъстърва с елда и броколи
catalog.meal.alternative.trout.with.olive.oil.potatoes.and.green=Пъстърва със зехтин, картофи и зелена салата
catalog.meal.alternative.trout.with.potatoes.olives.and.lemon=Пъстърва с картофи, маслини и лимон
catalog.meal.alternative.trout.with.quinoa.and.sweet.potatoes=Пъстърва с киноа и сладки картофи
catalog.meal.alternative.trout.with.rice.and.broccoli=Пъстърва с ориз и броколи
catalog.meal.alternative.trout.with.rice.and.white.bean.salad=Пъстърва с ориз и салата от бял боб
catalog.meal.alternative.tuna.pasta=Паста с риба тон
catalog.meal.alternative.tuna.white.bean.and.parsley.salad=Салата с риба тон, бял боб и магданоз
catalog.meal.alternative.turkey.and.broccoli.egg.bake=Яйчена запеканка с пуешко и броколи
catalog.meal.alternative.turkey.and.rice.stuffed.zucchini=Пуешки пълнени тиквички с ориз
catalog.meal.alternative.turkey.chili.with.white.beans.and.corn=Пуешко чили с бял боб и царевица
catalog.meal.alternative.turkey.meatballs.with.bulgur.and.peppers=Пуешки кюфтета с булгур и чушки
catalog.meal.alternative.turkey.meatballs.with.eggplant.and.feta=Пуешки кюфтета с патладжан и фета
catalog.meal.alternative.turkey.skewers.with.bulgur.and.yogurt.sauce=Пуешки шишчета с булгур и млечен сос
catalog.meal.alternative.turkey.steak.with.quinoa.and.roast.carrots=Пуешки стек с киноа и печени моркови
catalog.meal.alternative.turkey.with.bulgur.and.peppers=Пуешко с булгур и чушки
catalog.meal.alternative.turkey.with.couscous.and.zucchini=Пуешко с кускус и тиквички
catalog.meal.alternative.turkey.with.green.beans.and.walnut.sauce=Пуешко със зелен фасул и орехов сос
catalog.meal.alternative.turkey.with.potatoes.and.carrots=Пуешко с картофи и моркови
catalog.meal.alternative.turkey.with.potatoes.and.fresh.salad=Пуешко с картофи и свежа салата
catalog.meal.alternative.turkey.with.rice.corn.and.peppers=Пуешко с ориз, царевица и чушки
catalog.meal.alternative.turkey.with.roasted.vegetables=Пуешко с печени зеленчуци
catalog.meal.alternative.tuscan.cod.with.white.beans.and.spinach=Треска с бял боб и спанак по тоскански
catalog.meal.alternative.tzatziki.with.carrots.and.whole.grain.bread=Дзадзики с моркови и пълнозърнест хляб
catalog.meal.alternative.vegetable.pasta.with.white.beans.and.basil=Зеленчукова паста с бял боб и босилек
catalog.meal.alternative.warm.beef.bowl.with.rice.and.avocado=Топла купа с телешко, ориз и авокадо
catalog.meal.alternative.warm.buckwheat.with.cottage.cheese.and.pear=Топла елда с извара и круша
catalog.meal.alternative.warm.lentil.salad.with.pumpkin.and.cheese=Топла салата с леща, тиква и сирене
catalog.meal.alternative.white.bean.potato.and.cheese.bake=Запеканка с бял боб, картофи и сирене
catalog.meal.alternative.white.bean.salad.with.egg.and.roast=Салата с бял боб, яйце и печена чушка
catalog.meal.alternative.white.bean.soup.with.spinach.and.cottage=Супа от бял боб със спанак и извара
catalog.meal.alternative.white.bean.spread.with.pepper.and.lemon=Пастет от бял боб с чушка и лимон
catalog.meal.alternative.white.beans.with.mixed.seasonal.vegetables=Бял боб с зеленчуци и сезонни зеленчуци
catalog.meal.alternative.white.beans.with.pasta.and.seasonal.vegetables=Бял боб с паста и сезонни зеленчуци
catalog.meal.alternative.white.beans.with.potatoes.and.seasonal.vegetables=Бял боб с картофи и сезонни зеленчуци
catalog.meal.alternative.white.beans.with.roast.pumpkin.and.feta=Бял боб с печена тиква и фета
catalog.meal.alternative.whole.grain.chicken.and.mozzarella.sandwich=Пълнозърнест сандвич с пилешко и моцарела
catalog.meal.alternative.whole.grain.pasta.with.ricotta.and.spinach=Пълнозърнеста паста с рикота и спанак
catalog.meal.alternative.whole.grain.sardine.and.avocado.toast=Пълнозърнест тост с авокадо и сардини
catalog.meal.alternative.whole.grain.toast.with.egg.and.avocado=Пълнозърнест тост с яйце и авокадо
catalog.meal.alternative.whole.grain.toast.with.eggs.and.yellow=Пълнозърнести тостове с яйца и кашкавал
