catalog.meal.methodology.amounts.are.for.one.portion.weigh.meat=Грамажите са за една порция: месото, рибата и почистените зеленчуци са сурови; яйцата са без черупки; оризът, булгурът, кускусът, овесът и пастата са сухи; бобовите, грахът, царевицата и консервираната риба са сварени/отцедени. Млякото и сосовете също се претеглят в грамове. Сготвеното тегло се променя от водата и не замества посоченото сурово тегло. Калориите, протеините, въглехидратите и мазнините са ориентировъчни: количество × стойност за 100 г / 100; kcal = 4 × протеини + 4 × въглехидрати + 9 × мазнини. Изчислява се преди закръгляване от продуктите, включително цялата добавена мазнина. Количествата са примерни порции за съответния режим, без гаранция за индивидуален енергиен дефицит или излишък.
