spring.datasource.url=${FITPULSE_DB_URL:jdbc:mysql://localhost:3306/fitpulse2?createDatabaseIfNotExist=false&serverTimezone=UTC}
spring.datasource.username=${FITPULSE_DB_USERNAME:fitpulse}
spring.datasource.password=${FITPULSE_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
