catalog.meal.methodology.amounts.are.for.one.portion.weigh.meat=Amounts are for one portion. Weigh meat, fish and trimmed vegetables raw, eggs without shells, and rice, bulgur, couscous, oats and pasta dry. Weigh legumes, peas, corn and canned fish cooked or drained. Weigh milk and sauces in grams too. Water changes the cooked weight, so do not substitute it for the listed raw weight. Calories, protein, carbohydrates and fat are estimates: multiply the amount by the value per 100 g and divide by 100. Calories = 4 × protein + 4 × carbohydrates + 9 × fat. Values are calculated before rounding and include all added fat. Portions are examples for each plan and do not guarantee an individual energy deficit or surplus.
