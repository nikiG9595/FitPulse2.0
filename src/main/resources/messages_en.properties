legal.terms.required=Accept the current version of the terms of use.
legal.terms.changed=The terms have changed. Read and accept the current version to continue.
legal.terms.account.title=Registration and profiles
legal.terms.account=An account is created with a username, email address and password. On registration we store the accepted terms version and the time of acceptance. Keep your credentials secure and provide accurate details. Google sign-in is unavailable in this version.
legal.terms.plans.title=Nutrition, workouts and progress
legal.terms.plans=FitPulse offers ready-made training programs and sample meal plans, tools for adjusting portions, and records for workouts and measurements. The directory provides information about gyms.
legal.medical=FitPulse provides educational information and estimates. It does not provide medical advice, diagnosis or treatment and is not a substitute for consulting a qualified professional.
legal.terms.content.title=Comments and user content
legal.terms.content=Post content you have the right to share and respect others’ personal data. Published comments are visible to visitors. You can edit or delete your own comments and report others. Administrators review reports and can hide content.
legal.contact.title=Contact and questions
legal.terms.contact=Use the support form for questions and reports. [Complete: official operator contact and account termination rules, where applicable.]
legal.privacy.title=Privacy policy
legal.privacy.data.title=Data and purposes
legal.privacy.data.account=Registration and access: username, email, password hash, profile settings and the terms acceptance record. Google sign-in is inactive.
legal.privacy.data.fitness=Nutrition, workouts and progress: when you provide them, FitPulse uses sex, date of birth, height, weight and activity for calculations. Saved data may include body measurements, body fat, workouts, meal plans and measurement history.
legal.privacy.data.content=Content and feedback: profile bio, city, favorite gyms, comments, reports, gym suggestions and support messages, including a reply email and image if provided.
legal.privacy.data.technical=Technical data: session identifier, browser preferences and the IP address used to limit abuse of the support form. [Complete: hosting and log data.]
legal.privacy.visibility=Your journal, calendar, personal plans and measurements are private. When you turn on your public profile, visitors can see your name and bio, plus your city and favorite gyms if you share them. Published comments are public.
legal.privacy.calculation=The calculator estimates energy needs from the information you enter and adjusts portions. Its output is an estimate.
legal.privacy.bases.title=Legal bases
legal.privacy.bases=[Complete by purpose: GDPR Article 6 legal basis and the relevant legitimate interest, if relied upon. Assess whether measurements reveal health information and, if Article 9 applies, identify the applicable condition. Explain which data are required and the consequences of not providing them.]
legal.privacy.recipients.title=Recipients and transfers
legal.privacy.recipients=Administrators handle reports, comments and requests in the admin panel. [Complete: recipients, providers and processors, processing locations, transfers outside the EEA and applicable safeguards.]
legal.privacy.services=When optional external media is enabled, YouTube embeds and external images are loaded from their providers. When you open an external link, such as a map, the destination site’s policies apply.
legal.privacy.retention.title=Retention
legal.privacy.retention=[Complete: retention periods or criteria for accounts, measurements, plans, content, messages, terms acceptance records, logs and backups, including after account closure.]
legal.privacy.rights.title=Your rights and contact
legal.privacy.rights=Where applicable, you can request access, correction, deletion, restriction or portability, object to processing, and withdraw consent where processing relies on it. You may lodge a complaint with the competent supervisory authority, including the CPDP in Bulgaria.
legal.privacy.contact=You can start an enquiry through the support form. [Complete: dedicated privacy contact, data protection officer if applicable, and how to submit a rights request.]
legal.privacy.authority=Bulgarian Commission for Personal Data Protection
legal.cookies.title=Cookie policy
legal.cookies.necessary.title=Session and browser preferences
legal.cookies.session=JSESSIONID is a FitPulse session cookie used for sign-in, protected forms and resuming a requested action after sign-in. The production profile expires the server session after 30 minutes of inactivity.
legal.cookies.language=fitpulse-language remembers the language you choose for one year. fitpulse-theme keeps the selected light or dark theme in localStorage until you clear the site data.
legal.cookies.browser=sessionStorage temporarily stores form fields during a language change, the position in a meal plan and unsaved workout sets. The language draft is only restored within 30 seconds. These records are scoped to the current browser tab.
legal.cookies.choice=fitpulse-media-choice-v1 keeps your external media choice in localStorage until you change it or clear the site data.
legal.cookies.external=YouTube embeds and images hosted at external URLs are loaded only if you allow external media. Providers may receive your IP address and browser data and use their own storage. [Complete: providers, specific technologies and durations verified in the public deployment.]
legal.cookies.withdraw=Change your choice using Privacy settings in the footer. Refusing stops future loading by FitPulse. Use your browser settings to clear previously stored data.
