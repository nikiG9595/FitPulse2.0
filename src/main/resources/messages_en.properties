catalog.meal.alternative.step.about.100.g.of.edible.egg.equals=About 100 g of edible egg equals two medium eggs.
catalog.meal.alternative.step.add.chopped.fruit.and.nuts.just.before=Add chopped fruit and nuts just before serving.
catalog.meal.alternative.step.add.milk.to.the.cooked.grain.if=Add milk to the cooked grain if listed and heat for another 2–3 minutes.
catalog.meal.alternative.step.add.the.chicken.breast.and.remaining.cooking=Add the chicken breast and remaining cooking ingredients with up to 400–600 ml water. Cover and cook for 20–30 minutes.
catalog.meal.alternative.step.add.the.chicken.breast.to.a.separate=Add the chicken breast to a separate section of the tray. Roast until cooked through, around 20–30 minutes for fillets or 25–35 minutes for individual pork or beef portions.
catalog.meal.alternative.step.add.the.chickpeas.and.eggs.and.cook=Add the chickpeas and eggs and cook until set.
catalog.meal.alternative.step.add.the.chopped.fruit.and.listed.nuts=Add the chopped fruit and listed nuts to the batter. Divide among silicone molds or spread in a lined pan. Bake at 180°C for 25–30 minutes until the center is set and a toothpick comes out clean.
catalog.meal.alternative.step.add.the.chopped.tomatoes.and.cooked.chickpeas=Add the chopped tomatoes and cooked chickpeas. Simmer for 10 minutes until thickened.
catalog.meal.alternative.step.add.the.cod.and.remaining.cooking.ingredients=Add the cod and remaining cooking ingredients with about 150–250 ml water. Cover and cook for 20–30 minutes.
catalog.meal.alternative.step.add.the.cooked.grain.to.the.finished=Add the cooked grain to the finished dish or serve it separately. Avoid recooking it for the full cooking time.
catalog.meal.alternative.step.add.the.cooked.legumes.if.listed.for=Add the cooked legumes if listed for the last 10 minutes and the cheeses for the last 5. Serve with the side dish and listed fresh ingredients.
catalog.meal.alternative.step.add.the.listed.cheeses.and.serve.with=Add the listed cheeses and serve with the bread or fresh ingredients if included.
catalog.meal.alternative.step.add.the.mussels.and.cook.through.mussels=Add the mussels and cook through. Mussels or shrimp usually take 5–8 minutes and beef strips 10–15 minutes.
catalog.meal.alternative.step.add.the.mussels.and.remaining.cooking.ingredients=Add the mussels and remaining cooking ingredients with about 150–250 ml water. Once the vegetables are tender, cook the seafood covered for 5–8 minutes.
catalog.meal.alternative.step.add.the.olive.oil.to.the.salad=Add the olive oil to the salad.
catalog.meal.alternative.step.add.the.pork.tenderloin.and.remaining.cooking=Add the pork tenderloin and remaining cooking ingredients with about 150–250 ml of water. Cover and cook for 20–30 minutes.
catalog.meal.alternative.step.add.the.remaining.cooking.ingredients.and.up=Add the remaining cooking ingredients and up to 400–600 ml water. Cover and cook for 20–30 minutes.
catalog.meal.alternative.step.add.the.remaining.cooking.ingredients.with.about=Add the remaining cooking ingredients with about 150–250 ml water. Cover and cook for 20–30 minutes.
catalog.meal.alternative.step.add.the.shrimp.and.cook.through.mussels=Add the shrimp and cook through. Mussels or shrimp usually take 5–8 minutes and beef strips 10–15 minutes.
catalog.meal.alternative.step.add.the.shrimp.and.remaining.cooking.ingredients=Add the shrimp and remaining cooking ingredients with about 150–250 ml water. Once the vegetables are tender, cook the seafood covered for 5–8 minutes.
catalog.meal.alternative.step.add.the.squid.and.remaining.cooking.ingredients=Add the squid and remaining cooking ingredients with about 150–250 ml water. Cover and cook for 35–45 minutes.
catalog.meal.alternative.step.add.the.trimmed.beef.and.cook.through=Add the trimmed beef and cook through. Mussels or shrimp usually take 5–8 minutes and beef strips 10–15 minutes.
catalog.meal.alternative.step.add.the.trimmed.beef.and.remaining.cooking=Add the trimmed beef and remaining cooking ingredients with about 150–250 ml of water. Cover and simmer for 60–90 minutes until tender.
catalog.meal.alternative.step.add.the.turkey.breast.and.cook.through=Add the turkey breast and cook through. Mussels or shrimp usually take 5–8 minutes and beef strips 10–15 minutes.
catalog.meal.alternative.step.add.the.turkey.breast.and.remaining.cooking=Add the turkey breast and remaining cooking ingredients with about 150–250 ml water. Cover and cook for 20–30 minutes.
catalog.meal.alternative.step.arrange.the.remaining.ingredients.on.the.toast=Arrange the remaining ingredients on the toast or serve separately. If desired, broil the cheese for 3–4 minutes.
catalog.meal.alternative.step.bake.the.chicken.until.cooked.through=Bake the chicken until cooked through.
catalog.meal.alternative.step.bake.the.fish.and.potatoes.with.the=Bake the fish and potatoes with the olive oil.
catalog.meal.alternative.step.bake.the.fish.cook.the.rice.and=Bake the fish, cook the rice and steam the broccoli.
catalog.meal.alternative.step.bake.the.fish.fillet.at.200.c=Bake the fish fillet at 200°C for 15–20 minutes until opaque in the center and easy to flake. Use only part of the total olive oil listed.
catalog.meal.alternative.step.beat.the.egg.with.the.yogurt.and=Beat the egg with the yogurt and pour over the moussaka. Bake for another 15–20 minutes until the topping is set and the center reaches at least 71°C.
catalog.meal.alternative.step.beat.the.eggs.and.egg.whites.if=Beat the eggs and egg whites if listed. Add to the pan and cook over low heat until fully set.
catalog.meal.alternative.step.beat.the.eggs.and.mix.with.the=Beat the eggs and mix with the listed vegetables and cheese, or make wells in the tomato sauce for whole eggs. Bake at 180°C for 20–25 minutes until set.
catalog.meal.alternative.step.blend.all.listed.ingredients.to.a.thick=Blend all listed ingredients to a thick mixture. Shape into 4–6 bites and chill for 30 minutes. The entire batch is one portion.
catalog.meal.alternative.step.blend.cooked.legumes.or.the.dairy.base=Blend cooked legumes or the dairy base with any listed tahini, lemon, garlic and seasonings. Thin with water.
catalog.meal.alternative.step.blend.the.cooked.cauliflower.with.milk.and=Blend the cooked cauliflower with milk and serve the peas separately.
catalog.meal.alternative.step.blend.the.hazelnuts.with.a.little.water=Blend the hazelnuts with a little water to make an unsweetened spread.
catalog.meal.alternative.step.blend.the.peas.with.milk.to.make=Blend the peas with milk to make a mash.
catalog.meal.alternative.step.blend.the.walnuts.with.greek.yogurt.and=Blend the walnuts with Greek yogurt and 1–2 tablespoons of water to make a sauce. Add it to the finished dish off the heat.
catalog.meal.alternative.step.boil.the.cauliflower.and.blend.it.with=Boil the cauliflower and blend it with the milk.
catalog.meal.alternative.step.boil.the.eggs=Boil the eggs.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes=Boil the eggs for 9–10 minutes after the water comes to a boil. Cool, peel and chop for the salad. The weight excludes the shells.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes.2=Boil the eggs for 9–10 minutes after the water comes to a boil, then cool and peel. The weight excludes the shells.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes.3=Boil the eggs for 9–10 minutes after the water comes to a boil. Cool, peel and chop them. Toast the bread or bun and top with eggs, yellow cheese. Broil the cheese on top of the toast for 2–3 minutes. Add the listed cheese to the finished dish. Grate yellow cheese, or let mozzarella melt for 1–2 minutes.
catalog.meal.alternative.step.boil.the.eggs.for.9.10.minutes.4=Boil the eggs for 9–10 minutes after the water comes to a boil. Cool, peel and chop them. Toast the bread or bun and top with eggs.
catalog.meal.alternative.step.boil.the.green.beans.for.10.15=Boil the green beans for 10–15 minutes until tender, then drain.
catalog.meal.alternative.step.boil.the.potatoes.for.15.20.minutes=Boil the potatoes for 15–20 minutes until tender.
catalog.meal.alternative.step.break.the.broccoli.into.florets.and.cook=Break the broccoli into florets and cook with a little water until tender.
catalog.meal.alternative.step.chop.and.cook.the.turkey.breast.separately=Chop and cook the turkey breast separately before assembling.
catalog.meal.alternative.step.chop.any.fruit.place.the.dairy.ingredients=Chop any fruit, place the dairy ingredients in a bowl and add the remaining listed ingredients.
catalog.meal.alternative.step.chop.red.bell.pepper.and.cook.covered=Chop red bell pepper and cook covered in a pan with some of the measured olive oil and 30 g of water for 7–10 minutes.
catalog.meal.alternative.step.chop.spinach.tomatoes.and.cook.covered.for=Chop spinach, tomatoes and cook covered for 4–6 minutes with the listed olive oil and 20 g of water.
catalog.meal.alternative.step.chop.the.mushrooms.and.cook.in.some=Chop the mushrooms and cook in some measured olive oil for 8–10 minutes. Cool slightly and stir in yogurt to make a mushroom sauce. Do not boil the yogurt.
catalog.meal.alternative.step.chop.the.onion.and.peppers.and.cook=Chop the onion and peppers and cook them in the listed olive oil and 2 tablespoons of water for 6–8 minutes.
catalog.meal.alternative.step.chop.the.potatoes.and.boil.until.tender=Chop the potatoes and boil until tender, or roast at 200°C for 30–40 minutes with some of the measured fat.
catalog.meal.alternative.step.chop.the.raw.peeled.potatoes.and.roast=Chop the raw peeled potatoes and roast at 200°C with some of the measured oil for 25–35 minutes, until tender.
catalog.meal.alternative.step.chop.the.remaining.vegetables.cook.the.filling=Chop the remaining vegetables. Cook the filling in the listed fat. If using ground meat, add it and break it up as it cooks. Stir in cooked grains or legumes.
catalog.meal.alternative.step.chop.the.tomato.and.cucumber=Chop the tomato and cucumber.
catalog.meal.alternative.step.chop.the.vegetables.and.cook.them.in=Chop the vegetables and cook them in the listed fat with 2–3 tablespoons of water for 7–10 minutes.
catalog.meal.alternative.step.chop.the.vegetables.cook.the.onion.carrots=Chop the vegetables. Cook the onion, carrots or peppers, if listed, in the olive oil with a little water for 5–7 minutes.
catalog.meal.alternative.step.chop.the.vegetables.for.the.pan.cook=Chop the vegetables for the pan. Cook them for 5–7 minutes with the listed olive oil and a little water. Reserve the fresh salad and avocado for serving.
catalog.meal.alternative.step.combine.the.protein.vegetables.and.any.listed=Combine the protein, vegetables and any listed cooked side. After removing from the heat, add any listed lemon, yogurt sauce or nuts.
catalog.meal.alternative.step.cook.broccoli.cauliflower.or.spinach.until.tender=Cook broccoli, cauliflower or spinach until tender if included. Serve fresh vegetables, olives and yogurt sauce separately. Use only the listed ingredients and total measured olive oil.
catalog.meal.alternative.step.cook.dry.buckwheat.separately.in.plenty.of=Cook dry buckwheat separately in plenty of water according to the package directions. Drain and use only the listed fat.
catalog.meal.alternative.step.cook.dry.bulgur.separately.in.plenty.of=Cook dry bulgur separately in plenty of water according to the package directions. Drain and use only the listed fat.
catalog.meal.alternative.step.cook.dry.quinoa.separately.in.plenty.of=Cook dry quinoa separately in plenty of water according to the package directions. Drain and use only the listed fat.
catalog.meal.alternative.step.cook.fish.and.shellfish.to.63.c=Cook fish and shellfish to 63°C. Shrimp and squid should turn opaque.
catalog.meal.alternative.step.cook.poultry.to.at.least.74.c=Cook poultry to at least 74°C in the center.
catalog.meal.alternative.step.cook.the.apple.with.a.little.water=Cook the apple with a little water and mash it into an unsweetened sauce.
catalog.meal.alternative.step.cook.the.broccoli.with.a.little.water=Cook the broccoli with a little water.
catalog.meal.alternative.step.cook.the.bulgur.bake.the.fish.and=Cook the bulgur, bake the fish and steam the vegetables.
catalog.meal.alternative.step.cook.the.carrot.then.add.cooked.lentils=Cook the carrot, then add cooked lentils and tomato.
catalog.meal.alternative.step.cook.the.chicken.breast.separately.in.a=Cook the chicken breast separately in a nonstick pan with the listed fat or a little water. Cool before mixing.
catalog.meal.alternative.step.cook.the.chicken.with.tomato.and.zucchini=Cook the chicken with tomato and zucchini until cooked through.
catalog.meal.alternative.step.cook.the.dry.rice.separately.in.plenty=Cook the dry rice separately in plenty of water according to the package directions. Drain and use only the listed fat.
catalog.meal.alternative.step.cook.the.dry.side.dish.according.to=Cook the dry side dish according to the package directions without extra fat. Drain if needed.
catalog.meal.alternative.step.cook.the.dry.whole.grain.couscous.separately=Cook the dry whole-grain couscous separately in plenty of water according to the package directions. Drain and use only the listed fat.
catalog.meal.alternative.step.cook.the.dry.whole.grain.pasta.separately=Cook the dry whole-grain pasta separately in plenty of water according to the package directions. Drain and use only the listed fat.
catalog.meal.alternative.step.cook.the.garlic.in.the.listed.olive=Cook the garlic in the listed olive oil for 30 seconds. Add the tomatoes for 6–8 minutes and the shrimp for another 3–5 minutes, until opaque.
catalog.meal.alternative.step.cook.the.mushrooms.in.the.measured.olive=Cook the mushrooms in the measured olive oil and a little water for 10 minutes and serve with the rolls.
catalog.meal.alternative.step.cook.the.oats.in.milk.then.add=Cook the oats in milk, then add the apple and peanut butter.
catalog.meal.alternative.step.cook.the.oats.in.the.listed.milk=Cook the oats in the listed milk and a little water over low heat for 5–7 minutes, stirring.
catalog.meal.alternative.step.cook.the.omelet.with.spinach.and.the=Cook the omelet with spinach and the measured olive oil.
catalog.meal.alternative.step.cook.the.pasta=Cook the pasta.
catalog.meal.alternative.step.cook.the.pasta.and.saut.the.tomato=Cook the pasta and sauté the tomato and spinach. Add the drained tuna and olive oil.
catalog.meal.alternative.step.cook.the.pepper.and.spinach=Cook the pepper and spinach.
catalog.meal.alternative.step.cook.the.protein.separately.until.done.and=Cook the protein separately until done and remove it from the pan. Cook the vegetables in the remaining fat and a little water for 8–12 minutes.
catalog.meal.alternative.step.cook.the.rice=Cook the rice.
catalog.meal.alternative.step.cook.the.rice.separately=Cook the rice separately.
catalog.meal.alternative.step.cook.the.shrimp.separately.in.a.nonstick=Cook the shrimp separately in a nonstick pan with the listed fat or a little water. Cool before mixing.
catalog.meal.alternative.step.cook.the.side.vegetables.in.the.remaining=Cook the side vegetables in the remaining fat and serve with the cooked grains, cheeses and listed fresh ingredients.
catalog.meal.alternative.step.cook.the.spinach.for.2.3.minutes=Cook the spinach for 2–3 minutes and drain. Butterfly the breast into a thin layer, fill with spinach and cheese, roll up and secure with a toothpick. Bake at 190°C for about 25–30 minutes until the center reaches at least 74°C.
catalog.meal.alternative.step.cook.the.turkey.breast.separately.in.a=Cook the turkey breast separately in a nonstick pan with the listed fat or a little water. Cool before mixing.
catalog.meal.alternative.step.cook.the.vegetables.in.the.measured.olive=Cook the vegetables in the measured olive oil for 5–7 minutes. Add any listed tomatoes and cook for another 8–10 minutes.
catalog.meal.alternative.step.cook.whole.cuts.of.meat.to.at=Cook whole cuts of meat to at least 63°C and rest for 3 minutes. If making ragù, keep cooking until tender.
catalog.meal.alternative.step.cook.with.the.measured.olive.oil.and=Cook with the measured olive oil and add the fruit.
catalog.meal.alternative.step.core.or.pit.and.slice.the.fruit=Core or pit and slice the fruit. Bake at 180°C for 18–25 minutes with 2–3 tablespoons of water and no added sugar.
catalog.meal.alternative.step.crumble.the.tofu.into.the.vegetables.and=Crumble the tofu into the vegetables and stir for 5–6 minutes until heated through.
catalog.meal.alternative.step.cut.chicken.breast.into.even.cubes.thread=Cut chicken breast into even cubes, thread onto skewers and brush with some of the measured olive oil. Bake at 200°C for 18–25 minutes, turning once.
catalog.meal.alternative.step.cut.everything.into.similar.sized.pieces.and=Cut everything into similar-sized pieces and roast until the meat is cooked through.
catalog.meal.alternative.step.cut.the.meat.tofu.or.seafood.and=Cut the meat, tofu or seafood and vegetables into small pieces. Heat a pan with half the measured olive oil.
catalog.meal.alternative.step.cut.the.pork.into.roughly.2.cm=Cut the pork into roughly 2 cm pieces. Toss with some of the olive oil and lemon and thread onto skewers. Roast separately from the potatoes.
catalog.meal.alternative.step.cut.the.turkey.and.pepper.into.cubes=Cut the turkey and pepper into cubes, thread onto skewers and brush with some of the listed olive oil.
catalog.meal.alternative.step.cut.the.vegetables.evenly.toss.with.the=Cut the vegetables evenly. Toss with the listed fat and spread on a lined tray. Roast dense vegetables and potatoes at 200°C for 30–40 minutes and softer ones for 20–25 minutes.
catalog.meal.alternative.step.dice.the.potatoes.and.boil.for.10=Dice the potatoes and boil for 10 minutes. Cook the onion and tomatoes in the listed olive oil with a little water for 8 minutes.
catalog.meal.alternative.step.dice.the.potatoes.and.boil.for.15=Dice the potatoes and boil for 15–20 minutes until tender.
catalog.meal.alternative.step.dice.the.potatoes.boil.for.12.15=Dice the potatoes, boil for 12–15 minutes and drain. Add them to the pan before the eggs.
catalog.meal.alternative.step.dice.the.potatoes.boil.for.15.20=Dice the potatoes, boil for 15–20 minutes until tender and add to the pan.
catalog.meal.alternative.step.dice.the.pumpkin.and.roast.on.baking=Dice the pumpkin and roast on baking paper at 190°C for 25–30 minutes until tender.
catalog.meal.alternative.step.dice.the.turkey.and.cook.it.separately=Dice the turkey and cook it separately to 74°C before adding it to the eggs.
catalog.meal.alternative.step.divide.the.olive.oil.among.them=Divide the olive oil among them.
catalog.meal.alternative.step.divide.the.total.listed.olive.oil.between=Divide the total listed olive oil between cooking and the salad.
catalog.meal.alternative.step.finely.chop.the.dates.and.scatter.over=Finely chop the dates and scatter over the yogurt.
catalog.meal.alternative.step.for.the.tzatziki.grate.and.drain.the=For the tzatziki, grate and drain the cucumber, then mix with Greek yogurt, garlic and dill.
catalog.meal.alternative.step.grate.and.drain.some.of.the.cucumber=Grate and drain some of the cucumber, then mix with yogurt, garlic and dill for tzatziki.
catalog.meal.alternative.step.grate.the.cauliflower.into.fine.pieces.cook=Grate the cauliflower into fine pieces. Cook it separately with some of the listed olive oil for 5–7 minutes. This is a vegetable side without rice.
catalog.meal.alternative.step.grind.the.meat.or.mash.the.cooked=Grind the meat or mash the cooked chickpeas, depending on the ingredients. Mix with the egg, finely chopped onion and fresh herbs if listed.
catalog.meal.alternative.step.grind.the.oats.and.mix.with.the=Grind the oats and mix with the eggs and milk.
catalog.meal.alternative.step.grind.the.oats.and.mix.with.the.2=Grind the oats and mix with the eggs and listed milk or cottage cheese. Mash the banana and stir it into the batter. Let it rest for 5 minutes. Coat a nonstick pan with all the measured olive oil and cook small pancakes for 2–3 minutes per side until fully set.
catalog.meal.alternative.step.grind.the.oats.and.mix.with.the.3=Grind the oats and mix with the eggs and listed milk or cottage cheese. Let it rest for 5 minutes. Coat a nonstick pan with all the measured olive oil and cook small pancakes for 2–3 minutes per side until fully set. Serve with sliced strawberries.
catalog.meal.alternative.step.grind.the.oats.or.buckwheat.into.flour=Grind the oats or buckwheat into flour if listed. Mix with the eggs, dairy base and flaxseed if included. Add a little water only as needed.
catalog.meal.alternative.step.ground.meat.should.reach.at.least.71=Ground meat should reach at least 71°C in the center.
catalog.meal.alternative.step.halve.and.hollow.out.the.eggplant.roast=Halve and hollow out the eggplant. Roast the empty halves at 190°C for 10 minutes.
catalog.meal.alternative.step.halve.and.hollow.out.the.peppers.roast=Halve and hollow out the peppers. Roast the empty halves at 190°C for 10 minutes.
catalog.meal.alternative.step.halve.and.hollow.out.the.zucchini.roast=Halve and hollow out the zucchini. Roast the empty halves at 190°C for 10 minutes.
catalog.meal.alternative.step.halve.the.pear.and.bake.at.180=Halve the pear and bake at 180°C for 20–25 minutes with 2 tablespoons of water.
catalog.meal.alternative.step.heat.a.nonstick.pan.with.the.listed=Heat a nonstick pan with the listed olive oil. Beat the eggs, pour them into the pan and cook covered over low heat until completely set. Add the listed white or yellow cheese during the last minute. Serve with whole-grain bread.
catalog.meal.alternative.step.let.cool.slightly.and.serve.with.the=Let cool slightly and serve with the listed dairy, tahini and nuts.
catalog.meal.alternative.step.let.the.batter.rest.for.10.minutes=Let the batter rest for 10 minutes. Use the full measured amount of fat across the pancakes. Cook small pancakes for 2–3 minutes per side until done.
catalog.meal.alternative.step.let.the.batter.rest.for.5.minutes=Let the batter rest for 5 minutes. Coat a nonstick pan with the full amount of measured olive oil and cook small pancakes for 2–3 minutes per side until set.
catalog.meal.alternative.step.let.the.oats.soften.in.the.dairy=Let the oats soften in the dairy base in the refrigerator for at least 20 minutes.
catalog.meal.alternative.step.let.the.oats.soften.in.the.yogurt=Let the oats soften in the yogurt and add the fruit.
catalog.meal.alternative.step.make.wells.in.the.sauce.and.crack=Make wells in the sauce and crack in the eggs. Cover and cook for around 8–10 minutes until whites and yolks are set. Aim for an internal temperature of about 71°C.
catalog.meal.alternative.step.make.wells.in.the.tomatoes.and.add=Make wells in the tomatoes and add the eggs. Cover and cook until the eggs are fully set.
catalog.meal.alternative.step.mash.the.cooked.potatoes.with.milk.and=Mash the cooked potatoes with milk and add the mozzarella.
catalog.meal.alternative.step.measure.the.cooked.drained.legumes.warm.with=Measure the cooked, drained legumes. Warm with a little water and use only the measured fat.
catalog.meal.alternative.step.mix.the.greek.yogurt.and.lemon.juice=Mix the Greek yogurt and lemon juice for a cold sauce. Refrigerate it while you prepare the chicken.
catalog.meal.alternative.step.mix.the.greek.yogurt.with.lemon.juice=Mix the Greek yogurt with lemon juice to make a sauce. Keep it chilled until serving.
catalog.meal.alternative.step.mix.the.listed.chia.oats.or.flaxseed=Mix the listed chia, oats or flaxseed into the dairy base. Refrigerate for at least 2 hours.
catalog.meal.alternative.step.mix.the.oats.and.yogurt.leave.for=Mix the oats and yogurt, leave for 15 minutes and add the banana and walnuts.
catalog.meal.alternative.step.mix.the.oats.into.the.dairy.base=Mix the oats into the dairy base and let them soften for 15 minutes. Weigh and serve together: 2% plain yogurt, oats.
catalog.meal.alternative.step.mix.the.potatoes.with.the.cooked.lentils=Mix the potatoes with the cooked lentils and tomato sauce. Transfer to a baking dish and bake at 190°C for 20 minutes.
catalog.meal.alternative.step.mix.with.cooked.lentils.and.saut.ed=Mix with cooked lentils and sautéed vegetables, then add the cheese.
catalog.meal.alternative.step.place.the.plain.tofu.on.a.separate=Place the plain tofu on a separate part of the tray. Roast until done. Allow roughly 20–30 minutes for fillets or 25–35 minutes for individual pork and beef portions when using those.
catalog.meal.alternative.step.place.the.pork.tenderloin.on.a.separate=Place the pork tenderloin on a separate part of the tray. Roast until cooked through, roughly 20–30 minutes for fillets or 25–35 minutes for individual pork and beef portions.
catalog.meal.alternative.step.place.the.trimmed.beef.on.a.separate=Place the trimmed beef on a separate part of the tray. Roast until cooked through, roughly 20–30 minutes for fillets or 25–35 minutes for individual pork and beef portions.
catalog.meal.alternative.step.place.the.turkey.breast.on.a.separate=Place the turkey breast on a separate part of the tray. Roast until cooked through, roughly 20–30 minutes for fillets or 25–35 minutes for individual pork and beef portions.
catalog.meal.alternative.step.preheat.the.oven.to.200.c.dice=Preheat the oven to 200°C. Dice the potatoes, toss with part of the listed olive oil and roast for 30–35 minutes.
catalog.meal.alternative.step.prepare.and.slice.apple.weigh.and.serve=Prepare and slice: apple. Weigh and serve together: 5% cottage cheese, apple.
catalog.meal.alternative.step.prepare.and.slice.apple.weigh.and.serve.2=Prepare and slice: apple. Weigh and serve together: apple, 2% plain yogurt.
catalog.meal.alternative.step.prepare.and.slice.apple.weigh.and.serve.3=Prepare and slice: apple. Weigh and serve together: apple, walnuts.
catalog.meal.alternative.step.prepare.and.slice.banana.weigh.and.serve=Prepare and slice: banana. Weigh and serve together: banana, almonds.
catalog.meal.alternative.step.prepare.and.slice.banana.weigh.and.serve.2=Prepare and slice: banana. Weigh and serve together: banana, unsweetened peanut butter.
catalog.meal.alternative.step.prepare.and.slice.figs=Prepare and slice: figs.
catalog.meal.alternative.step.prepare.and.slice.pear.weigh.and.serve=Prepare and slice: pear. Weigh and serve together: 5% cottage cheese, pear.
catalog.meal.alternative.step.put.the.fish.in.a.baking.dish=Put the fish in a baking dish with some of the listed olive oil and lemon if included. Bake at 190°C for around 15–25 minutes depending on thickness.
catalog.meal.alternative.step.refrigerate.for.15.minutes.to.soften.the=Refrigerate for 15 minutes to soften the oats and seeds.
catalog.meal.alternative.step.remove.from.the.heat.add.cottage.cheese=Remove from the heat. Add cottage cheese, yogurt or skyr if listed and top with the fruit and nuts.
catalog.meal.alternative.step.rinse.and.drain.the.beans.and.fish=Rinse and drain the beans and fish. Mix with vegetables and olive oil.
catalog.meal.alternative.step.roast.the.carrot.sticks.on.baking.paper=Roast the carrot sticks on baking paper at 200°C for 25 minutes.
catalog.meal.alternative.step.roast.the.meat.and.vegetables.in.the=Roast the meat and vegetables in the olive oil until cooked through.
catalog.meal.alternative.step.roast.the.meat.until.cooked.through.and=Roast the meat until cooked through and the potatoes until tender.
catalog.meal.alternative.step.roast.the.pepper.at.220.c.for=Roast the pepper at 220°C for 20 minutes, cover it for 5 minutes, then peel.
catalog.meal.alternative.step.roast.the.raw.turkey.until.cooked.through=Roast the raw turkey until cooked through and the potatoes until tender.
catalog.meal.alternative.step.roast.the.sliced.zucchini.at.200.c=Roast the sliced zucchini at 200°C for 20 minutes with some of the measured olive oil.
catalog.meal.alternative.step.roast.the.zucchini.rounds.at.200.c=Roast the zucchini rounds at 200°C for 20 minutes.
catalog.meal.alternative.step.serve.immediately.do.not.add.unlisted.sugar=Serve immediately. Do not add unlisted sugar or juice.
catalog.meal.alternative.step.serve.separately.or.together.in.a.bowl=Serve separately or together in a bowl with the sliced apple.
catalog.meal.alternative.step.serve.sliced.orange.with.the.yogurt=Serve sliced orange with the yogurt.
catalog.meal.alternative.step.serve.with.cheese.and.bread=Serve with cheese and bread.
catalog.meal.alternative.step.serve.with.the.bread.cheese.and.cucumber=Serve with the bread, cheese and cucumber.
catalog.meal.alternative.step.serve.with.the.chopped.vegetables.seeds.and=Serve with the chopped vegetables, seeds and bread if listed.
catalog.meal.alternative.step.serve.with.the.listed.fruit.dairy.cream=Serve with the listed fruit, dairy cream and nuts. Do not add sugar or unlisted toppings.
catalog.meal.alternative.step.serve.with.the.listed.whole.grain.bread=Serve with the listed whole-grain bread.
catalog.meal.alternative.step.shape.4.5.small.patties.brush.with=Shape 4–5 small patties, brush with half the measured olive oil and bake at 200°C for 20–25 minutes, turning halfway through.
catalog.meal.alternative.step.slice.the.pear.and.add.crushed.walnuts=Slice the pear and add crushed walnuts.
catalog.meal.alternative.step.soak.the.dates.in.warm.water.for=Soak the dates in warm water for 10 minutes, then drain. Grind the nuts and oats.
catalog.meal.alternative.step.soak.the.oats.in.milk.for.15=Soak the oats in milk for 15 minutes and add the pear and nuts.
catalog.meal.alternative.step.stir.in.the.yogurt.to.make.a=Stir in the yogurt to make a creamy sauce. Do not boil after adding it.
catalog.meal.alternative.step.stir.the.berries.into.the.cottage.cheese=Stir the berries into the cottage cheese.
catalog.meal.alternative.step.stuff.the.vegetables.and.add.the.tomatoes=Stuff the vegetables and add the tomatoes and 80–120 ml water to the tray. Bake at 190°C for another 25–35 minutes, adding the listed cheese in the last 5 minutes.
catalog.meal.alternative.step.the.egg.mixture.should.be.completely.set=The egg mixture should be completely set, at about 71°C in the center.
catalog.meal.alternative.step.the.listed.legumes.are.already.cooked.add=The listed legumes are already cooked. Add them in the last 8–10 minutes. Stir in dairy and fresh herbs after removing from the heat and serve the bread separately.
catalog.meal.alternative.step.thinly.slice.the.eggplant.brush.with.the=Thinly slice the eggplant, brush with the measured olive oil and roast at 200°C for 20–25 minutes.
catalog.meal.alternative.step.toast.the.bread.in.a.dry.pan=Toast the bread in a dry pan or toaster. Spread with the listed dairy base, hummus or avocado if included.
catalog.meal.alternative.step.toast.the.bread.or.bun.and.top=Toast the bread or bun and top with tomatoes, feta.
catalog.meal.alternative.step.toast.the.bread.or.bun.and.top.2=Toast the bread or bun and top with eggs, tomatoes, olives.
catalog.meal.alternative.step.toast.the.bread.until.crisp.moisten.lightly=Toast the bread until crisp, moisten lightly with water and top with the tomatoes.
catalog.meal.alternative.step.toss.the.sauce.with.the.cooked.pasta=Toss the sauce with the cooked pasta. Add ricotta, legumes and fresh herbs if listed.
catalog.meal.alternative.step.use.only.the.measured.fat=Use only the measured fat.
catalog.meal.alternative.step.use.the.cooked.drained.legumes.if.listed=Use the cooked, drained legumes if listed. Chop the vegetables and combine with the listed grains, protein and cheese.
catalog.meal.alternative.step.use.the.total.olive.oil.listed.for=Use the total olive oil listed for both cooking and the salad.
catalog.meal.alternative.step.warm.the.tortilla.in.a.dry.pan=Warm the tortilla in a dry pan for 30 seconds. Chop the fresh vegetables, add the prepared filling and roll up the tortilla.
catalog.meal.alternative.step.wash.and.chop.the.fruit.blend.all=Wash and chop the fruit. Blend all listed ingredients and add water to reach the desired consistency.
catalog.meal.alternative.step.wash.and.chop.the.remaining.vegetables.mix=Wash and chop the remaining vegetables. Mix with the legumes and side dish and add the remaining measured olive oil.
