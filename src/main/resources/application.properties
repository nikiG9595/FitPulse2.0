spring.application.name=FitPulse
server.port=8080
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=never
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
spring.web.locale=bg_BG
spring.web.locale-resolver=fixed
spring.mvc.contentnegotiation.media-types.webmanifest=application/manifest+json
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
fitpulse.support.storage-dir=${FITPULSE_SUPPORT_STORAGE:${user.home}/.fitpulse/support}

fitpulse.profile.photo-dir=${FITPULSE_PROFILE_PHOTO_DIR:${user.home}/.fitpulse/avatars}
