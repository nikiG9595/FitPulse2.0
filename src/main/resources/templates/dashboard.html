<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Моето табло')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>Моето табло</h1><section class="fit-card mb-4" th:if="${!#lists.isEmpty(reminders)}"><h2 class="h4">Напомняния</h2><article th:each="r:${reminders}" class="mb-2"><strong th:text="${r.title}"></strong> <span th:text="${#temporals.format(r.startsAt,'dd.MM.yyyy HH:mm')}"></span><form class="d-inline" method="post" th:action="@{/calendar/{id}/dismiss-reminder(id=${r.id})}"><button class="btn btn-sm btn-outline-dark">Разбрах</button></form></article></section><div class="row g-4"><section class="col-md-6"><div class="fit-card"><h2 class="h4">Предстоящи тренировки</h2><p th:if="${#lists.isEmpty(upcoming)}">Нямате предстоящи тренировки.</p><article class="mb-3" th:each="e:${upcoming}"><strong th:text="${e.title}"></strong><p th:text="${#temporals.format(e.startsAt,'dd.MM.yyyy HH:mm')}"></p></article><a class="btn btn-pulse" th:href="@{/calendar}">Календар</a></div></section><section class="col-md-6"><div class="fit-card"><h2 class="h4">Активни програми</h2><p th:if="${#lists.isEmpty(programs)}">Все още няма активни програми.</p><p th:each="p:${programs}"><a th:href="@{/programs/my/{id}(id=${p.id})}" th:text="${p.displayName}"></a></p><a class="btn btn-outline-dark" th:href="@{/programs}">Библиотека с програми</a><h2 class="h4 mt-4">Моите хранителни режими</h2><p th:each="p:${mealPlans}" th:text="${p.name}"></p><a th:href="@{/programs/my}">Управлявай моите планове</a></div></section></div><div class="d-flex flex-wrap gap-2 mt-4"><a class="btn btn-pulse" th:href="@{/journal}">Тренировъчен дневник</a><a class="btn btn-outline-dark" th:href="@{/progress}">Моят прогрес</a><a class="btn btn-outline-dark" th:href="@{/profile}">Профил и любими фитнеси</a></div></main></body></html>
