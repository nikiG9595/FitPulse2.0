<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Вход')}"></head><body class="auth-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container auth-page"><div class="auth-card"><h1>Добре дошли отново</h1><p class="text-muted">Влезте в своя FitPulse профил.</p><div th:if="${param.error}" class="alert alert-danger">Невалидно потребителско име или парола.</div><div th:if="${param.registered}" class="alert alert-success">Регистрацията е успешна. Вече можете да влезете.</div><form method="post" th:action="@{/login}"><input type="hidden" name="returnTo" th:value="${authReturnTo}"><label>Потребителско име</label><input class="form-control" name="username" autocomplete="username"><label>Парола</label><input class="form-control" type="password" name="password" autocomplete="current-password"><button class="btn btn-pulse w-100 mt-4">Вход</button></form><p class="mt-3 mb-0">Нямате профил? <a th:href="@{/register(returnTo=${authReturnTo})}">Регистрирайте се</a></p></div></main></body></html>
