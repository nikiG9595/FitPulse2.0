<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{nav.login})}"></head><body class="auth-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container auth-page"><div class="auth-card"><h1>[[#{ui.welcome}]]</h1><p class="text-muted">[[#{ui.sign.in.to.your.fitpulse.account}]]</p><div th:if="${param.error}" class="alert alert-danger">[[#{ui.invalid.sign.in.details}]]</div><div th:if="${param.registered}" class="alert alert-success">[[#{ui.registration.successful.you.can.now.sign.in}]]</div><form method="post" th:action="@{/login}"><input type="hidden" name="returnTo" th:value="${authReturnTo}"><label for="login-identifier">[[#{ui.username.or.email}]]</label><input class="form-control" id="login-identifier" name="username" autocomplete="username"><label>[[#{ui.password}]]</label><input class="form-control" type="password" name="password" autocomplete="current-password"><button class="btn btn-pulse w-100 mt-4">[[#{nav.login}]]</button></form><p class="mt-3">[[#{ui.having.trouble.signing.in.or.registering}]] <a th:href="@{/support}">[[#{ui.contact.us}]]</a></p><p class="mt-3 mb-0">[[#{ui.need.an.account}]] <a th:href="@{/register(returnTo=${authReturnTo})}">[[#{ui.sign.up}]]</a></p></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
