<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Регистрация')}"></head><body class="auth-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container auth-page"><div class="auth-card"><h1>Създаване на профил</h1><p class="text-muted">Присъединете се към FitPulse безплатно.</p><div th:if="${globalError}" class="alert alert-danger" th:text="${globalError}"></div><form th:action="@{/register}" th:object="${registerRequest}" method="post"><label>Потребителско име</label><input class="form-control" th:field="*{username}"><div class="field-error" th:errors="*{username}"></div><label>Имейл</label><input class="form-control" type="email" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div><label>Парола</label><input class="form-control" type="password" th:field="*{password}"><div class="field-error" th:errors="*{password}"></div><label>Потвърдете паролата</label><input class="form-control" type="password" th:field="*{confirmPassword}"><div class="field-error" th:errors="*{confirmPassword}"></div><button class="btn btn-pulse w-100 mt-4">Регистрация</button></form></div></main></body></html>
