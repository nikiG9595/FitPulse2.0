<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{nav.register})}"></head><body class="auth-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container auth-page"><div class="auth-card"><h1>[[#{ui.create.an.account}]]</h1><p class="text-muted">[[#{ui.join.fitpulse}]]</p><div th:if="${globalError}" class="alert alert-danger" th:text="${@uiText.label(globalError)}"></div><form th:action="@{/register}" th:object="${registerRequest}" method="post"><input type="hidden" name="returnTo" th:value="${authReturnTo}"><label>[[#{ui.username}]]</label><input class="form-control" th:field="*{username}"><div class="field-error" th:errors="*{username}"></div><label>[[#{ui.email}]]</label><input class="form-control" type="email" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div><label>[[#{ui.password}]]</label><input class="form-control" type="password" th:field="*{password}"><div class="field-error" th:errors="*{password}"></div><label>[[#{ui.confirm.password}]]</label><input class="form-control" type="password" th:field="*{confirmPassword}"><div class="field-error" th:errors="*{confirmPassword}"></div><input type="hidden" name="termsVersion" th:value="${termsVersion}">
<div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" th:field="*{termsAccepted}" required aria-describedby="terms-error">
    <label class="form-check-label" for="termsAccepted">[[#{legal.terms.accept}]] <a th:href="@{/terms}" target="_blank" rel="noopener noreferrer">[[#{legal.terms.title}]]</a></label>
    <div id="terms-error" class="field-error" th:errors="*{termsAccepted}"></div>
</div>
<button class="btn btn-pulse w-100 mt-4">[[#{nav.register}]]</button></form><p class="mt-3">[[#{ui.having.trouble.signing.in.or.registering}]] <a th:href="@{/support}">[[#{ui.contact.us}]]</a></p><p class="mt-3">[[#{ui.already.have.an.account}]] <a th:href="@{/login(returnTo=${authReturnTo})}">[[#{nav.login}]]</a></p></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
