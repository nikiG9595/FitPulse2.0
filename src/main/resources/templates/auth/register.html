<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{nav.register})}"></head><body class="auth-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container auth-page"><div class="auth-card"><h1>[[#{ui.create.an.account}]]</h1><p class="text-muted">[[#{ui.join.fitpulse}]]</p><div th:if="${globalError}" class="alert alert-danger" th:text="${@uiText.label(globalError)}"></div><form th:action="@{/register}" th:object="${registerRequest}" method="post"><input type="hidden" name="returnTo" th:value="${authReturnTo}"><label>[[#{ui.username}]]</label><input class="form-control" th:field="*{username}"><div class="field-error" th:errors="*{username}"></div><label>[[#{ui.email}]]</label><input class="form-control" type="email" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div><label for="password">[[#{ui.password}]]</label><input class="form-control" type="password" autocomplete="new-password" th:field="*{password}"><div class="field-error" th:errors="*{password}"></div><label for="confirmPassword">[[#{ui.confirm.password}]]</label><input class="form-control" type="password" autocomplete="new-password" th:field="*{confirmPassword}"><div class="field-error" th:errors="*{confirmPassword}"></div><input type="hidden" name="termsVersion" th:value="${termsVersion}">
<div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" th:field="*{termsAccepted}" required aria-describedby="terms-error">
    <label class="form-check-label" for="termsAccepted">[[#{legal.terms.accept}]] <a th:href="@{/terms}" target="_blank" rel="noopener noreferrer">[[#{legal.terms.title}]]</a></label>
    <div id="terms-error" class="field-error" th:errors="*{termsAccepted}"></div>
</div>
<button class="btn btn-pulse w-100 mt-4">[[#{nav.register}]]</button></form>
<p class="alert alert-danger mt-3" th:if="${param.googleTerms}">[[#{auth.google.terms}]]</p>
<div th:replace="~{fragments/google-failure :: message}"></div>
<form th:if="${@googleLogin.enabled}" class="mt-3" method="post" th:action="@{/register/google}">
    <div th:replace="~{fragments/google-button :: divider}"></div>
    <input type="hidden" name="termsVersion" th:value="${termsVersion}">
    <div class="form-check">
        <input class="form-check-input" id="google-terms" type="checkbox" name="termsAccepted" value="true" required>
        <label class="form-check-label" for="google-terms">[[#{legal.terms.accept}]] <a th:href="@{/terms}" target="_blank" rel="noopener noreferrer">[[#{legal.terms.title}]]</a></label>
    </div>
    <button class="google-auth-button mt-2" type="submit">
        <th:block th:replace="~{fragments/google-button :: label}"></th:block>
    </button>
</form>
<p class="mt-3">[[#{ui.having.trouble.signing.in.or.registering}]] <a th:href="@{/support}">[[#{ui.contact.us}]]</a></p><p class="mt-3">[[#{ui.already.have.an.account}]] <a th:href="@{/login(returnTo=${authReturnTo})}">[[#{nav.login}]]</a></p></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
