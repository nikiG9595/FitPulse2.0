<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Тренировъчен календар')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><div><h1>Личен тренировъчен календар</h1><p>Това са лични планове, а не резервации.</p></div><a class="btn btn-pulse" th:href="@{/calendar/create}">Добави тренировка</a></div><section class="fit-card mb-4" th:if="${!#lists.isEmpty(reminders)}"><h2 class="h4">Напомняния</h2><article th:each="r:${reminders}" class="mb-2"><strong th:text="${r.title}"></strong> <span th:text="${#temporals.format(r.startsAt,'dd.MM.yyyy HH:mm')}"></span><form class="d-inline" method="post" th:action="@{/calendar/{id}/dismiss-reminder(id=${r.id})}"><button class="btn btn-sm btn-outline-dark">Разбрах</button></form></article></section><div class="calendar-grid"><article class="fit-card" th:each="e:${events}"><span class="badge text-bg-dark" th:text="${e.status.displayName}"></span><h2 class="h4" th:text="${e.title}"></h2><strong th:text="${#temporals.format(e.startsAt,'dd.MM.yyyy HH:mm')}"></strong><p th:text="${e.durationMinutes}+' минути'"></p><p th:text="${e.notes}"></p><p th:if="${e.program!=null}">Програма: <a th:href="@{/programs/my/{id}(id=${e.program.id})}" th:text="${e.program.name}"></a></p><p th:if="${e.mealPlan!=null}" th:text="'Хранителен режим: '+${e.mealPlan.name}"></p><p th:text="${e.reminderMinutes==0?'Без напомняне':'Напомняне '+e.reminderMinutes+' мин. преди началото'}"></p><a class="btn btn-outline-dark btn-sm mb-2" th:href="@{/journal/create(eventId=${e.id})}">Запиши в дневника</a><div class="d-flex gap-2"><a class="btn btn-outline-dark btn-sm" th:href="@{/calendar/{id}/edit(id=${e.id})}">Премести / редактирай</a><form method="post" th:action="@{/calendar/{id}/status(id=${e.id})}"><input type="hidden" name="status" value="COMPLETED"><button class="btn btn-success btn-sm">Завърши</button></form><form method="post" th:action="@{/calendar/{id}/delete(id=${e.id})}" onsubmit="return confirm('Изтриване на тренировката?');"><button class="btn btn-outline-danger btn-sm">Изтрий</button></form></div></article></div></main></body></html>
