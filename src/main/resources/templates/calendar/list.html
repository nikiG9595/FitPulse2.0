<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.training.calendar})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><div><h1>[[#{ui.personal.training.calendar}]]</h1><p>[[#{ui.these.are.your.personal.plans.not.bookings}]]</p></div><a class="btn btn-pulse" th:href="@{/calendar/create}">[[#{ui.add.workout.2}]]</a></div><div class="calendar-grid"><article class="fit-card" th:each="e:${events}"><span class="badge text-bg-dark" th:text="${@uiText.label(e.status.displayName)}"></span><h2 class="h4" th:text="${e.title}"></h2><strong th:text="${#temporals.format(e.startsAt,'dd.MM.yyyy HH:mm')}"></strong><p th:text="${e.durationMinutes}+#{ui.minutes}"></p><p th:text="${e.notes}"></p><p th:if="${e.program!=null}">[[#{ui.program.2}]] <a th:href="@{/programs/my/{id}(id=${e.program.id})}" th:text="${e.program.name}"></a></p><p th:if="${e.mealPlan!=null}" th:text="#{ui.meal.plan}+${e.mealPlan.name}"></p><div class="d-flex gap-2"><a class="btn btn-outline-dark btn-sm" th:href="@{/calendar/{id}/edit(id=${e.id})}">[[#{ui.reschedule.edit}]]</a><form method="post" th:action="@{/calendar/{id}/status(id=${e.id})}"><input type="hidden" name="status" value="COMPLETED"><button class="btn btn-success btn-sm">[[#{ui.complete}]]</button></form><form method="post" th:action="@{/calendar/{id}/delete(id=${e.id})}" th:data-confirm="#{ui.delete.the.workout}" onsubmit="return confirm(this.dataset.confirm);"><button class="btn btn-outline-danger btn-sm">[[#{action.delete}]]</button></form></div></article></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
