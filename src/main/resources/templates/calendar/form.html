<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Тренировка')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1 th:text="${eventId==null?'Добавяне на тренировка':'Редактиране на тренировка'}"></h1><form method="post" th:object="${workoutEventForm}" th:action="${eventId==null}?@{/calendar/create}:@{/calendar/{id}/edit(id=${eventId})}"><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>Заглавие</label><input class="form-control" th:field="*{title}"><label>Дата и час</label><input type="datetime-local" class="form-control" th:field="*{startsAt}"><label>Продължителност (минути)</label><input type="number" class="form-control" th:field="*{durationMinutes}"><label>Фитнес (по избор)</label><select class="form-select" th:field="*{gymId}"><option value="">Без фитнес</option><option th:each="g:${gyms}" th:value="${g.id}" th:text="${g.name}"></option></select><label>Лична програма</label><select class="form-select" th:field="*{programId}"><option value="">Без програма</option><option th:each="p:${programs}" th:value="${p.id}" th:text="${p.name}"></option></select><label>Личен хранителен режим</label><select class="form-select" th:field="*{mealPlanId}"><option value="">Без режим</option><option th:each="p:${mealPlans}" th:value="${p.id}" th:text="${p.name}"></option></select><label>Бележки</label><textarea class="form-control" th:field="*{notes}"></textarea><button class="btn btn-pulse mt-3">Запази</button></form></div></main></body></html>
