<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.workout})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1 th:text="${eventId==null?#messages.msg('ui.add.workout'):#messages.msg('ui.edit.workout')}"></h1><form method="post" th:object="${workoutEventForm}" th:action="${eventId==null}?@{/calendar/create}:@{/calendar/{id}/edit(id=${eventId})}"><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>[[#{ui.title}]]</label><input class="form-control" th:field="*{title}"><label>[[#{ui.date.and.time}]]</label><input type="datetime-local" class="form-control" th:field="*{startsAt}"><label>[[#{ui.duration.minutes}]]</label><input type="number" class="form-control" th:field="*{durationMinutes}"><label>[[#{ui.gym.optional}]]</label><select class="form-select" th:field="*{gymId}"><option value="">[[#{ui.no.gym}]]</option><option th:each="g:${gyms}" th:value="${g.id}" th:text="${g.name}"></option></select><label>[[#{ui.personal.program}]]</label><select class="form-select" th:field="*{programId}"><option value="">[[#{ui.no.program}]]</option><option th:each="p:${programs}" th:value="${p.id}" th:text="${p.name}"></option></select><label>[[#{ui.personal.meal.plan}]]</label><select class="form-select" th:field="*{mealPlanId}"><option value="">[[#{ui.no.meal.plan}]]</option><option th:each="p:${mealPlans}" th:value="${p.id}" th:text="${p.name}"></option></select><label>[[#{ui.notes}]]</label><textarea class="form-control" th:field="*{notes}"></textarea><button class="btn btn-pulse mt-3">[[#{action.save}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
