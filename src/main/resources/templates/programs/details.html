<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${program.displayName})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page plan-page">
    <a class="back-link" th:href="@{/programs/my#my-programs}">← Моите тренировъчни програми</a>
    <header class="plan-intro"><div><span class="eyebrow">Твоето лично копие</span><h1 th:text="${program.displayName}"></h1></div></header>
    <div class="plan-subheading"><h2 th:text="'Тренировъчни дни ('+${#lists.size(sessions)}+')'">Тренировъчни дни</h2></div><section class="session-grid" aria-label="Тренировъчни дни"><details class="session-card" th:each="s:${sessions}" name="program-session"><summary><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('program')}"></svg></span><div><h3 th:text="${s.title}"></h3><p th:text="${s.schedule}"></p></div></summary><div class="session-exercises"><article class="exercise-detail" th:each="i:${s.exercises}"><h4><a th:if="${i.exercise!=null}" th:href="@{/exercises/{code}(code=${i.exercise.code})}" th:text="${i.exerciseName}"></a><span th:unless="${i.exercise!=null}" th:text="${i.exerciseName}"></span></h4><div th:if="${i.exercise!=null}"><div th:replace="~{fragments/exercise-video :: player(${exerciseVideos[i.exercise.code]})}"></div></div><div class="exercise-prescription"><span th:text="${i.setsCount}+' серии'"></span><span th:text="${i.repetitions}+' · повторения / време'"></span><span th:text="'Почивка '+${i.restSeconds}+' сек.'"></span></div><p th:text="${i.instructions}"></p></article></div></details></section>
    <p class="text-muted" th:if="${#lists.isEmpty(sessions)}">Все още няма упражнения в тази програма.</p>
    <aside class="recovery-note">Оставяй поне 48 часа между тежките натоварвания за една и съща мускулна група. Примерният график може да се променя според възстановяването ти.</aside>
</main><script th:src="@{/js/program-accordion.js}" defer></script></body></html>
