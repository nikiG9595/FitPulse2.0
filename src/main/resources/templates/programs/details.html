<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${@uiText.programCopyName(program)})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page plan-page">
    <a class="back-link" th:href="@{/programs/my#my-programs}">[[#{ui.my.training.programs.2}]]</a>
    <header class="plan-intro"><div><span class="eyebrow">[[#{ui.your.personal.copy}]]</span><h1 th:text="${@uiText.programCopyName(program)}"></h1></div></header>
    <div class="plan-subheading"><h2 th:text="#{ui.training.days.2}+${#lists.size(sessions)}+')'">[[#{ui.training.days}]]</h2></div><section class="session-grid" th:aria-label="#{ui.training.days}"><details class="session-card" th:each="s:${sessions}" name="program-session"><summary><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('program')}"></svg></span><div><h3 th:text="${@uiText.programCopyText(program, s.title)}"></h3><p th:text="${@uiText.catalog(s.schedule)}"></p></div></summary><div class="session-exercises"><th:block th:each="i:${s.exercises}"><details th:replace="~{fragments/program-exercise :: row(${i}, ${@uiText.programCopyText(program, i.exerciseName)}, ${@uiText.programCopyText(program, i.repetitions)}, ${@uiText.programCopyInstructions(program, i.instructions)}, ${#messages.msg('ui.rest')}, ${i.exercise == null ? null : exerciseVideos[i.exercise.code]})}"></details></th:block></div></details></section>
    <p class="text-muted" th:if="${#lists.isEmpty(sessions)}">[[#{ui.there.are.no.exercises.in.this.program}]]</p>
    <aside class="recovery-note">[[#{ui.allow.at.least.48.hours.between.intense}]]</aside>
</main><script th:src="@{/js/program-accordion.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
