<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.ingredient.substitution})}"></head><body class="page-bg "><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans/my/{id}(id=${plan.id})}+'#menu-meal-'+${day}+'-'+${meal}">[[#{ui.back.to.my.meal.plan}]]</a><header class="module-heading"><div><span class="eyebrow">[[#{ui.change.only.the.selected.meal}]]</span><h1>[[#{ui.replace.ingredient}]]</h1><p><strong th:text="${@uiText.catalog(current.name)}"></strong> · <span th:text="${current.quantity}"></span> · <span th:text="${@uiText.catalog(current.state)}"></span></p></div></header><form class="module-filter" method="get" th:action="@{/meal-plans/my/{id}/substitutions(id=${plan.id})}"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="meal" th:value="${meal}"><input type="hidden" name="item" th:value="${item}"><div class="filter-search"><label for="food-search">[[#{ui.search.for.an.ingredient}]]</label><input class="form-control" id="food-search" name="q" th:value="${q}" type="search" maxlength="150"></div><button class="btn btn-pulse" type="submit">[[#{ui.search}]]</button></form><p class="module-disclaimer">[[#{ui.suggestions.come.from.the.same.food.category}]]</p><div class="measurement-grid"><article class="module-panel" th:each="f:${foods}"><span class="eyebrow" th:text="${@uiText.catalog(f.category)}"></span><h2 class="h5" th:text="${@uiText.catalog(f.name)}"></h2><p th:text="${@uiText.catalog(f.state)}"></p><p class="small" th:text="#{ui.per.100.g}+${f.calories}+#{ui.kcal.p}+${f.protein}+#{ui.g.f}+${f.fat}+#{ui.g.c}+${f.carbs}+#{ui.g}"></p><form method="post" th:action="@{/meal-plans/my/{id}/substitutions(id=${plan.id})}"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="meal" th:value="${meal}"><input type="hidden" name="item" th:value="${item}"><input type="hidden" name="foodCode" th:value="${f.code}"><label th:for="'replacement-'+${f.id}">[[#{ui.new.amount.g}]]</label><input class="form-control" th:id="'replacement-'+${f.id}" name="grams" type="number" min="1" max="2000" step="0.01" th:value="${current.grams}" required><button class="btn btn-pulse mt-3" type="submit">[[#{ui.select.and.replace}]]</button></form></article></div><div class="module-empty" th:if="${#lists.isEmpty(foods)}"><h2>[[#{ui.no.suitable.alternatives.match.this.selection}]]</h2><p>[[#{ui.try.another.term.or.keep.the.current}]]</p></div>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
