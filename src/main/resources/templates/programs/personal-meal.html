<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.my.weekly.meal.plan})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans/my}">[[#{ui.my.meal.plans.3}]]</a><header class="module-hero"><div><span class="eyebrow">[[#{ui.editable.personal.copy}]]</span><h1 th:text="${@uiText.mealCopyName(plan)}"></h1><span class="module-tag" th:if="${plan.goal!=null}" th:text="${@uiText.label(plan.goal.displayName)}"></span><p>[[#{ui.changes.are.saved.in.your.plan.only}]]</p></div><div class="dish-actions"><a class="btn btn-pulse meal-shopping-button" th:href="@{/meal-plans/my/{id}/shopping(id=${plan.id})}">[[#{ui.shopping.list}]]</a></div></header><div class="alert alert-success" th:if="${success}" th:text="${@uiText.label(success)}" role="status"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${@uiText.label(error)}" role="alert"></div><div th:replace="~{fragments/weekly-menu :: weekly(${menu},true,${plan.id})}"></div><aside class="module-panel mt-4"><p th:text="${@uiText.catalog(menu.methodology)}"></p><p>[[#{ui.this.is.an.example.plan.and.does}]]</p></aside>
</main><script th:src="@{/js/weekly-menu.js}" defer></script><script th:src="@{/js/nutrition.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
