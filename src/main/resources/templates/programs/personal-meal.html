<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Моят седмичен хранителен режим')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans/my}">← Моите хранителни режими</a><header class="module-hero"><div><span class="eyebrow">Лично редактируемо копие</span><h1 th:text="${plan.name}"></h1><span class="module-tag" th:if="${plan.goal!=null}" th:text="${plan.goal.displayName}"></span><p>Промените се пазят само в твоя режим.</p></div><div class="dish-actions"><a class="btn btn-pulse" th:href="@{/meal-plans/my/{id}/shopping(id=${plan.id})}">Списък за пазаруване</a></div></header><div class="alert alert-success" th:if="${success}" th:text="${success}" role="status"></div>
<div class="alert alert-danger" th:if="${error}" th:text="${error}" role="alert"></div><div th:replace="~{fragments/weekly-menu :: weekly(${menu},true,${plan.id})}"></div><form class="module-panel mt-4" method="post" th:action="@{/meal-plans/my/{id}/name(id=${plan.id})}"><label for="personal-name">Име на режима</label><input class="form-control" id="personal-name" name="name" th:value="${plan.name}" maxlength="150" required><button class="btn btn-outline-light mt-3" type="submit">Запази името</button></form><aside class="module-panel mt-4"><p th:text="${menu.methodology}"></p><p>Примерен режим, а не индивидуален медицински съвет. Замяната на продукт може да изисква различна обработка; следвай актуалния списък с продукти.</p></aside>
</main><script th:src="@{/js/weekly-menu.js}" defer></script><script th:src="@{/js/nutrition.js}" defer></script></body></html>
