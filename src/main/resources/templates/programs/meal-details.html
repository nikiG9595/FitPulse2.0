<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Седмичен хранителен режим')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans}">← Хранителни режими</a><header class="module-hero"><div><span class="eyebrow" th:text="${meal.goal.displayName}"></span><h1 th:text="${meal.name}"></h1><p th:text="${meal.description}"></p><p>Демонстрационен автор: <a th:if="${meal.author!=null && meal.author.published}" th:href="@{/trainers/{id}(id=${meal.author.id})}">Charles Walker</a><span th:unless="${meal.author!=null && meal.author.published}">Charles Walker</span> · Неудостоверено реално авторство</p><span class="module-tag">Библиотечен оригинал</span></div><form method="post" th:action="@{/meal-plans/{id}/copy(id=${meal.id})}"><button class="btn btn-pulse" type="submit">Добави</button></form></header>
<div th:replace="~{fragments/weekly-menu :: weekly(${weeklyMenu},false,${meal.id})}"></div><aside class="module-panel mt-4"><h2>Ориентировъчни стойности</h2><p th:text="${weeklyMenu.methodology}"></p><p th:text="${meal.disclaimer}"></p><p>Общ демонстрационен пример, а не индивидуален медицински съвет.</p></aside>
</main><script th:src="@{/js/weekly-menu.js}" defer></script></body></html>
