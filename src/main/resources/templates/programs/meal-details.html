<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.weekly.meal.plan})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans}">[[#{ui.meal.plans}]]</a><header class="module-hero"><img class="meal-plan-cover" th:src="@{${mealCover}}" th:alt="${@uiText.catalog(meal.displayName)}" th:data-fallback="@{${mealFallbackCover}}" onerror="this.onerror=null;this.src=this.dataset.fallback;"><div><span class="eyebrow" th:text="${@uiText.label(meal.goal.displayName)}"></span><h1 th:text="${@uiText.catalog(meal.displayName)}"></h1><p th:text="${@uiText.catalog(meal.displayDescription)}"></p></div><a class="btn btn-pulse" th:if="${myMealLinks.containsKey(meal.id)}" th:href="@{/meal-plans/my/{id}(id=${myMealLinks[meal.id]})}">[[#{ui.open.my.plan}]]</a><a class="btn btn-pulse" th:unless="${myMealLinks.containsKey(meal.id)}" th:href="@{/meal-plans/{id}/personalize(id=${meal.id})}">[[#{ui.add}]]</a></header>
<div th:replace="~{fragments/weekly-menu :: weekly(${weeklyMenu},false,${meal.id})}"></div><aside class="module-panel mt-4"><h2>[[#{ui.estimated.values}]]</h2><p th:text="${@uiText.catalog(weeklyMenu.methodology)}"></p><p th:text="${@uiText.catalog(meal.disclaimer)}"></p><p>[[#{ui.this.general.example.is.for.demonstration.and}]]</p></aside>
</main><script th:src="@{/js/weekly-menu.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
