<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Тренировъчни програми')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page library-page program-library">
    <div class="alert alert-warning" th:if="${error}" th:text="${error}" role="alert"></div>
    <header class="library-header program-library-header">
        <div><span class="eyebrow">Тренирай с посока</span><h1>Тренировъчни програми</h1><div class="program-header-actions"><a class="btn btn-outline-dark" th:href="@{/programs/my#my-programs}">Моите тренировъчни програми ↗</a></div></div>
        <a class="program-navigator-card" th:href="@{/exercises}">
            <span class="program-navigator-visual anatomy-svg" aria-hidden="true" th:data-navigator-preview="@{/images/anatomy/front.svg(v=12)}"><img th:src="@{/images/anatomy/front.svg(v=12)}" alt="" width="710" height="1450"></span>
            <span class="program-navigator-label">Мускулен навигатор <span aria-hidden="true">↗</span></span>
        </a>
    </header>
    <div class="program-filter-panel" id="program-filters" aria-label="Филтри за тренировъчни програми">
        <fieldset><legend>Място на тренировка</legend><div class="filter-buttons" data-filter="location">
            <button type="button" data-value="" th:attr="aria-pressed=${location==null}">Всички</button>
            <button type="button" data-value="HOME" th:attr="aria-pressed=${location!=null && location.name()=='HOME'}">Вкъщи</button>
            <button type="button" data-value="GYM" th:attr="aria-pressed=${location!=null && location.name()=='GYM'}">Във фитнес</button>
        </div></fieldset>
        <fieldset><legend>Ниво</legend><div class="filter-buttons" data-filter="level">
            <button type="button" data-value="" th:attr="aria-pressed=${level==null}">Всички</button>
            <button type="button" data-value="BEGINNER" th:attr="aria-pressed=${level!=null && level.name()=='BEGINNER'}">Начинаещ</button>
            <button type="button" data-value="INTERMEDIATE" th:attr="aria-pressed=${level!=null && level.name()=='INTERMEDIATE'}">Средно напреднал</button>
            <button type="button" data-value="ADVANCED" th:attr="aria-pressed=${level!=null && level.name()=='ADVANCED'}">Напреднал</button>
        </div></fieldset>
        <div class="program-goal-filter"><label for="program-goal">Цел</label><select class="form-select" id="program-goal"><option value="">Всички цели</option><option th:each="g:${goals}" th:value="${g}" th:text="${g.displayName}" th:selected="${g==goal}"></option></select></div>
    </div>
    <div class="library-results"><p role="status"><strong id="program-count" th:text="${#lists.size(templates)}"></strong> програми</p><button type="button" class="filter-reset link-pulse" id="clear-program-filters">Изчисти филтрите</button></div>
    <div class="empty-state fit-card" id="program-empty" hidden><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('program')}"></svg></span><h2>Няма програми за този избор</h2><p>Промени филтрите или разгледай запазените си лични копия.</p><a class="btn btn-outline-dark" th:href="@{/programs/my#my-programs}">Моите програми</a></div>
    <section class="library-grid" aria-label="Библиотека с тренировъчни програми"><article class="library-card" th:each="p:${templates}" th:data-goal="${p.goal}" th:data-level="${p.experience}" th:data-location="${p.location}">
        <div class="program-category-row"><span class="program-type-icon"><svg th:replace="~{fragments/icons :: icon(${p.categoryIcon})}"></svg></span><span class="program-goal-label" th:text="${p.categoryLabel}"></span></div>
        <div class="library-card-body"><h2><a th:href="@{/programs/{id}(id=${p.id})}" th:text="${p.displayName}"></a></h2><div class="program-card-tags"><span th:text="${p.experience.displayName}"></span><span th:text="${p.placeLabel}"></span></div><p class="library-card-description" th:text="${p.description}"></p><div class="library-card-actions"><a class="btn btn-outline-light" th:href="@{/programs/{id}(id=${p.id})}">Разгледай</a><a class="btn btn-pulse" th:if="${myProgramLinks.containsKey(p.id)}" th:href="@{/programs/my/{id}(id=${myProgramLinks[p.id]})}">Отвори моята програма</a><form th:unless="${myProgramLinks.containsKey(p.id)}" method="post" th:action="@{/programs/{id}/copy(id=${p.id})}"><button class="btn btn-pulse">Добави</button></form></div></div>
    </article></section>
</main><script th:src="@{/js/program-navigator-preview.js}" defer></script><script th:src="@{/js/program-filters.js}" defer></script></body></html>
