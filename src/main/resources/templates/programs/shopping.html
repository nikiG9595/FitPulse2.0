<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.shopping.list})}"></head><body class="page-bg shopping-page"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans/my/{id}(id=${plan.id})}">[[#{ui.my.meal.plan.2}]]</a><header class="module-heading"><div><span class="eyebrow">[[#{ui.based.on.your.current.portions}]]</span><h1>[[#{ui.shopping.list}]]</h1><p th:text="${@uiText.mealCopyName(plan)}"></p></div><div class="shopping-actions"><button class="btn btn-pulse" type="button" id="copy-shopping" th:disabled="${#lists.isEmpty(shopping.days)}">[[#{ui.copy.as.text}]]</button><button class="btn btn-outline-dark" type="button" id="print-shopping" th:disabled="${#lists.isEmpty(shopping.days)}">[[#{ui.print}]]</button></div></header><p id="shopping-feedback" role="status"></p>
<form class="module-panel shopping-days" data-shopping-reset method="post" th:action="@{/meal-plans/my/{id}/shopping/reset(id=${plan.id})}"><h2>[[#{ui.select.days}]]</h2><div class="module-tags"><label th:each="day:${#numbers.sequence(1,7)}"><input type="checkbox" name="days" th:value="${day}" th:checked="${shopping.days.contains(day)}"> <span th:text="#{ui.day}+${day}"></span></label></div><button class="btn btn-pulse mt-3" type="submit">[[#{ui.update.list}]]</button><a class="btn btn-outline-light mt-3" th:href="@{/meal-plans/my/{id}/shopping(id=${plan.id},days='1,2,3,4,5,6,7')}">[[#{ui.entire.week}]]</a></form>
<p class="module-panel mt-4" th:if="${#lists.isEmpty(shopping.days)}">[[#{ui.select.one.or.more.days.to.view}]]</p><section id="shopping-list" class="module-panel mt-4" th:unless="${#lists.isEmpty(shopping.days)}"><p class="small module-muted">[[#{ui.raw.and.cooked.ingredients.are.listed.separately}]]</p><div th:each="i:${shopping.items}" class="shopping-item" th:classappend="${i.checked?'purchased':''}" th:data-shopping-text="${@uiText.catalog(i.category)}+' · '+${@uiText.catalog(i.name)}+' — '+${i.grams}+#{ui.g.4}+${@uiText.catalog(i.state)}+')'"><h2 class="shopping-category" th:if="${iStat.first || i.category!=shopping.items[iStat.index-1].category}" th:text="${@uiText.catalog(i.category)}"></h2><form data-shopping-check method="post" th:action="@{/meal-plans/my/{id}/shopping/check(id=${plan.id})}"><input type="hidden" name="days" th:each="d:${shopping.days}" th:value="${d}"><input type="hidden" name="scope" th:value="${shopping.scope}"><input type="hidden" name="foodCode" th:value="${i.code}"><label><input type="checkbox" name="checked" value="true" th:checked="${i.checked}"><span><strong th:text="${@uiText.catalog(i.name)}"></strong><small th:text="${@uiText.catalog(i.state)}"></small></span><b th:text="${i.grams}+#{ui.g}"></b></label></form></div></section>
</main><script th:src="@{/js/nutrition.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
