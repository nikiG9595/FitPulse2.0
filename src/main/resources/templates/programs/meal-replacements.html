<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Замени хранене')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans/my/{id}(id=${plan.id})}+'#menu-day-'+${day}">← Личният режим</a><header class="module-heading"><div><span class="eyebrow">Само за избраното хранене</span><h1>Замени хранене</h1><p th:text="${current.name}"></p></div></header><form class="module-filter" method="get" th:action="@{/meal-plans/my/{id}/meal-replacements(id=${plan.id})}"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="meal" th:value="${meal}"><div class="filter-search"><label for="recipe-search">Търси ястие</label><input class="form-control" id="recipe-search" name="q" type="search" maxlength="150" th:value="${q}"></div><button class="btn btn-pulse">Търси</button></form><p class="module-disclaimer">Алтернативите не са хранително идентични. Показаните количества са примерна порция, която можеш да редактираш след избора.</p><section class="replacement-grid"><article class="module-panel" th:each="r:${recipes}"><img class="meal-photo" th:src="@{${r.meal.image}}" th:alt="'Илюстрация на '+${r.name}" loading="lazy"><h2 th:text="${r.name}"></h2><p th:text="${r.meal.calories}+' ккал · Б '+${r.meal.protein}+' г · М '+${r.meal.fat}+' г · В '+${r.meal.carbs}+' г'"></p><form method="post" th:action="@{/meal-plans/my/{id}/meal-replacements(id=${plan.id})}"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="meal" th:value="${meal}"><input type="hidden" name="recipeCode" th:value="${r.code}"><button class="btn btn-pulse" type="submit">Избери храненето</button></form></article></section><p th:if="${#lists.isEmpty(recipes)}">Няма рецепти за този избор.</p>
</main></body></html>
