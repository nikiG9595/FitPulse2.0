<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.replace.meal})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/meal-plans/my/{id}(id=${plan.id})}+'#menu-meal-'+${day}+'-'+${meal}">[[#{ui.personal.meal.plan.2}]]</a><header class="module-heading"><div><span class="eyebrow">[[#{ui.only.for.the.selected.meal}]]</span><h1>[[#{ui.replace.meal}]]</h1><p th:text="${@uiText.catalog(current.name)}"></p></div></header><form class="module-filter" method="get" th:action="@{/meal-plans/my/{id}/meal-replacements(id=${plan.id})}"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="meal" th:value="${meal}"><div class="filter-search"><label for="recipe-search">[[#{ui.search.dishes}]]</label><input class="form-control" id="recipe-search" name="q" type="search" maxlength="150" th:value="${q}"></div><button class="btn btn-pulse">[[#{ui.search}]]</button></form><p class="module-disclaimer">[[#{ui.alternatives.have.different.nutritional.values.the.amounts}]]</p><section class="replacement-grid"><article class="module-panel" th:each="r:${recipes}"><img class="meal-photo" th:src="@{${r.image}}" th:alt="#{ui.illustration.of}+${@uiText.catalog(r.name)}" loading="lazy"><h2 th:text="${@uiText.catalog(r.name)}"></h2><p th:text="${r.meal.calories}+#{ui.kcal.p}+${r.meal.protein}+#{ui.g.f}+${r.meal.fat}+#{ui.g.c}+${r.meal.carbs}+#{ui.g}"></p><form method="post" th:action="@{/meal-plans/my/{id}/meal-replacements(id=${plan.id})}"><input type="hidden" name="day" th:value="${day}"><input type="hidden" name="meal" th:value="${meal}"><input type="hidden" name="recipeCode" th:value="${r.code}"><button class="btn btn-pulse" type="submit">[[#{ui.select.a.meal}]]</button></form></article></section><p th:if="${#lists.isEmpty(recipes)}">[[#{ui.no.recipes.match.this.selection}]]</p>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
