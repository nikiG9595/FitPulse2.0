<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${@uiText.catalog(template.displayName)})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page plan-page">
    <a class="back-link" th:href="@{/programs}">[[#{ui.all.training.programs}]]</a>
    <header class="plan-intro"><div><span class="eyebrow">[[#{ui.your.next.step}]]</span><h1 th:text="${@uiText.catalog(template.displayName)}"></h1><div class="plan-tags"><span th:text="${@uiText.label(template.goal.displayName)}"></span><span th:text="${@uiText.label(template.location.displayName)}"></span><span th:text="${@uiText.label(template.experience.displayName)}"></span></div><p th:text="${@uiText.catalog(template.description)}"></p></div><a class="btn btn-pulse" th:if="${myProgramLinks.containsKey(template.id)}" th:href="@{/programs/my/{id}(id=${myProgramLinks[template.id]})}">[[#{ui.open.my.program}]]</a><form th:unless="${myProgramLinks.containsKey(template.id)}" method="post" th:action="@{/programs/{id}/copy(id=${template.id})}"><button class="btn btn-pulse" type="submit">[[#{ui.add}]]</button></form></header>
    <div class="plan-subheading"><h2 th:text="#{ui.training.days.2}+${#lists.size(sessions)}+')'">[[#{ui.training.days}]]</h2><p>[[#{ui.expand.a.workout.to.see.its.exercises}]]</p></div>
    <section class="session-grid" th:aria-label="#{ui.program.contents}"><details class="session-card" th:each="s:${sessions}" name="program-session"><summary><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('program')}"></svg></span><div><h3 th:text="${@uiText.catalog(s.title)}"></h3><p th:text="${@uiText.catalog(s.schedule)}"></p></div></summary><div class="session-exercises"><th:block th:each="i:${s.exercises}"><details th:replace="~{fragments/program-exercise :: row(${i}, ${@uiText.catalog(i.exerciseName)}, ${@uiText.catalog(i.repetitions)}, ${#strings.isEmpty(i.instructions) ? #messages.msg('ui.use.controlled.pain.free.movement.and.leave') : @uiText.instructions(i.instructions)}, ${#messages.msg('ui.rest.2')}, ${i.exercise == null ? null : exerciseVideos[i.exercise.code]})}"></details></th:block></div></details></section>
    <aside class="recovery-note"><strong>[[#{ui.pacing.and.recovery}]]</strong> [[#{ui.start.with.5.10.minutes.of.light}]]</aside>
    <a class="link-pulse" th:href="@{/programs/my#my-programs}">[[#{ui.go.to.my.training.programs}]]</a>
</main><script th:src="@{/js/program-accordion.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
