<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.recipe})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{${returnPath}}">[[#{ui.back.to.the.plan}]]</a><header class="module-hero"><div><span class="eyebrow" th:text="${personal?#messages.msg('ui.personal.recipe.with.current.amounts'):#messages.msg('ui.recipe.library')}"></span><h1 th:text="${@uiText.catalog(cookingMeal.name)}"></h1><p th:text="#{ui.estimated.time}+${cookingMeal.preparationMinutes}+#{ui.minutes.nutrition.values.are.approximate}"></p><div class="module-tags"><span th:text="${cookingMeal.calories}+#{ui.kcal}"></span><span th:text="#{ui.protein.2}+${cookingMeal.protein}+#{ui.g}"></span><span th:text="#{ui.fat.2}+${cookingMeal.fat}+#{ui.g}"></span><span th:text="#{ui.carbohydrates.2}+${cookingMeal.carbs}+#{ui.g}"></span></div></div><img class="recipe-cover" th:src="@{${cookingMeal.image}}" th:alt="#{ui.illustration.of}+${@uiText.catalog(cookingMeal.name)}"></header><div class="module-two-columns"><section class="module-panel"><h2>[[#{ui.ingredients}]]</h2><ul class="recipe-ingredients"><li th:each="i:${cookingMeal.ingredients}"><div><strong th:text="${@uiText.catalog(i.name)}"></strong><small th:text="${@uiText.catalog(i.state)}"></small></div><b th:text="${@uiText.quantity(i)}"></b></li></ul></section><section class="module-panel"><h2>[[#{ui.preparation}]]</h2><ol class="cooking-steps"><li th:each="step:${cookingMeal.cookingSteps}" th:text="${@uiText.instructions(step)}"></li></ol><p th:if="${#strings.startsWith(cookingMeal.name,'Личен вариант на ')}">[[#{ui.adapt.the.original.instructions.to.the.substituted}]]</p></section></div>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
