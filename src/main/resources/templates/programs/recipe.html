<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Рецепта')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{${returnPath}}">← Обратно към режима</a><header class="module-hero"><div><span class="eyebrow" th:text="${personal?'Лична рецепта с актуални количества':'Библиотечна рецепта'}"></span><h1 th:text="${cookingMeal.name}"></h1><p th:text="'Ориентировъчно време: '+${cookingMeal.preparationMinutes}+' минути'"></p><div class="module-tags"><span th:text="${cookingMeal.calories}+' ккал'"></span><span th:text="'Белтъчини '+${cookingMeal.protein}+' г'"></span><span th:text="'Мазнини '+${cookingMeal.fat}+' г'"></span><span th:text="'Въглехидрати '+${cookingMeal.carbs}+' г'"></span></div></div><img class="recipe-cover" th:src="@{${cookingMeal.image}}" th:alt="'Илюстрация на '+${cookingMeal.name}"></header><div class="module-two-columns"><section class="module-panel"><h2>Необходими продукти</h2><ul class="recipe-ingredients"><li th:each="i:${cookingMeal.ingredients}"><div><strong th:text="${i.name}"></strong><small th:text="${i.state}"></small></div><b th:text="${i.quantity}"></b></li></ul></section><section class="module-panel"><h2>Начин на приготвяне</h2><ol class="cooking-steps"><li th:each="step:${cookingMeal.cookingSteps}" th:text="${step}"></li></ol><p th:if="${#strings.startsWith(cookingMeal.name,'Личен вариант на ')}">Съобрази първоначалните инструкции със заменените продукти. Грамажите вляво са актуалните.</p></section></div>
</main></body></html>
