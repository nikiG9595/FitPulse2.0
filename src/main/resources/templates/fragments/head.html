<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B0D10" media="(max-width: 767px)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="apple-touch-icon" th:href="@{/images/pwa/apple-touch-icon.png}">
    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/language.js}" defer></script>
    <script th:src="@{/js/media-preferences.js}" defer></script>
    <script th:inline="javascript">window.fitPulseMessages = /*[[${@uiText.clientMessages()}]]*/ {};</script>
    <meta name="password-show" th:content="#{auth.password.show}">
    <meta name="password-hide" th:content="#{auth.password.hide}">
    <script th:src="@{/js/account.js}" defer></script>
    <title th:text="${title}">FitPulse</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap-5.3.3.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/plan-details.css}">
    <link rel="stylesheet" th:href="@{/css/modules.css}">
    <link rel="stylesheet" th:href="@{/css/upgrade9.css}">
    <link rel="stylesheet" th:href="@{/css/upgrade10.css}">
    <link rel="stylesheet" th:href="@{/css/upgrade12.css}">
    <link rel="stylesheet" th:href="@{/css/exercise-videos.css}">
    <link rel="stylesheet" th:href="@{/css/support.css}">
    <link rel="stylesheet" th:href="@{/css/final-ui.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/fitpulse-2.css}">
    <link rel="stylesheet" th:href="@{/css/mobile-app.css}" media="(max-width: 767px)">
    <script th:src="@{/js/mobile-app.js}" th:data-worker-url="@{/service-worker.js}" defer></script>
</head>
