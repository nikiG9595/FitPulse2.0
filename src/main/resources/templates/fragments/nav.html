<th:block th:fragment="nav" xmlns:th="http://www.thymeleaf.org">
<nav class="navbar navbar-dark fixed-top fit-nav" th:classappend="${(#authorization.expression('isAnonymous()') ? 'nav-public' : 'nav-member') + (showFitPulseBanner ? ' nav-with-banner' : '')}" aria-label="Основна навигация"
     xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="container nav-layout">
        <div class="nav-identity">
            <a class="navbar-brand" th:href="@{/}">Fit<span>Pulse</span></a>
        </div>
        <span class="nav-slogan">Откривай. Планирай. Напредвай.</span>
        <div class="nav-actions">
            <a class="nav-icon-button" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" title="Администрация" aria-label="Администрация" data-admin-shortcut th:with="hasTasks=${adminTaskIndicator != null and adminTaskIndicator.getAsBoolean()}">
                <svg th:replace="~{fragments/icons :: icon('bell')}"></svg>
                <span class="nav-notification-dot" th:if="${hasTasks}" aria-hidden="true"></span>
                <span class="visually-hidden" th:if="${hasTasks}">Има нови административни задачи</span>
            </a>
            <a class="nav-icon-button" sec:authorize="isAuthenticated()" th:href="@{/profile}" title="Моят профил" aria-label="Моят профил" data-profile-shortcut>
                <svg class="nav-profile-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                    <circle class="nav-profile-background" cx="16" cy="16" r="16"/>
                    <circle cx="16" cy="12" r="4.5" fill="currentColor"/>
                    <path d="M8 24v-1a8 8 0 0 1 16 0v1z" fill="currentColor"/>
                </svg>
            </a>
        <button class="navbar-toggler" type="button" aria-controls="fitpulse-menu" aria-expanded="false" aria-label="Отвори менюто" id="fitpulse-menu-toggle">
            <svg class="nav-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
                <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg><span class="menu-button-text">Меню</span>
        </button>
        </div>
        <div class="collapse navbar-collapse" id="fitpulse-menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/gyms}">Разгледай фитнесите</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/programs}">Тренировъчни програми</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/meal-plans}">Хранителни режими</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/support}">Помощ и обратна връзка</a></li><li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/trainers}">Треньори</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><a class="nav-link" th:href="@{/profile}" data-profile-link>Профил</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin}">Администрация</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/login(returnTo=${authReturnTo})}">Вход</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="btn btn-pulse btn-sm" th:href="@{/register(returnTo=${authReturnTo})}">Регистрация</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()"><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm" type="submit">Изход</button></form></li>
            </ul>
        </div>
    </div>
    <div class="fitpulse-toast" id="login-toast" th:if="${loginToast}" th:text="${loginToast}" role="status"></div>
    <script th:src="@{/js/navigation.js}" defer></script>

    <noscript><style>.fit-nav .navbar-collapse{display:block!important;position:static!important;grid-column:1/-1;width:100%!important}.fit-nav .navbar-toggler{display:none!important}</style></noscript>
</nav>
<th:block th:if="${showFitPulseBanner}">
    <div th:replace="~{fragments/banner :: banner}"></div>
</th:block>
</th:block>
