<section th:fragment="weekly(menu,personal,ownerId)" class="compact-week interactive-menu" xmlns:th="http://www.thymeleaf.org">
    <p class="weekly-legend">[[#{ui.p.protein.f.fat.c.carbohydrates.images}]]</p>
    <details class="interactive-day compact-day" th:each="d:${menu.days}" th:id="'menu-day-'+${dStat.index}" name="fitpulse-week">
        <summary><h2 th:text="${@uiText.catalog(d.title)}"></h2><div class="day-macros" aria-live="polite"><strong data-day-calories th:text="'≈ '+${d.calories}+#{ui.kcal}"></strong><span data-day-protein th:text="#{ui.p}+${d.protein}+#{ui.g}"></span><span data-day-fat th:text="#{ui.f}+${d.fat}+#{ui.g}"></span><span data-day-carbs th:text="#{ui.c}+${d.carbs}+#{ui.g}"></span></div></summary>
        <div class="weekly-day-content">
            <details class="nutrition-meal compact-meal" th:each="m:${d.meals}" th:id="'menu-meal-'+${dStat.index}+'-'+${mStat.index}">
                <summary><img class="dish-thumb" th:src="@{${m.image}}" th:alt="#{ui.illustration.of}+${@uiText.catalog(m.name)}" loading="lazy"><div class="dish-overview"><span class="eyebrow" th:text="${@uiText.catalog(m.label)}"></span><h3 th:text="${@uiText.catalog(m.name)}"></h3><div class="meal-macro-line"><strong data-meal-calories th:text="${m.calories}+#{ui.kcal}"></strong><span data-meal-protein th:text="#{ui.p}+${m.protein}+#{ui.g}"></span><span data-meal-fat th:text="#{ui.f}+${m.fat}+#{ui.g}"></span><span data-meal-carbs th:text="#{ui.c}+${m.carbs}+#{ui.g}"></span><span th:text="'≈ '+${m.preparationMinutes}+#{ui.min}"></span></div></div></summary>
                <div class="compact-meal-content"><p class="small module-muted" th:text="${@uiText.mealDescription(m)}"></p>
                    <div th:each="i:${m.ingredients}" th:class="${personal?'interactive-ingredient':'readonly-ingredient'}" th:data-protein="${i.proteinPer100}" th:data-fat="${i.fatPer100}" th:data-carbs="${i.carbsPer100}">
                        <div><strong th:text="${@uiText.catalog(i.name)}"></strong><small th:text="${@uiText.catalog(i.state)}"></small></div>
                        <form th:if="${personal}" method="post" th:action="@{/meal-plans/my/{id}/ingredients/{day}/{meal}/{item}(id=${ownerId},day=${dStat.index},meal=${mStat.index},item=${iStat.index})}"><label class="visually-hidden" th:for="'grams-'+${dStat.index}+'-'+${mStat.index}+'-'+${iStat.index}">[[#{ui.grams}]]</label><input class="form-control grams-input" type="number" name="grams" min="1" max="2000" step="0.01" th:value="${i.grams}" th:id="'grams-'+${dStat.index}+'-'+${mStat.index}+'-'+${iStat.index}" required><span>[[#{ui.g.2}]]</span><button class="btn btn-sm btn-pulse" type="submit">[[#{action.save}]]</button></form>
                        <b th:unless="${personal}" th:text="${@uiText.quantity(i)}"></b><a th:if="${personal}" class="ingredient-swap" th:href="@{/meal-plans/my/{id}/substitutions(id=${ownerId},day=${dStat.index},meal=${mStat.index},item=${iStat.index})}">[[#{ui.replace}]]</a>
                    </div>
                    <p class="unsaved-note" hidden aria-live="polite">[[#{ui.your.changes.have.not.been.saved.yet}]]</p><details class="quick-recipe"><summary>[[#{ui.preparation}]]</summary><ol><li th:each="step:${m.cookingSteps}" th:text="${@uiText.instructions(step)}"></li></ol><p class="small module-muted" th:if="${#strings.startsWith(m.name,'Личен вариант на ')}">[[#{ui.this.is.the.original.recipe.adjust.the}]]</p></details>
                    <div class="dish-actions" th:if="${personal}"><a class="btn btn-sm btn-pulse" th:href="@{/meal-plans/my/{id}/meal-replacements(id=${ownerId},day=${dStat.index},meal=${mStat.index})}">[[#{ui.replace.meal}]]</a></div>
                </div>
            </details>
        </div>
    </details>
</section>
