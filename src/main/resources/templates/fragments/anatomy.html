<section th:fragment="figure(mode,selected,primary,secondary)" class="anatomy-panel" xmlns:th="http://www.thymeleaf.org" th:data-anatomy-mode="${mode}" th:data-selected="${selected}" th:data-primary="${primary}" th:data-secondary="${secondary}">
    <div class="anatomy-pair"><figure><div class="anatomy-svg" th:data-src="@{/images/anatomy/front.svg}"></div><figcaption>Отпред</figcaption></figure><figure><div class="anatomy-svg" th:data-src="@{/images/anatomy/back.svg}"></div><figcaption>Отзад</figcaption></figure></div>
    <aside><span class="eyebrow">Избери зона</span><h2 class="anatomy-selection" aria-live="polite" th:text="${mode=='library'?(#strings.isEmpty(selected)?'Мускулни групи':selected):'Натоварвани мускули'}"></h2>
        <div class="anatomy-buttons" th:if="${mode=='library'}"><button type="button" th:each="group:${muscles}" th:data-muscle-select="${group}" th:text="${group}" th:attr="aria-pressed=${group==selected}"></button><button type="button" data-muscle-select="">Всички</button></div>
        <div class="anatomy-legend" th:if="${mode=='detail'}"><p><i class="primary-swatch"></i> Основни: <span th:text="${primaryNames}"></span></p><p><i class="secondary-swatch"></i> Второстепенни: <span th:text="${secondaryNames}"></span></p></div>
        <div th:if="${mode=='library' && !#strings.isEmpty(selected)}" class="anatomy-matches"><a th:each="e,stat:${exercises.content}" th:if="${stat.index&lt;5}" th:href="@{/exercises/{code}(code=${e.code})}" th:text="${e.name}"></a></div>
        <p class="small module-muted">Образователна визуализация на мускулни зони, а не медицински модел. Използвай мишка, докосване или стрелките, Enter и Space на клавиатурата.</p><a class="small link-pulse" th:href="@{/images/anatomy/LICENSE.txt}">Контури: MuscleMap · MIT лиценз</a><p class="anatomy-error" hidden role="status">Фигурата не може да се зареди. Използвай текстовите филтри.</p>
    </aside>
</section>
