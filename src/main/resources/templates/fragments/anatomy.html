<section th:fragment="figure(mode,selected,primary,secondary)" class="anatomy-panel" xmlns:th="http://www.thymeleaf.org" th:data-anatomy-mode="${mode}" th:data-selected="${selected}" th:data-subgroup="${subgroup}" th:data-primary="${primary}" th:data-secondary="${secondary}">
    <div hidden th:if="${mode=='detail'}" data-anatomical-labels><span th:each="label:${anatomicalLabels}" th:data-zone-key="${label.key}" th:data-zone-name="${@uiText.catalog(label.value)}"></span></div>
    <div class="anatomy-pair"><figure><div class="anatomy-svg" th:data-src="@{/images/anatomy/front.svg(v=12)}"></div><figcaption>[[#{ui.front}]]</figcaption></figure><figure><div class="anatomy-svg" th:data-src="@{/images/anatomy/back.svg(v=12)}"></div><figcaption>[[#{ui.back}]]</figcaption></figure></div>
    <aside><span class="eyebrow">[[#{ui.choose.an.area}]]</span><h2 class="anatomy-selection" aria-live="polite" th:text="${mode=='library'?(#strings.isEmpty(selected)?#messages.msg('ui.muscle.groups'):@uiText.catalog(selected)):#messages.msg('ui.targeted.muscles')}"></h2>
        <p th:if="${mode=='detail'}" class="anatomy-picked-name" data-selected-muscle hidden role="status" aria-live="polite" aria-atomic="true"><strong>[[#{ui.selected.muscle}]] </strong><span data-selected-muscle-name></span></p>
        <div class="anatomy-buttons" th:if="${mode=='library'}"><button type="button" th:each="group:${muscles}" th:data-muscle-select="${group}" th:text="${@uiText.catalog(group)}" th:attr="aria-pressed=${group==selected}"></button><button type="button" data-muscle-select="">[[#{ui.all}]]</button></div>
        <div class="anatomy-buttons anatomy-subgroups" th:if="${mode=='library' and !#lists.isEmpty(subgroupOptions)}" th:aria-label="#{ui.muscle.subgroups}"><button type="button" data-subgroup-select="" th:attr="aria-pressed=${#strings.isEmpty(subgroup)}">[[#{ui.entire.group}]]</button><button type="button" th:each="option:${subgroupOptions}" th:data-subgroup-select="${option.code}" th:data-subgroup-zone="${option.zone}" th:text="${@uiText.catalog(option.name)}" th:attr="aria-pressed=${option.code==subgroup}"></button></div><div class="anatomy-legend" th:if="${mode=='detail'}"><p><i class="primary-swatch"></i> [[#{ui.primary}]] <span th:text="${@uiText.catalogLabels(primaryNames)}"></span></p><p><i class="secondary-swatch"></i> [[#{ui.secondary}]] <span th:text="${@uiText.catalogLabels(secondaryNames)}"></span></p></div>
        <a th:if="${mode=='library'}" class="anatomy-scroll" href="#exercise-results"><span aria-hidden="true">↓</span> [[#{ui.explore.the.exercises.below}]]</a>
        <p class="small module-muted">[[#{ui.this.is.an.educational.illustration.of.muscle}]]</p><a class="small link-pulse" th:href="@{/images/anatomy/LICENSE.txt}">[[#{ui.outlines.musclemap.mit.license}]]</a><p class="anatomy-error" hidden role="status">[[#{ui.the.figure.could.not.load.use.the}]]</p>
    </aside>
</section>
