<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.favorite.gyms})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page profile-page"><a class="back-link" th:href="@{/profile}">[[#{ui.my.profile.2}]]</a>    <section id="favorite-gyms" class="profile-favorites">
        <div class="section-heading"><div><span class="eyebrow">[[#{ui.saved.places}]]</span><h2>[[#{ui.favorite.gyms}]]</h2></div><a class="link-pulse" th:href="@{/gyms}">[[#{ui.browse.gyms.2}]]</a></div>
        <div class="empty-state fit-card" th:if="${#lists.isEmpty(favorites)}"><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('heart')}"></svg></span><h3>[[#{ui.your.favorite.places.start.here}]]</h3><p>[[#{ui.open.a.gym.in.the.directory.and}]]</p><a class="btn btn-pulse" th:href="@{/gyms}">[[#{ui.find.a.gym}]]</a></div>
        <div class="row g-4" th:unless="${#lists.isEmpty(favorites)}"><div class="col-md-6 col-xl-4" th:each="f:${favorites}"><article class="fit-card favorite-card"><span class="eyebrow">[[#{ui.favorite.gym}]]</span><h3 class="h4" th:text="${f.gym.name}"></h3><p class="text-muted" th:text="${f.gym.address}"></p><a class="btn btn-outline-dark" th:href="@{/gyms/{slug}(slug=${f.gym.slug})}">[[#{ui.view.gym}]]</a><form method="post" th:action="@{/gyms/{id}/favorite(id=${f.gym.id})}"><input type="hidden" name="slug" th:value="${f.gym.slug}"><button class="favorite-remove" type="submit">[[#{ui.remove.from.favorites}]]</button></form></article></div></div>
    </section>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
