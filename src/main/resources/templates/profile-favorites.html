<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Любими фитнеси')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page profile-page"><a class="back-link" th:href="@{/profile}">← Моят профил</a>    <section id="favorite-gyms" class="profile-favorites">
        <div class="section-heading"><div><span class="eyebrow">Запазени места</span><h2>Любими фитнеси</h2></div><a class="link-pulse" th:href="@{/gyms}">Разгледай фитнесите →</a></div>
        <div class="empty-state fit-card" th:if="${#lists.isEmpty(favorites)}"><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('heart')}"></svg></span><h3>Твоите любими места започват оттук</h3><p>Отвори фитнес от каталога и го добави в любими, за да го намираш лесно тук.</p><a class="btn btn-pulse" th:href="@{/gyms}">Открий фитнес</a></div>
        <div class="row g-4" th:unless="${#lists.isEmpty(favorites)}"><div class="col-md-6 col-xl-4" th:each="f:${favorites}"><article class="fit-card favorite-card"><span class="eyebrow">Любим фитнес</span><h3 class="h4" th:text="${f.gym.name}"></h3><p class="text-muted" th:text="${f.gym.address}"></p><a class="btn btn-outline-dark" th:href="@{/gyms/{slug}(slug=${f.gym.slug})}">Виж фитнеса</a><form method="post" th:action="@{/gyms/{id}/favorite(id=${f.gym.id})}"><input type="hidden" name="slug" th:value="${f.gym.slug}"><button class="favorite-remove" type="submit">Премахни от любими</button></form></article></div></div>
    </section>
</main></body></html>
