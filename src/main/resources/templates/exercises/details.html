<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Правилно изпълнение на упражнение')}"></head><body class="page-bg "><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/exercises}">← Библиотека с упражнения</a><header class="module-hero"><div><span class="eyebrow" th:text="${exercise.muscle}"></span><h1 th:text="${exercise.name}"></h1><div class="module-tags"><span th:text="${exercise.equipment}"></span><span th:text="${exercise.difficulty}"></span><span th:text="${exercise.location}"></span></div><p>Второстепенни групи: <span th:text="${secondaryNames}"></span></p><a class="btn btn-pulse" th:href="@{/journal}">Отвори дневника</a></div></header>
<div th:replace="~{fragments/anatomy :: figure('detail',null,${exercise.primaryZones},${exercise.secondaryZones})}"></div><div class="module-two-columns"><section class="module-panel"><h2>Начална позиция</h2><p th:text="${exercise.startPosition}"></p><h2>Изпълнение стъпка по стъпка</h2><ol class="exercise-steps"><li th:each="step:${steps}" th:text="${step}"></li></ol></section><section class="module-panel"><h2>Дишане</h2><p th:text="${exercise.breathing}"></p><h2>Стойка и контрол</h2><p th:text="${exercise.posture}"></p><h2>Чести грешки</h2><p th:text="${exercise.mistakes}"></p></section><section class="module-panel"><h2>По-лесен вариант</h2><p th:text="${exercise.easier}"></p><h2>По-труден вариант</h2><p th:text="${exercise.harder}"></p></section><aside class="module-panel caution-panel"><h2>Безопасност</h2><p th:text="${exercise.safety}"></p></aside></div><section class="module-panel mt-4"><h2>Алтернативни упражнения</h2><div class="module-tags"><a class="btn btn-outline-light" th:each="e:${alternatives}" th:href="@{/exercises/{code}(code=${e.code})}" th:text="${e.name}"></a></div></section></main><script th:src="@{/js/anatomy.js}" defer></script></body></html>
