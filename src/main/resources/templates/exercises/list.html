<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Библиотека с упражнения')}"></head><body class="page-bg "><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<header class="module-heading"><div><span class="eyebrow">Движение с добра техника</span><h1>Библиотека с упражнения</h1><p>Намери движение за своята цел, оборудване и опит.</p></div><a class="btn btn-outline-dark" th:href="@{/programs}">Тренировъчни програми</a></header>
<div th:replace="~{fragments/anatomy :: figure('library',${muscle},null,null)}"></div><form class="module-filter" method="get" th:action="@{/exercises}"><div class="filter-search"><label for="exercise-q">Търси по име</label><input class="form-control" id="exercise-q" name="q" th:value="${q}" type="search" maxlength="150" placeholder="Например: клек, планк…"></div><div><label for="muscle">Мускулна група</label><select class="form-select" id="muscle" name="muscle"><option value="">Всички групи</option><option th:each="v:${muscles}" th:value="${v}" th:text="${v}" th:selected="${v==muscle}"></option></select></div><div><label for="difficulty">Трудност</label><select class="form-select" id="difficulty" name="difficulty"><option value="">Всички нива</option><option th:each="v:${difficulties}" th:value="${v}" th:text="${v}" th:selected="${v==difficulty}"></option></select></div><div><label for="equipment">Оборудване</label><select class="form-select" id="equipment" name="equipment"><option value="">Всякакво</option><option th:each="v:${equipmentOptions}" th:value="${v}" th:text="${v}" th:selected="${v==equipment}"></option></select></div><div><label for="location">Място</label><select class="form-select" id="location" name="location"><option value="">Навсякъде</option><option value="У дома" th:selected="${location=='У дома'}">У дома</option><option value="Фитнес" th:selected="${location=='Фитнес'}">Фитнес</option></select></div><button class="btn btn-pulse" type="submit">Покажи</button></form>
<div class="module-results"><p><strong th:text="${exercises.totalElements}"></strong> упражнения</p><a class="link-pulse" th:href="@{/exercises}">Изчисти филтрите</a></div>
<div class="module-empty" th:if="${exercises.empty}"><h2>Няма упражнения за този избор</h2><p>Промени името или филтрите.</p><a class="btn btn-pulse" th:href="@{/exercises}">Всички упражнения</a></div>
<section class="exercise-library-grid"><article class="exercise-card" th:each="e:${exercises}" th:data-category="${e.muscle}"><a th:href="@{/exercises/{code}(code=${e.code})}"><img th:src="@{/images/exercise-placeholder.svg}" alt="Илюстративен символ за упражнение" loading="lazy"></a><div class="exercise-card-body"><span class="eyebrow" th:text="${e.muscle}"></span><h2 th:text="${e.name}"></h2><p th:text="${e.equipment}"></p><span class="module-tag" th:text="${e.difficulty}"></span><a class="btn btn-pulse" th:href="@{/exercises/{code}(code=${e.code})}">Виж упражнението</a></div></article></section>
<nav class="module-pagination" aria-label="Страници с упражнения" th:if="${exercises.totalPages>1}"><a class="btn btn-outline-dark" th:if="${exercises.hasPrevious()}" th:href="@{/exercises(q=${q},muscle=${muscle},difficulty=${difficulty},equipment=${equipment},location=${location},page=${exercises.number-1})}">← Предишна</a><span th:text="'Страница '+${exercises.number+1}+' от '+${exercises.totalPages}"></span><a class="btn btn-outline-dark" th:if="${exercises.hasNext()}" th:href="@{/exercises(q=${q},muscle=${muscle},difficulty=${difficulty},equipment=${equipment},location=${location},page=${exercises.number+1})}">Следваща →</a></nav></main><script th:src="@{/js/anatomy.js}" defer></script></body></html>
