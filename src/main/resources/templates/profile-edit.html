<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Редактиране на профил')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1>Редактиране на профил</h1><div th:if="${globalError}" class="alert alert-danger" th:text="${globalError}"></div><form th:action="@{/profile/edit}" th:object="${profileUpdateRequest}" method="post"><label>Потребителско име</label><input class="form-control" th:field="*{username}"><div class="field-error" th:errors="*{username}"></div><label>Имейл</label><input type="email" class="form-control" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div><label>Показвано име</label><input class="form-control" th:field="*{displayName}"><label>За мен</label><textarea class="form-control" maxlength="500" th:field="*{bio}"></textarea><label>Град</label><input class="form-control" th:field="*{homeCity}"><div id="privacy-settings" class="pt-3"><h2 class="h5">Настройки за поверителност</h2><p class="text-muted small">Избери какво да виждат другите. Дневникът, календарът и личните ти планове остават частни.</p></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" th:field="*{publicProfile}"><label class="form-check-label">Профилът ми да е публичен</label></div><div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{showCity}"><label class="form-check-label" for="showCity">Показвай града в публичния профил</label></div><div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{showFavorites}"><label class="form-check-label" for="showFavorites">Показвай любимите фитнеси в публичния профил</label></div><p class="text-muted mt-2">Историята на прогреса е видима само за теб.</p><div class="d-flex gap-2 mt-3"><button class="btn btn-pulse">Запази</button><a th:href="@{/profile}" class="btn btn-outline-dark">Отказ</a></div></form></div></main></body></html>
