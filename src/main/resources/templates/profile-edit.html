<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.edit.profile})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1>[[#{ui.edit.profile}]]</h1><div th:if="${globalError}" class="alert alert-danger" th:text="${@uiText.label(globalError)}"></div><form th:action="@{/profile/edit}" th:object="${profileUpdateRequest}" method="post"><label>[[#{ui.username}]]</label><input class="form-control" th:field="*{username}"><div class="field-error" th:errors="*{username}"></div><label>[[#{ui.email}]]</label><input type="email" class="form-control" th:field="*{email}"><div class="field-error" th:errors="*{email}"></div><label>[[#{ui.display.name}]]</label><input class="form-control" th:field="*{displayName}"><fieldset th:fragment="personalFields" class="mt-3"><legend class="h5">[[#{ui.data.for.your.meal.plan}]]</legend><div class="row g-3"><div class="col-sm-6"><label for="sex">[[#{ui.sex}]]</label><select class="form-select" th:field="*{sex}"><option value="">[[#{ui.select}]]</option><option value="MALE">[[#{ui.male}]]</option><option value="FEMALE">[[#{ui.female}]]</option></select><div class="field-error" th:errors="*{sex}"></div></div><div class="col-sm-6"><label for="birthDate">[[#{ui.date.of.birth}]]</label><input class="form-control" type="date" th:field="*{birthDate}" th:max="${#temporals.format(#temporals.createToday(),'yyyy-MM-dd')}"><div class="field-error" th:errors="*{birthDate}"></div></div><div class="col-sm-6"><label for="height">[[#{ui.height.cm}]]</label><input class="form-control" type="number" th:field="*{height}" min="120" max="230" step="0.01"><div class="field-error" th:errors="*{height}"></div></div><div class="col-sm-6"><label for="weight">[[#{ui.weight.kg.2}]]</label><input class="form-control" type="number" th:field="*{weight}" min="20" max="400" step="0.01"><div class="field-error" th:errors="*{weight}"></div></div></div></fieldset><label>[[#{ui.about.me}]]</label><textarea class="form-control" maxlength="500" th:field="*{bio}"></textarea><label>[[#{ui.city}]]</label><input class="form-control" th:field="*{homeCity}"><div id="privacy-settings" class="pt-3"><h2 class="h5">[[#{ui.privacy.settings}]]</h2><p class="text-muted small">[[#{ui.choose.what.others.can.see.your.journal}]]</p></div><div class="form-check mt-3"><input class="form-check-input" type="checkbox" th:field="*{publicProfile}"><label class="form-check-label">[[#{ui.make.my.profile.public}]]</label></div><div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{showCity}"><label class="form-check-label" for="showCity">[[#{ui.show.my.city.on.my.public.profile}]]</label></div><div class="form-check"><input type="checkbox" class="form-check-input" th:field="*{showFavorites}"><label class="form-check-label" for="showFavorites">[[#{ui.show.my.favorite.gyms.on.my.public}]]</label></div><p class="text-muted mt-2">[[#{ui.only.you.can.see.your.progress.history}]]</p><div class="d-flex gap-2 mt-3"><button class="btn btn-pulse">[[#{action.save}]]</button><a th:href="@{/profile}" class="btn btn-outline-dark">[[#{action.cancel}]]</a></div></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
