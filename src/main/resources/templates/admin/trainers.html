<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.manage.trainers.2})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>[[#{ui.trainers}]]</h1><a class="btn btn-pulse mb-3" th:href="@{/admin/trainers/create}">[[#{ui.add.trainer}]]</a><article class="fit-card mb-3" th:each="t:${trainers}"><h2 class="h4" th:text="${t.name}"></h2><p th:text="${t.published?#messages.msg('ui.published'):#messages.msg('ui.hidden')}"></p><a class="btn btn-outline-dark" th:href="@{/admin/trainers/{id}/edit(id=${t.id})}">[[#{ui.edit.change.visibility}]]</a><form class="d-inline" method="post" th:action="@{/admin/trainers/{id}/delete(id=${t.id})}" th:data-confirm="#{ui.delete.this.trainer}" onsubmit="return confirm(this.dataset.confirm);"><button class="btn btn-outline-danger">[[#{action.delete}]]</button></form></article><a th:href="@{/admin}">[[#{nav.admin}]]</a></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
