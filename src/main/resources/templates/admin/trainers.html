<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Управление на треньори')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>Треньори</h1><a class="btn btn-pulse mb-3" th:href="@{/admin/trainers/create}">Добави треньор</a><article class="fit-card mb-3" th:each="t:${trainers}"><h2 class="h4" th:text="${t.name}"></h2><p th:text="${t.published?'Публикуван':'Скрит'}"></p><a class="btn btn-outline-dark" th:href="@{/admin/trainers/{id}/edit(id=${t.id})}">Редактирай / промени видимостта</a><form class="d-inline" method="post" th:action="@{/admin/trainers/{id}/delete(id=${t.id})}" onsubmit="return confirm('Изтриване на треньора?');"><button class="btn btn-outline-danger">Изтрий</button></form></article><a th:href="@{/admin}">Администрация</a></main></body></html>
