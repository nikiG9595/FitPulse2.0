<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Модериране на коментари')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>Модериране на коментари</h1><nav class="d-flex flex-wrap gap-2 mb-3" aria-label="Филтри за коментари">
<a class="btn btn-outline-dark" th:href="@{/admin/reviews}" th:attr="aria-current=${filter=='all' and !detail?'page':null}">Всички</a>
<a class="btn btn-outline-dark" th:href="@{/admin/reviews(filter='new')}" th:attr="aria-current=${filter=='new'?'page':null}">Нови</a>
<a class="btn btn-outline-dark" th:href="@{/admin/reviews(filter='reviewed')}" th:attr="aria-current=${filter=='reviewed'?'page':null}">Прегледани</a>
</nav><p class="fit-card" th:if="${#lists.isEmpty(reviews)}">Няма коментари по избрания филтър.</p><div class="fit-card mb-3" th:each="r:${reviews}"><a class="link-pulse" th:if="${!detail}" th:href="@{/admin/reviews/{id}(id=${r.id})}">Отвори коментара</a><span class="ms-2" th:if="${!r.adminReviewed}">Непрегледан</span><strong class="d-block" th:text="${r.gym.name}+' · '+${r.user.username}"></strong><p th:text="${r.comment}"></p><p>Статус: <strong th:text="${r.status.displayName}"></strong></p><form th:unless="${r.status.name()=='ARCHIVED' or r.status.name()=='REJECTED'}" method="post" th:action="@{/admin/reviews/{id}(id=${r.id})}"><button class="btn btn-outline-danger" name="status" value="HIDDEN">Скрий</button><button class="btn btn-outline-success" name="status" value="PUBLISHED">Публикувай</button></form></div><h2>Сигнали</h2><div class="fit-card mb-2" th:each="x:${reports}"><strong th:text="${x.reporter.username}"></strong><p th:text="${x.reason}"></p><span th:text="${x.status.displayName}"></span><p th:text="${x.review.comment}"></p><form th:if="${x.status.name()=='OPEN'}" method="post" th:action="@{/admin/reports/{id}/resolve(id=${x.id})}"><button class="btn btn-outline-dark">Приключи сигнала</button></form></div></main></body></html>
