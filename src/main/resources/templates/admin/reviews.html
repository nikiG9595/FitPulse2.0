<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Модериране на коментари')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>Модериране на коментари</h1><div class="fit-card mb-3" th:each="r:${reviews}"><strong th:text="${r.gym.name}+' · '+${r.user.username}+' · '+${r.rating}+'★'"></strong><p th:text="${r.comment}"></p><form method="post" th:action="@{/admin/reviews/{id}(id=${r.id})}"><button class="btn btn-outline-danger" name="status" value="HIDDEN">Скрий</button><button class="btn btn-outline-success" name="status" value="PUBLISHED">Публикувай</button></form></div><h2>Сигнали</h2><div class="fit-card mb-2" th:each="x:${reports}"><strong th:text="${x.reporter.username}"></strong><p th:text="${x.reason}"></p><span th:text="${x.status.displayName}"></span><p th:text="${x.review.comment}"></p><form th:if="${x.status.name()=='OPEN'}" method="post" th:action="@{/admin/reports/{id}/resolve(id=${x.id})}"><button class="btn btn-outline-dark">Приключи сигнала</button></form></div></main></body></html>
