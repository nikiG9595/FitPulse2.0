<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.comment.moderation})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>[[#{ui.comment.moderation}]]</h1><nav class="d-flex flex-wrap gap-2 mb-3" th:aria-label="#{ui.comment.filters}">
<a class="btn btn-outline-dark" th:href="@{/admin/reviews}" th:attr="aria-current=${filter=='all' and !detail?'page':null}">[[#{ui.all}]]</a>
<a class="btn btn-outline-dark" th:href="@{/admin/reviews(filter='new')}" th:attr="aria-current=${filter=='new'?'page':null}">[[#{ui.new}]]</a>
<a class="btn btn-outline-dark" th:href="@{/admin/reviews(filter='reviewed')}" th:attr="aria-current=${filter=='reviewed'?'page':null}">[[#{ui.reviewed}]]</a>
</nav><p class="fit-card" th:if="${#lists.isEmpty(reviews)}">[[#{ui.no.comments.match.this.filter}]]</p><div class="fit-card mb-3" th:each="r:${reviews}"><a class="link-pulse" th:if="${!detail}" th:href="@{/admin/reviews/{id}(id=${r.id})}">[[#{ui.open.comment}]]</a><span class="ms-2" th:if="${!r.adminReviewed}">[[#{ui.unreviewed}]]</span><strong class="d-block" th:text="${r.gym.name}+' · '+${r.user.username}"></strong><p th:text="${r.comment}"></p><p>[[#{ui.status.2}]] <strong th:text="${@uiText.label(r.status.displayName)}"></strong></p><form th:unless="${r.status.name()=='ARCHIVED' or r.status.name()=='REJECTED'}" method="post" th:action="@{/admin/reviews/{id}(id=${r.id})}"><button class="btn btn-outline-danger" name="status" value="HIDDEN">[[#{ui.hide}]]</button><button class="btn btn-outline-success" name="status" value="PUBLISHED">[[#{ui.publish}]]</button></form></div><h2>[[#{ui.reports}]]</h2><div class="fit-card mb-2" th:each="x:${reports}"><strong th:text="${x.reporter.username}"></strong><p th:text="${x.reason}"></p><span th:text="${@uiText.label(x.status.displayName)}"></span><p th:text="${x.review.comment}"></p><form th:if="${x.status.name()=='OPEN'}" method="post" th:action="@{/admin/reports/{id}/resolve(id=${x.id})}"><button class="btn btn-outline-dark">[[#{ui.resolve.report}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
