<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Редактор на фитнес')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1>Редактор на фитнес</h1><form method="post" th:object="${gymForm}" th:action="${gymId==null}?@{/admin/gyms/create}:@{/admin/gyms/{id}/edit(id=${gymId})}"><label>Град</label><select class="form-select" th:field="*{cityId}"><option th:each="c:${cities}" th:value="${c.id}" th:text="${c.name}"></option></select><label>Име</label><input class="form-control" th:field="*{name}"><label>Описание</label><textarea class="form-control" th:field="*{description}"></textarea><label>Адрес</label><input class="form-control" th:field="*{address}"><div class="row"><div class="col"><label>Географска ширина</label><input class="form-control" th:field="*{latitude}"></div><div class="col"><label>Географска дължина</label><input class="form-control" th:field="*{longitude}"></div></div><label>Телефон</label><input class="form-control" th:field="*{phone}"><label>Уебсайт</label><input class="form-control" th:field="*{websiteUrl}"><label>Работно време</label><textarea class="form-control" th:field="*{openingHours}"></textarea><label>Услуги</label><textarea class="form-control" th:field="*{services}"></textarea><label>Цени</label><textarea class="form-control" th:field="*{priceInfo}"></textarea><label>Статус</label><select class="form-select" th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s.displayName}"></option></select><button class="btn btn-pulse mt-3">Запази</button></form><div th:if="${gymId!=null}" class="mt-4"><h2 class="h5">Снимки</h2><div th:each="p:${gym.photos}" class="d-flex gap-2 align-items-center mb-2"><img th:src="${p.imageUrl}" th:alt="${p.altText}" width="90"><form method="post" th:action="@{/admin/photos/{id}/delete(id=${p.id})}" onsubmit="return confirm('Изтриване на снимката?');"><button class="btn btn-sm btn-outline-danger">Изтрий</button></form></div><form method="post" th:action="@{/admin/gyms/{id}/photos(id=${gymId})}"><h3 class="h6">Добави снимка чрез URL</h3><input class="form-control" name="imageUrl" placeholder="https://..."><input class="form-control" name="altText" placeholder="Описание на снимката"><button class="btn btn-outline-dark mt-2">Добави снимка</button></form></div></div></main></body></html>
