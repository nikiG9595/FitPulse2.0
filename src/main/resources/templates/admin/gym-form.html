<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.gym.editor})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><p><a class="back-link" th:href="@{/admin/gyms}">[[#{ui.manage.gyms}]]</a></p><p><a class="link-pulse" th:href="@{/admin/cities}">[[#{ui.manage.existing.cities}]]</a></p><div class="fit-card"><h1>[[#{ui.gym.editor}]]</h1><form method="post" th:object="${gymForm}" th:action="${gymId==null}?@{/admin/gyms/create}:@{/admin/gyms/{id}/edit(id=${gymId})}"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}" role="alert"><p>[[#{ui.check.the.form.fields}]]</p><ul><li th:each="e:${#fields.detailedErrors()}" th:text="${@uiText.label(e.message)}"></li></ul></div><p>[[#{ui.leave.unknown.details.blank.do.not.add}]]</p><label for="cityId">[[#{ui.city}]]</label><select class="form-select" th:field="*{cityId}" aria-describedby="new-city-help"><option value="">[[#{ui.select.a.city.or.enter.a.new}]]</option><option th:each="c:${cities}" th:value="${c.id}" th:text="${c.name}"></option></select><label for="newCityName">[[#{ui.new.city.if.missing.from.the.list}]]</label><input class="form-control" th:field="*{newCityName}" maxlength="100" aria-describedby="new-city-help"><p id="new-city-help" class="small">[[#{ui.select.an.existing.city.or.enter.a}]]</p><label>[[#{ui.name}]]</label><input class="form-control" th:field="*{name}"><label>[[#{ui.description}]]</label><textarea class="form-control" th:field="*{description}"></textarea><label>[[#{ui.address}]]</label><input class="form-control" th:field="*{address}"><div class="row"><div class="col"><label>[[#{ui.latitude}]]</label><input class="form-control" th:field="*{latitude}"></div><div class="col"><label>[[#{ui.longitude}]]</label><input class="form-control" th:field="*{longitude}"></div></div><label>[[#{ui.phone}]]</label><input class="form-control" th:field="*{phone}"><label>[[#{ui.website}]]</label><input class="form-control" th:field="*{websiteUrl}"><label>[[#{ui.opening.hours}]]</label><textarea class="form-control" th:field="*{openingHours}"></textarea><label>[[#{ui.services}]]</label><textarea class="form-control" th:field="*{services}"></textarea><label>[[#{ui.prices}]]</label><textarea class="form-control" th:field="*{priceInfo}"></textarea><label>[[#{ui.status}]]</label><select class="form-select" th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${@uiText.label(s.displayName)}"></option></select><button class="btn btn-pulse mt-3">[[#{action.save}]]</button></form><div th:if="${gymId!=null}" class="mt-4"><h2 class="h5">[[#{ui.photos}]]</h2><div th:each="p:${gym.photos}" class="d-flex gap-2 align-items-center mb-2"><img th:src="${@browserMedia.local(p.imageUrl)} ? @{${p.imageUrl}} : null" th:data-external-src="${@browserMedia.external(p.imageUrl)}" referrerpolicy="no-referrer" th:alt="${p.altText}" width="90"><form method="post" th:action="@{/admin/photos/{id}/delete(id=${p.id})}" th:data-confirm="#{ui.delete.the.photo}" onsubmit="return confirm(this.dataset.confirm);"><button class="btn btn-sm btn-outline-danger">[[#{action.delete}]]</button></form></div><form method="post" th:action="@{/admin/gyms/{id}/photos(id=${gymId})}"><h3 class="h6">[[#{ui.add.a.photo.via.url}]]</h3><input class="form-control" name="imageUrl" placeholder="https://..."><input class="form-control" name="altText" th:placeholder="#{ui.photo.description}"><button class="btn btn-outline-dark mt-2">[[#{ui.add.a.photo}]]</button></form></div></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
