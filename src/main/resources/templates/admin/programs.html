<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Управление на програми')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><h1>Тренировъчни програми</h1><a class="btn btn-pulse" th:href="@{/admin/programs/create}">Нова програма</a></div><div class="row g-3"><div class="col-md-4" th:each="p:${templates}"><div class="fit-card h-100"><h2 class="h5" th:text="${p.displayName}"></h2><p th:text="${p.goal.displayName}+' · '+${p.experience.displayName}+' · '+${p.location.displayName}"></p><div class="d-flex flex-wrap gap-2"><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/programs/{id}/edit(id=${p.id})}">Редактирай</a><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/programs/{id}/items(id=${p.id})}">Упражнения</a><form method="post" th:action="@{/admin/programs/{id}/active(id=${p.id})}"><input type="hidden" name="active" th:value="${!p.active}"><button class="btn btn-sm" th:classappend="${p.active?'btn-outline-warning':'btn-outline-success'}" th:text="${p.active?'Деактивирай':'Активирай'}"></button></form><form method="post" th:action="@{/admin/programs/{id}/delete(id=${p.id})}" onsubmit="return confirm('Сигурни ли сте, че искате да изтриете тази програма? Личните копия ще бъдат запазени.');"><button class="btn btn-sm btn-outline-danger">Изтрий</button></form></div></div></div></div></main></body></html>
