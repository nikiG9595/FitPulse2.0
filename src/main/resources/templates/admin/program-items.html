<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Упражнения в шаблон')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page">
<h1 th:text="${template.name}"></h1><p>Промените важат за бъдещите копия. Съществуващите лични програми се запазват.</p>
<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
<article class="fit-card mb-3" th:each="i:${template.items}"><form class="row g-2" method="post" th:action="@{/admin/programs/{id}/items(id=${template.id})}">
<input type="hidden" name="itemId" th:value="${i.id}"><div class="col-12"><label>Фокус на тренировката</label><input class="form-control" name="sessionTitle" th:value="${i.sessionTitle}" maxlength="100"></div><div class="col"><label>Подредба на сесията</label><input class="form-control" type="number" name="dayNumber" th:value="${i.dayNumber}" min="1" max="7" required></div>
<div class="col-md-4"><label>Упражнение</label><input class="form-control" name="exerciseName" th:value="${i.exerciseName}" maxlength="150" required></div>
<div class="col"><label>Серии</label><input class="form-control" type="number" name="setsCount" th:value="${i.setsCount}" min="1" max="20" required></div><div class="col"><label>Повторения</label><input class="form-control" name="repetitions" th:value="${i.repetitions}" maxlength="50" required></div><div class="col"><label>Почивка (сек.)</label><input class="form-control" type="number" name="restSeconds" th:value="${i.restSeconds}" min="15" max="600"></div><div class="col-12"><label>Инструкции</label><textarea class="form-control" name="instructions" th:text="${i.instructions}" maxlength="500"></textarea></div><div class="col-auto align-self-end"><button class="btn btn-outline-dark">Запази</button></div></form>
<form method="post" th:action="@{/admin/programs/{id}/items/{itemId}/delete(id=${template.id},itemId=${i.id})}"><button class="btn btn-sm btn-outline-danger mt-2">Изтрий упражнението</button></form></article>
<form class="fit-card" method="post" th:action="@{/admin/programs/{id}/items(id=${template.id})}"><h2 class="h4">Добави упражнение</h2><label>Фокус на тренировката</label><input class="form-control" name="sessionTitle" maxlength="100" placeholder="Например: Гърди и трицепс"><label>Подредба на сесията</label><input class="form-control" type="number" name="dayNumber" min="1" max="7" required><label>Упражнение</label><input class="form-control" name="exerciseName" maxlength="150" required><label>Серии</label><input class="form-control" type="number" name="setsCount" min="1" max="20" required><label>Повторения</label><input class="form-control" name="repetitions" maxlength="50" required><label>Почивка (сек.)</label><input class="form-control" type="number" name="restSeconds" min="15" max="600" value="90"><label>Инструкции</label><textarea class="form-control" name="instructions" maxlength="500"></textarea><button class="btn btn-pulse mt-3">Добави</button></form><a class="d-block mt-3" th:href="@{/admin/programs}">Всички програми</a></main></body></html>
