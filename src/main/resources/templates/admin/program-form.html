<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.program.editor})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><p><a class="back-link" th:href="@{/admin/programs}">[[#{ui.manage.programs}]]</a></p><div class="fit-card"><h1 th:text="${template.id==null?#messages.msg('ui.new.program'):#messages.msg('ui.edit.program')}"></h1><form method="post" th:action="@{/admin/programs}"><input type="hidden" name="id" th:value="${template.id}"><label>[[#{ui.name}]]</label><input class="form-control" name="name" th:value="${template.name}" required><label>[[#{ui.goal}]]</label><select class="form-select" name="goal"><option th:each="v:${goals}" th:value="${v}" th:text="${@uiText.label(v.displayName)}" th:selected="${v==template.goal}"></option></select><label>[[#{ui.level}]]</label><select class="form-select" name="experience"><option th:each="v:${levels}" th:value="${v}" th:text="${@uiText.label(v.displayName)}" th:selected="${v==template.experience}"></option></select><label>[[#{ui.training.days}]]</label><input class="form-control" name="trainingDays" type="number" min="1" max="7" th:value="${template.trainingDays>0?template.trainingDays:3}" required><label>[[#{ui.location}]]</label><select class="form-select" name="location"><option th:each="v:${locations}" th:value="${v}" th:text="${@uiText.label(v.displayName)}" th:selected="${v==template.location}"></option></select><label>[[#{ui.description}]]</label><textarea class="form-control" name="description" required th:text="${template.description}"></textarea><button class="btn btn-pulse mt-3">[[#{action.save}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
