<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Редактор на програма')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1 th:text="${template.id==null?'Нова програма':'Редактиране на програма'}"></h1><form method="post" th:action="@{/admin/programs}"><input type="hidden" name="id" th:value="${template.id}"><label>Име</label><input class="form-control" name="name" th:value="${template.name}" required><label>Цел</label><select class="form-select" name="goal"><option th:each="v:${goals}" th:value="${v}" th:text="${v.displayName}" th:selected="${v==template.goal}"></option></select><label>Ниво</label><select class="form-select" name="experience"><option th:each="v:${levels}" th:value="${v}" th:text="${v.displayName}" th:selected="${v==template.experience}"></option></select><label>Тренировъчни дни</label><input class="form-control" name="trainingDays" type="number" min="1" max="7" th:value="${template.trainingDays>0?template.trainingDays:3}" required><label>Място</label><select class="form-select" name="location"><option th:each="v:${locations}" th:value="${v}" th:text="${v.displayName}" th:selected="${v==template.location}"></option></select><label>Описание</label><textarea class="form-control" name="description" required th:text="${template.description}"></textarea><button class="btn btn-pulse mt-3">Запази</button></form></div></main></body></html>
