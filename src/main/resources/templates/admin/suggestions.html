<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Предложения за фитнеси')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>Предложения за фитнеси</h1><p>Проверете данните и правото за използване на снимката. Одобрението публикува залата; повторното одобрение не създава второ копие.</p><div class="alert alert-success" th:if="${success}" th:text="${success}" role="status"></div><div class="alert alert-warning" th:if="${error}" th:text="${error}" role="alert"></div><p class="fit-card" th:if="${#lists.isEmpty(suggestions)}">Все още няма предложения.</p>
<article class="fit-card mb-3" th:each="s:${suggestions}"><h2 class="h5" th:text="${s.name}+' · '+${s.cityName}"></h2><p th:text="${s.address}"></p><p th:text="${s.details}"></p><dl><dt>Телефон</dt><dd th:text="${#strings.isEmpty(s.phone)?'Не е посочен':s.phone}"></dd><dt>Уебсайт</dt><dd th:text="${#strings.isEmpty(s.websiteUrl)?'Не е посочен':s.websiteUrl}"></dd><dt>Цени</dt><dd style="white-space:pre-line" th:text="${#strings.isEmpty(s.priceInfo)?'Не са посочени':s.priceInfo}"></dd><dt>Подател</dt><dd th:text="${s.submittedBy!=null?s.submittedBy.username:'Старо предложение без свързан потребител'}"></dd></dl>
<div th:if="${!#strings.isEmpty(s.imageUrl)}"><img th:src="${s.imageUrl}" alt="Предложена снимка на залата — за административен преглед" loading="lazy" style="max-width:100%;max-height:240px;object-fit:contain" onerror="this.hidden=true;this.nextElementSibling.hidden=false;"><p hidden>Предложената снимка не може да се зареди.</p></div>
<span class="badge text-bg-dark" th:text="${s.status.displayName}"></span><p th:if="${!#strings.isEmpty(s.adminNote)}" th:text="${s.adminNote}"></p>
<a class="btn btn-outline-dark mt-2" th:if="${s.publishedGym!=null}" th:href="@{/admin/gyms/{id}/edit(id=${s.publishedGym.id})}">Редактирай свързаната зала</a>
<form th:if="${s.publishedGym==null}" class="mt-2" method="post" th:action="@{/admin/suggestions/{id}(id=${s.id})}"><label th:for="'note-'+${s.id}">Бележка от администратор</label><textarea class="form-control" th:id="'note-'+${s.id}" name="adminNote" maxlength="1000" th:text="${s.adminNote}"></textarea><button class="btn btn-success mt-2" name="status" value="APPROVED">Одобри и публикувай</button><button class="btn btn-outline-danger mt-2" name="status" value="REJECTED">Отхвърли</button></form>
</article></main></body></html>
