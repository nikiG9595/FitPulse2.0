<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Предложения за фитнеси')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>Предложения за фитнеси</h1><div class="fit-card mb-3" th:each="s:${suggestions}"><h2 class="h5" th:text="${s.name}+' · '+${s.cityName}"></h2><p th:text="${s.address}"></p><p th:text="${s.details}"></p><span class="badge text-bg-dark" th:text="${s.status.displayName}"></span><form class="mt-2" method="post" th:action="@{/admin/suggestions/{id}(id=${s.id})}"><textarea class="form-control" name="adminNote" placeholder="Бележка от администратор"></textarea><button class="btn btn-success mt-2" name="status" value="APPROVED">Одобри</button><button class="btn btn-outline-danger mt-2" name="status" value="REJECTED">Отхвърли</button></form></div></main></body></html>
