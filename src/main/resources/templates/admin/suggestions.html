<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.gym.suggestions})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><h1>[[#{ui.gym.suggestions}]]</h1><p th:if="${status!=null}"><span th:text="#{ui.filter}+${@uiText.label(status.displayName)}"></span> · <a class="link-pulse" th:href="@{/admin/suggestions}">[[#{ui.all.suggestions}]]</a></p><p>[[#{ui.verify.the.details.and.permission.to.use}]]</p><div class="alert alert-success" th:if="${success}" th:text="${@uiText.label(success)}" role="status"></div><div class="alert alert-warning" th:if="${error}" th:text="${@uiText.label(error)}" role="alert"></div><p class="fit-card" th:if="${#lists.isEmpty(suggestions)}">[[#{ui.there.are.no.suggestions.yet}]]</p>
<article class="fit-card mb-3" th:each="s:${suggestions}"><h2 class="h5" th:text="${s.name}+' · '+${s.cityName}"></h2><p th:text="${s.address}"></p><p th:text="${s.details}"></p><dl><dt>[[#{ui.phone}]]</dt><dd th:text="${#strings.isEmpty(s.phone)?#messages.msg('ui.not.specified'):s.phone}"></dd><dt>[[#{ui.website}]]</dt><dd th:text="${#strings.isEmpty(s.websiteUrl)?#messages.msg('ui.not.specified'):s.websiteUrl}"></dd><dt>[[#{ui.prices}]]</dt><dd style="white-space:pre-line" th:text="${#strings.isEmpty(s.priceInfo)?#messages.msg('ui.not.specified.2'):s.priceInfo}"></dd><dt>[[#{ui.submitted.by}]]</dt><dd th:text="${s.submittedBy!=null?s.submittedBy.username:#messages.msg('ui.older.suggestion.without.a.linked.user')}"></dd></dl>
<div th:if="${!#strings.isEmpty(s.imageUrl)}"><img th:src="${@browserMedia.local(s.imageUrl)} ? @{${s.imageUrl}} : null" th:data-external-src="${@browserMedia.external(s.imageUrl)}" referrerpolicy="no-referrer" th:alt="#{ui.suggested.gym.photo.for.administrator.review}" loading="lazy" style="max-width:100%;max-height:240px;object-fit:contain" onerror="this.hidden=true;this.nextElementSibling.hidden=false;"><p hidden>[[#{ui.the.suggested.gym.photo.could.not.be}]]</p></div>
<span class="badge text-bg-dark" th:text="${@uiText.label(s.status.displayName)}"></span><p th:if="${!#strings.isEmpty(s.adminNote)}" th:text="${s.adminNote}"></p>
<a class="btn btn-outline-dark mt-2" th:if="${s.publishedGym!=null}" th:href="@{/admin/gyms/{id}/edit(id=${s.publishedGym.id})}">[[#{ui.edit.linked.gym}]]</a>
<form th:if="${s.publishedGym==null}" class="mt-2" method="post" th:action="@{/admin/suggestions/{id}(id=${s.id})}"><label th:for="'note-'+${s.id}">[[#{ui.administrator.note}]]</label><textarea class="form-control" th:id="'note-'+${s.id}" name="adminNote" maxlength="1000" th:text="${s.adminNote}"></textarea><button class="btn btn-success mt-2" name="status" value="APPROVED">[[#{ui.approve.and.publish}]]</button><button class="btn btn-outline-danger mt-2" name="status" value="REJECTED">[[#{ui.reject}]]</button></form>
</article></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
