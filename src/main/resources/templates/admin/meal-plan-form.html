<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Редактор на хранителен режим')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1 th:text="${template.id==null?'Нов хранителен режим':'Редактиране на режим'}"></h1><form method="post" th:action="@{/admin/meal-plans}"><input type="hidden" name="id" th:value="${template.id}"><label>Име</label><input class="form-control" name="name" th:value="${template.name}" required><label>Цел</label><select class="form-select" name="goal"><option th:each="v:${goals}" th:value="${v}" th:text="${v.displayName}" th:selected="${v==template.goal}"></option></select><label>Описание</label><textarea class="form-control" name="description" required th:text="${template.description}"></textarea><label>Хранения</label><textarea class="form-control" rows="5" name="meals" required th:text="${template.meals}"></textarea><label>Примерни храни</label><textarea class="form-control" rows="4" name="exampleFoods" required th:text="${template.exampleFoods}"></textarea><label>Предупреждение</label><textarea class="form-control" name="disclaimer" required th:text="${template.disclaimer}"></textarea><button class="btn btn-pulse mt-3">Запази</button></form></div></main></body></html>
