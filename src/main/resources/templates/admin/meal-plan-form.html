<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.meal.plan.editor})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><p><a class="back-link" th:href="@{/admin/meal-plans}">[[#{ui.manage.meal.plans}]]</a></p><div class="fit-card"><h1 th:text="${template.id==null?#messages.msg('ui.new.meal.plan'):#messages.msg('ui.edit.meal.plan')}"></h1><form method="post" th:action="@{/admin/meal-plans}"><input type="hidden" name="id" th:value="${template.id}"><label>[[#{ui.name}]]</label><input class="form-control" name="name" th:value="${template.name}" required><label>[[#{ui.goal}]]</label><select class="form-select" name="goal"><option th:each="v:${goals}" th:value="${v}" th:text="${@uiText.label(v.displayName)}" th:selected="${v==template.goal}"></option></select><label>[[#{ui.description}]]</label><textarea class="form-control" name="description" required th:text="${template.description}"></textarea><label>[[#{ui.meals}]]</label><textarea class="form-control" rows="5" name="meals" required th:text="${template.meals}"></textarea><label>[[#{ui.example.foods}]]</label><textarea class="form-control" rows="4" name="exampleFoods" required th:text="${template.exampleFoods}"></textarea><label>[[#{ui.warning}]]</label><textarea class="form-control" name="disclaimer" required th:text="${template.disclaimer}"></textarea><button class="btn btn-pulse mt-3">[[#{action.save}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
