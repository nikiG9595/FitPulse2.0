<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.manage.gyms.2})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div th:if="${success}" class="alert alert-success" th:text="${@uiText.label(success)}"></div><div class="section-heading"><h1>[[#{nav.gyms}]]</h1><a class="btn btn-pulse" th:href="@{/admin/gyms/create}">[[#{ui.add.gym}]]</a></div><p th:if="${status!=null}"><span th:text="#{ui.filter}+${@uiText.label(status.displayName)}"></span> · <a class="link-pulse" th:href="@{/admin/gyms}">[[#{ui.all.gyms}]]</a></p><div class="table-responsive fit-card"><table class="table"><thead><tr><th>[[#{ui.name}]]</th><th>[[#{ui.city}]]</th><th>[[#{ui.status}]]</th><th>[[#{ui.actions}]]</th></tr></thead><tbody><tr th:each="g:${gyms}"><td th:text="${g.name}"></td><td th:text="${g.city.name}"></td><td th:text="${@uiText.label(g.status.displayName)}"></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/gyms/{id}/edit(id=${g.id})}">[[#{action.edit}]]</a><form method="post" th:action="@{/admin/gyms/{id}/delete(id=${g.id})}" th:data-confirm="#{ui.remove.the.gym.from.the.public.directory}" onsubmit="return confirm(this.dataset.confirm);"><button class="btn btn-sm btn-outline-danger">[[#{ui.remove.from.the.directory}]]</button></form></div></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
