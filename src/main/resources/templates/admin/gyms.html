<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Управление на фитнеси')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div class="section-heading"><h1>Фитнеси</h1><a class="btn btn-pulse" th:href="@{/admin/gyms/create}">Добави фитнес</a></div><div class="table-responsive fit-card"><table class="table"><thead><tr><th>Име</th><th>Град</th><th>Статус</th><th>Действия</th></tr></thead><tbody><tr th:each="g:${gyms}"><td th:text="${g.name}"></td><td th:text="${g.city.name}"></td><td th:text="${g.status.displayName}"></td><td><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/gyms/{id}/edit(id=${g.id})}">Редактирай</a><form method="post" th:action="@{/admin/gyms/{id}/delete(id=${g.id})}" onsubmit="return confirm('Сигурни ли сте? Снимките, оценките, коментарите и любимите връзки към този фитнес ще бъдат премахнати.');"><button class="btn btn-sm btn-outline-danger">Изтрий</button></form></div></td></tr></tbody></table></div></main></body></html>
