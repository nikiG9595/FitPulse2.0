<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.users})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="page-title"><h1>[[#{ui.manage.users}]]</h1><p>[[#{ui.view.registered.users.and.their.roles}]]</p></div><div th:if="${success}" class="alert alert-success" th:text="${@uiText.label(success)}"></div><div th:if="${error}" class="alert alert-danger" th:text="${@uiText.label(error)}"></div><div class="fit-card table-responsive"><table class="table"><thead><tr><th>[[#{ui.username}]]</th><th>[[#{ui.email}]]</th><th>[[#{ui.current.role}]]</th><th>[[#{ui.change.role}]]</th></tr></thead><tbody><tr th:each="user:${users}"><td th:text="${user.username}"></td><td th:text="${user.email}"></td><td th:text="${@uiText.label(user.role.displayName)}"></td><td><form class="d-flex gap-2" th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post"><select class="form-select" name="role"><option th:each="role:${roles}" th:value="${role}" th:text="${@uiText.label(role.displayName)}" th:selected="${role==user.role}"></option></select><button class="btn btn-pulse">[[#{ui.update}]]</button></form><form class="mt-2" method="post" th:action="@{/admin/users/{id}/hide-profile(id=${user.id})}"><button class="btn btn-sm btn-outline-danger">[[#{ui.hide.public.profile}]]</button></form></td></tr></tbody></table></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
