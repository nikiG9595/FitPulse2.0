<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Потребители')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="page-title"><h1>Управление на потребители</h1><p>Преглед на регистрираните потребители и техните роли.</p></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><div class="fit-card table-responsive"><table class="table"><thead><tr><th>Потребителско име</th><th>Имейл</th><th>Текуща роля</th><th>Промяна на роля</th></tr></thead><tbody><tr th:each="user:${users}"><td th:text="${user.username}"></td><td th:text="${user.email}"></td><td th:text="${user.role.displayName}"></td><td><form class="d-flex gap-2" th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post"><select class="form-select" name="role"><option th:each="role:${roles}" th:value="${role}" th:text="${role.displayName}" th:selected="${role==user.role}"></option></select><button class="btn btn-pulse">Обнови</button></form><form class="mt-2" method="post" th:action="@{/admin/users/{id}/hide-profile(id=${user.id})}"><button class="btn btn-sm btn-outline-danger">Скрий публичния профил</button></form></td></tr></tbody></table></div></main></body></html>
