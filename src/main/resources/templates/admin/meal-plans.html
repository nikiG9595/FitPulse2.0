<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.manage.meal.plans.2})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><h1>[[#{nav.meals}]]</h1><a class="btn btn-pulse" th:href="@{/admin/meal-plans/create}">[[#{ui.new.meal.plan.2}]]</a></div><div class="row g-3"><div class="col-md-6" th:each="p:${templates}"><div class="fit-card h-100"><span class="eyebrow" th:text="${@uiText.label(p.goal.displayName)}"></span><h2 class="h5" th:text="${p.name}"></h2><p th:text="${p.description}"></p><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/meal-plans/{id}/edit(id=${p.id})}">[[#{action.edit}]]</a><form method="post" th:action="@{/admin/meal-plans/{id}/active(id=${p.id})}"><input type="hidden" name="active" th:value="${!p.active}"><button class="btn btn-sm btn-outline-warning" th:text="${p.active?#messages.msg('ui.deactivate'):#messages.msg('ui.activate')}"></button></form><form method="post" th:action="@{/admin/meal-plans/{id}/delete(id=${p.id})}" th:data-confirm="#{ui.delete.the.meal.plan.personal.copies.will}" onsubmit="return confirm(this.dataset.confirm);"><button class="btn btn-sm btn-outline-danger">[[#{action.delete}]]</button></form></div></div></div></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
