<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Управление на хранителни режими')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><h1>Хранителни режими</h1><a class="btn btn-pulse" th:href="@{/admin/meal-plans/create}">Нов режим</a></div><div class="row g-3"><div class="col-md-6" th:each="p:${templates}"><div class="fit-card h-100"><span class="eyebrow" th:text="${p.goal.displayName}"></span><h2 class="h5" th:text="${p.name}"></h2><p th:text="${p.description}"></p><div class="d-flex gap-2"><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/meal-plans/{id}/edit(id=${p.id})}">Редактирай</a><form method="post" th:action="@{/admin/meal-plans/{id}/active(id=${p.id})}"><input type="hidden" name="active" th:value="${!p.active}"><button class="btn btn-sm btn-outline-warning" th:text="${p.active?'Деактивирай':'Активирай'}"></button></form><form method="post" th:action="@{/admin/meal-plans/{id}/delete(id=${p.id})}" onsubmit="return confirm('Сигурни ли сте, че искате да изтриете режима? Личните копия ще бъдат запазени.');"><button class="btn btn-sm btn-outline-danger">Изтрий</button></form></div></div></div></div></main></body></html>
