<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Редактиране на треньор')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="fit-card narrow"><h1>Профил на треньор</h1><form method="post" th:object="${trainerForm}" th:action="${trainerId==null}?@{/admin/trainers/create}:@{/admin/trainers/{id}/edit(id=${trainerId})}"><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>Име</label><input class="form-control" th:field="*{name}" maxlength="150" required><label>Възраст</label><input class="form-control" type="number" th:field="*{age}" min="18" max="100"><label>Държава</label><input class="form-control" th:field="*{country}" maxlength="100" required><label>Години опит</label><input class="form-control" type="number" th:field="*{experienceYears}" min="0" max="80"><label>Представяне</label><textarea class="form-control" th:field="*{bio}" maxlength="2000" required></textarea><label>Снимка (HTTPS адрес или /css/images/име.png)</label><input class="form-control" th:field="*{photoUrl}" maxlength="1000" required><label class="d-block my-3"><input type="checkbox" th:field="*{published}"> Публичен профил</label><button class="btn btn-pulse">Запази</button></form></div></main></body></html>
