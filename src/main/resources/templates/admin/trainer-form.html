<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.edit.trainer})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><p><a class="back-link" th:href="@{/admin/trainers}">[[#{ui.manage.trainers}]]</a></p><div class="fit-card narrow"><h1>[[#{ui.trainer.profile}]]</h1><form method="post" th:object="${trainerForm}" th:action="${trainerId==null}?@{/admin/trainers/create}:@{/admin/trainers/{id}/edit(id=${trainerId})}"><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>[[#{ui.name}]]</label><input class="form-control" th:field="*{name}" maxlength="150" required><label>[[#{ui.age}]]</label><input class="form-control" type="number" th:field="*{age}" min="18" max="100"><label>[[#{ui.country}]]</label><input class="form-control" th:field="*{country}" maxlength="100" required><label>[[#{ui.years.of.experience}]]</label><input class="form-control" type="number" th:field="*{experienceYears}" min="0" max="80"><label>[[#{ui.bio}]]</label><textarea class="form-control" th:field="*{bio}" maxlength="2000" required></textarea><label>[[#{ui.photo.https.url.or.css.images.name}]]</label><input class="form-control" th:field="*{photoUrl}" maxlength="1000" required><label class="d-block my-3"><input type="checkbox" th:field="*{published}"> [[#{ui.public.profile}]]</label><button class="btn btn-pulse">[[#{action.save}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
