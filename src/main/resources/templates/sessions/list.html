<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.my.training.sessions})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/profile}">[[#{ui.my.profile.2}]]</a><header class="module-heading"><div><span class="eyebrow">[[#{ui.pick.up.where.you.left.off}]]</span><h1>[[#{ui.training.sessions}]]</h1><p>[[#{ui.drafts.save.your.entries.without.adding.unfinished}]]</p></div><a class="btn btn-pulse" th:href="@{/programs/my#my-programs}">[[#{ui.my.programs}]]</a></header><div class="module-empty" th:if="${#lists.isEmpty(sessions)}"><h2>[[#{ui.no.sessions.yet}]]</h2><p>[[#{ui.open.a.personal.program.and.select.start}]]</p></div><section class="measurement-grid"><article class="module-panel" th:each="s:${sessions}"><span class="eyebrow" th:text="${s.status=='DRAFT'?#messages.msg('ui.unfinished'):(s.status=='FINISHED'?#messages.msg('ui.completed.2'):#messages.msg('ui.discarded'))}"></span><h2 th:text="${@uiText.programCopyText(s.program, s.title)}"></h2><p th:text="${#temporals.format(s.createdAt,'dd.MM.yyyy HH:mm')}"></p><a class="btn btn-pulse" th:href="@{/training-sessions/{id}(id=${s.id})}" th:text="${s.status=='DRAFT'?#messages.msg('ui.continue'):#messages.msg('ui.review')}"></a></article></section>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
