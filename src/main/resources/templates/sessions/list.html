<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Моите тренировъчни сесии')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<a class="back-link" th:href="@{/profile}">← Моят профил</a><header class="module-heading"><div><span class="eyebrow">Продължи оттам, докъдето стигна</span><h1>Тренировъчни сесии</h1><p>Черновите пазят въведеното, без да добавят неизпълнени серии в дневника.</p></div><a class="btn btn-pulse" th:href="@{/programs/my#my-programs}">Моите програми</a></header><div class="module-empty" th:if="${#lists.isEmpty(sessions)}"><h2>Все още няма сесии</h2><p>Отвори лична програма и избери „Започни тренировка“ към желаната сесия.</p></div><section class="measurement-grid"><article class="module-panel" th:each="s:${sessions}"><span class="eyebrow" th:text="${s.status=='DRAFT'?'Незавършена':(s.status=='FINISHED'?'Завършена':'Прекратена')}"></span><h2 th:text="${s.title}"></h2><p th:text="${#temporals.format(s.createdAt,'dd.MM.yyyy HH:mm')}"></p><a class="btn btn-pulse" th:href="@{/training-sessions/{id}(id=${s.id})}" th:text="${s.status=='DRAFT'?'Продължи':'Прегледай'}"></a></article></section>
</main></body></html>
