<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.current.workout})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page module-page">
<div id="live-session" th:data-session-id="${session.id}" th:data-status="${session.status}" th:data-server-now="${timer.serverNow}" th:data-deadline="${timer.deadline}" th:data-remaining="${timer.remaining}">
<a class="back-link" th:href="@{/training-sessions}">[[#{ui.my.sessions}]]</a><header class="module-hero"><div><span class="eyebrow" th:text="${session.status=='DRAFT'?#messages.msg('ui.current.workout'):(session.status=='FINISHED'?#messages.msg('ui.completed.workout'):#messages.msg('ui.discarded.workout'))}"></span><h1 th:text="${@uiText.programCopyText(session.program, session.title)}"></h1><p>[[#{ui.log.only.what.you.completed.0.kg}]]</p></div><a class="btn btn-outline-light" th:if="${session.finishedLog!=null}" th:href="@{/journal/{id}(id=${session.finishedLog.id})}">[[#{ui.view.journal.entry}]]</a></header>
<div id="session-error" class="alert alert-danger" role="alert" hidden></div>
<section class="rest-timer module-panel" th:if="${session.status=='DRAFT'}"><div><h2>[[#{ui.rest.between.sets}]]</h2><output id="rest-clock" aria-live="off">—</output><p id="timer-status" role="status"></p></div><form id="rest-timer-form" method="post" th:action="@{/training-sessions/{id}/timer(id=${session.id})}"><label for="rest-seconds">[[#{ui.seconds}]]</label><input class="form-control" id="rest-seconds" name="seconds" type="number" min="5" max="900" th:value="${timer.remaining>0?timer.remaining:90}"><div class="dish-actions"><button class="btn btn-pulse" type="button" data-timer-action="start">[[#{ui.start}]]</button><button class="btn btn-outline-light" type="button" data-timer-action="pause">[[#{ui.pause}]]</button><button class="btn btn-outline-light" type="button" data-timer-action="reset">[[#{ui.reset}]]</button></div></form></section>
<section class="workout-blocks"><article class="module-panel workout-block" th:each="b:${blocks}"><div class="module-panel-heading"><div><h2><a th:if="${b.exercise!=null}" th:href="@{/exercises/{code}(code=${b.exercise.code})}" th:text="${@uiText.programCopyText(session.program, b.name)}"></a><span th:unless="${b.exercise!=null}" th:text="${@uiText.programCopyText(session.program, b.name)}"></span></h2><p th:text="#{ui.planned}+${#lists.size(b.rows)}+#{ui.sets.3}+${@uiText.programCopyText(session.program, b.planned)}+#{ui.reps.time.2}+${b.rest}+#{ui.sec.rest}"></p></div><button class="btn btn-sm btn-outline-light" type="button" th:if="${session.status=='DRAFT'}" th:data-start-rest="${b.rest}" th:text="#{ui.rest}+${b.rest}+#{ui.sec}"></button></div><div class="previous-performance" th:if="${b.previous!=null}"><strong>[[#{ui.previous.workout}]]</strong><span class="previous-set-chip" th:each="p:${b.previousRows}" th:text="${p.weight}+#{ui.kg.2}+${p.repetitions}"></span></div><p class="small module-muted" th:if="${b.previous==null}">[[#{ui.no.previous.sets.for.this.exercise}]]</p>
<form class="session-set-row" th:each="r:${b.rows}" th:data-row-id="${r.id}" method="post" th:action="@{/training-sessions/{id}/sets/{setId}(id=${session.id},setId=${r.id})}"><strong th:text="#{ui.set.2}+${r.setNumber}"></strong><div><label th:for="'repetitions-'+${r.id}">[[#{ui.completed.reps}]]</label><input class="form-control" type="number" name="repetitions" min="1" max="1000" step="1" th:id="'repetitions-'+${r.id}" th:value="${r.repetitions}" th:required="${r.completed}" th:disabled="${session.status!='DRAFT'}"></div><div><label th:for="'weight-'+${r.id}">[[#{ui.weight.kg}]]</label><input class="form-control" type="number" name="weight" min="0" max="99999.99" step="0.01" th:id="'weight-'+${r.id}" th:value="${r.weight}" th:required="${r.completed}" th:disabled="${session.status!='DRAFT'}"></div><label class="series-completed"><input type="checkbox" name="completed" value="true" th:checked="${r.completed}" th:disabled="${session.status!='DRAFT'}"> [[#{ui.completed}]]</label><button class="btn btn-sm btn-outline-light" type="submit" th:if="${session.status=='DRAFT'}">[[#{action.save}]]</button><small data-save-status role="status"></small></form></article></section>
<section class="session-final-actions module-panel" th:if="${session.status=='DRAFT'}"><div><h2>[[#{ui.ready}]]</h2><p>[[#{ui.only.sets.marked.complete.go.into.your}]]</p></div><form data-session-finish method="post" th:action="@{/training-sessions/{id}/finish(id=${session.id})}"><button class="btn btn-pulse" type="submit">[[#{ui.finish.workout}]]</button></form><a data-session-pause class="btn btn-outline-light" th:href="@{/training-sessions}">[[#{ui.continue.later}]]</a><form data-session-cancel method="post" th:action="@{/training-sessions/{id}/cancel(id=${session.id})}"><button class="btn btn-outline-danger" type="submit">[[#{ui.discard.session}]]</button></form></section></div>
</main><script th:src="@{/js/workout-session.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
