<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.exercises.and.sets})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><p><a class="link-pulse" th:href="@{/exercises}">[[#{ui.muscle.navigator.3}]]</a></p><h1 th:text="${log.title}"></h1><p th:text="${#temporals.format(log.performedAt,'dd.MM.yyyy HH:mm')}"></p><p th:text="${log.notes}"></p><div class="fit-card mb-3"><h2 class="h4">[[#{ui.completed.sets}]]</h2><article class="mb-3" th:each="s:${sets}"><strong th:text="${s.exerciseName}"></strong><p th:text="${s.repetitions}+#{ui.reps.2}+${s.weight}+#{ui.kg}"></p><form th:if="${false}" class="row g-2" method="post" th:action="@{/journal/{id}/sets(id=${log.id})}"><input type="hidden" name="setId" th:value="${s.id}"><input type="hidden" name="exerciseId" th:value="${s.exercise==null?null:s.exercise.id}"><div class="col-md-4"><label>[[#{ui.exercise}]]</label><input class="form-control" name="exerciseName" data-exercise-picker th:data-search-url="@{/exercises/search}" th:value="${s.exerciseName}" maxlength="150" required></div><div class="col"><label>[[#{ui.set}]]</label><input class="form-control" type="number" name="setNumber" th:value="${s.setNumber}" min="1" max="100" required></div><div class="col"><label>[[#{ui.reps}]]</label><input class="form-control" type="number" name="repetitions" th:value="${s.repetitions}" min="1" max="1000" required></div><div class="col"><label>[[#{ui.weight.kg}]]</label><input class="form-control" type="number" step="0.01" name="weight" th:value="${s.weight}" min="0" max="99999.99" required></div><div class="col-auto align-self-end"><button class="btn btn-outline-dark">[[#{action.save}]]</button></div></form><form th:if="${false}" method="post" th:action="@{/journal/{id}/sets/{setId}/delete(id=${log.id},setId=${s.id})}"><button class="btn btn-sm btn-outline-danger mt-1">[[#{ui.delete.set}]]</button></form></article></div><form th:if="${false}" class="fit-card" method="post" th:object="${workoutSetForm}" th:action="@{/journal/{id}/sets(id=${log.id})}"><h2 class="h4">[[#{ui.new.set}]]</h2><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><input type="hidden" th:field="*{exerciseId}"><label>[[#{ui.exercise.search.the.library}]]</label><input class="form-control" data-exercise-picker th:data-search-url="@{/exercises/search}" th:field="*{exerciseName}" maxlength="150" required><label>[[#{ui.set}]]</label><input class="form-control" type="number" th:field="*{setNumber}" min="1" max="100" required><label>[[#{ui.reps}]]</label><input class="form-control" type="number" th:field="*{repetitions}" min="1" max="1000" required><label>[[#{ui.weight.kg}]]</label><input class="form-control" type="number" th:field="*{weight}" step="0.01" min="0" max="99999.99" required><button class="btn btn-pulse mt-3">[[#{ui.add.set}]]</button></form><a class="d-block mt-3" th:href="@{/journal}">[[#{ui.workout.history}]]</a></main><script th:src="@{/js/exercise-picker.js}" defer></script><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
