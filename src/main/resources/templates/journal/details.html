<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Упражнения и серии')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><p><a class="link-pulse" th:href="@{/exercises}">Мускулен навигатор →</a></p><h1 th:text="${log.title}"></h1><p th:text="${#temporals.format(log.performedAt,'dd.MM.yyyy HH:mm')}"></p><p th:text="${log.notes}"></p><div class="fit-card mb-3"><h2 class="h4">Изпълнени серии</h2><p>Въведете отделен ред за всяка серия. Тежест 0 кг означава собствено тегло.</p><article class="mb-3" th:each="s:${sets}"><form class="row g-2" method="post" th:action="@{/journal/{id}/sets(id=${log.id})}"><input type="hidden" name="setId" th:value="${s.id}"><input type="hidden" name="exerciseId" th:value="${s.exercise==null?null:s.exercise.id}"><div class="col-md-4"><label>Упражнение</label><input class="form-control" name="exerciseName" data-exercise-picker th:data-search-url="@{/exercises/search}" th:value="${s.exerciseName}" maxlength="150" required></div><div class="col"><label>Серия №</label><input class="form-control" type="number" name="setNumber" th:value="${s.setNumber}" min="1" max="100" required></div><div class="col"><label>Повторения</label><input class="form-control" type="number" name="repetitions" th:value="${s.repetitions}" min="1" max="1000" required></div><div class="col"><label>Тежест (кг)</label><input class="form-control" type="number" step="0.01" name="weight" th:value="${s.weight}" min="0" max="99999.99" required></div><div class="col-auto align-self-end"><button class="btn btn-outline-dark">Запази</button></div></form><form method="post" th:action="@{/journal/{id}/sets/{setId}/delete(id=${log.id},setId=${s.id})}"><button class="btn btn-sm btn-outline-danger mt-1">Изтрий серията</button></form></article></div><form class="fit-card" method="post" th:object="${workoutSetForm}" th:action="@{/journal/{id}/sets(id=${log.id})}"><h2 class="h4">Нова серия</h2><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><input type="hidden" th:field="*{exerciseId}"><label>Упражнение — търсене в библиотеката</label><input class="form-control" data-exercise-picker th:data-search-url="@{/exercises/search}" th:field="*{exerciseName}" maxlength="150" required><label>Серия №</label><input class="form-control" type="number" th:field="*{setNumber}" min="1" max="100" required><label>Повторения</label><input class="form-control" type="number" th:field="*{repetitions}" min="1" max="1000" required><label>Тежест (кг)</label><input class="form-control" type="number" th:field="*{weight}" step="0.01" min="0" max="99999.99" required><button class="btn btn-pulse mt-3">Добави серия</button></form><a class="d-block mt-3" th:href="@{/journal}">История на тренировките</a></main><script th:src="@{/js/exercise-picker.js}" defer></script></body></html>
