<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Тренировъчен дневник')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><h1>Тренировъчен дневник</h1><a class="btn btn-pulse" th:href="@{/journal/create}">Запиши тренировка</a></div><p>История на изпълнените тренировки, упражнения и тежести.</p><p th:if="${#lists.isEmpty(logs)}">Все още няма записани тренировки.</p><article class="fit-card mb-3" th:each="l:${logs}"><h2 class="h4" th:text="${l.title}"></h2><p th:text="${#temporals.format(l.performedAt,'dd.MM.yyyy HH:mm')}"></p><p th:text="${l.notes}"></p><a class="btn btn-outline-dark" th:href="@{/journal/{id}(id=${l.id})}">Упражнения и серии</a><a class="btn btn-outline-dark" th:href="@{/journal/{id}/edit(id=${l.id})}">Редактирай</a><form class="d-inline" method="post" th:action="@{/journal/{id}/delete(id=${l.id})}" onsubmit="return confirm('Изтриване на тренировката и сериите?');"><button class="btn btn-outline-danger">Изтрий</button></form></article></main></body></html>
