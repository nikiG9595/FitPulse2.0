<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.training.journal})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="section-heading"><h1>[[#{ui.training.journal}]]</h1></div><p>[[#{ui.history.of.completed.workouts.exercises.and.weights}]]</p><p th:if="${#lists.isEmpty(logs)}">[[#{ui.no.workouts.have.been.recorded.yet}]]</p><article class="fit-card mb-3" th:each="l:${logs}"><h2 class="h4" th:text="${l.title}"></h2><p th:text="${#temporals.format(l.performedAt,'dd.MM.yyyy HH:mm')}"></p><p th:text="${l.notes}"></p><a class="btn btn-outline-dark" th:href="@{/journal/{id}(id=${l.id})}">[[#{ui.exercises.and.sets}]]</a><form class="d-inline" method="post" th:action="@{/journal/{id}/delete(id=${l.id})}" th:data-confirm="#{ui.delete.the.workout.and.its.sets}" onsubmit="return confirm(this.dataset.confirm);"><button class="btn btn-outline-danger">[[#{action.delete}]]</button></form></article></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
