<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.training.journal})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="fit-card narrow" th:if="${false}"><h1>[[#{ui.workout.entry}]]</h1><form method="post" th:object="${workoutLogForm}" th:action="${logId==null}?@{/journal/create}:@{/journal/{id}/edit(id=${logId})}"><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>[[#{ui.title}]]</label><input class="form-control" th:field="*{title}" maxlength="150" required><label>[[#{ui.completed.on}]]</label><input class="form-control" type="datetime-local" th:field="*{performedAt}" required><label>[[#{ui.workout.from.calendar}]]</label><select class="form-select" th:field="*{eventId}"><option value="">[[#{ui.no.linked.workout}]]</option><option th:each="e:${events}" th:value="${e.id}" th:text="${e.title}+' · '+${#temporals.format(e.startsAt,'dd.MM.yyyy HH:mm')}"></option></select><label>[[#{ui.notes}]]</label><textarea class="form-control" th:field="*{notes}" maxlength="1500"></textarea><button class="btn btn-pulse mt-3">[[#{ui.save.and.add.sets}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
