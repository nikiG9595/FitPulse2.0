<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Запис на тренировка')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="fit-card narrow"><h1>Запис на тренировка</h1><form method="post" th:object="${workoutLogForm}" th:action="${logId==null}?@{/journal/create}:@{/journal/{id}/edit(id=${logId})}"><ul class="text-danger" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>Заглавие</label><input class="form-control" th:field="*{title}" maxlength="150" required><label>Изпълнена на</label><input class="form-control" type="datetime-local" th:field="*{performedAt}" required><label>Тренировка от календара</label><select class="form-select" th:field="*{eventId}"><option value="">Без свързана тренировка</option><option th:each="e:${events}" th:value="${e.id}" th:text="${e.title}+' · '+${#temporals.format(e.startsAt,'dd.MM.yyyy HH:mm')}"></option></select><label>Бележки</label><textarea class="form-control" th:field="*{notes}" maxlength="1500"></textarea><button class="btn btn-pulse mt-3">Запази и добави серии</button></form></div></main></body></html>
