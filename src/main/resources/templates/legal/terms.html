<!doctype html>
<html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{legal.terms.title})}"></head>
<body class="page-bg">
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page legal-page">
    <article class="fit-card">
        <h1 th:text="#{legal.terms.title}"></h1>
        <p class="text-muted" th:text="#{legal.terms.version(${termsVersion})}"></p>
        <p th:text="#{legal.operator}"></p>
        <h2 th:text="#{legal.terms.account.title}"></h2>
        <p th:text="#{legal.terms.account}"></p>
        <h2 th:text="#{legal.terms.plans.title}"></h2>
        <p th:text="#{legal.terms.plans}"></p>
        <p th:text="#{legal.medical}"></p>
        <h2 th:text="#{legal.terms.content.title}"></h2>
        <p th:text="#{legal.terms.content}"></p>
        <h2 th:text="#{legal.contact.title}"></h2>
        <p th:text="#{legal.terms.contact}"></p>
        <a th:href="@{/support}" th:text="#{ui.help.and.feedback}"></a>
        <section id="licenses" class="mt-4">
            <h2>[[#{legal.licenses}]]</h2>
            <ul>
                <li><a th:href="@{/images/anatomy/LICENSE.txt}">[[#{ui.outlines.musclemap.mit.license}]]</a></li>
                <li><a th:href="@{/images/exercises/attribution.txt}">[[#{exercise.image.credit}]]</a></li>
            </ul>
        </section>
    </article>
</main>
<div th:replace="~{fragments/footer :: footer(false)}"></div>
</body>
</html>
