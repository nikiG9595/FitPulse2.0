<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Предложи фитнес')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1>Предложи нов фитнес</h1><p>Предложението се публикува само след одобрение от администратор. Попълвай само известни и действителни данни; неизвестните полета могат да останат празни.</p><div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<form method="post" th:action="@{/suggest-gym}" th:object="${gymSuggestionForm}"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}" role="alert"><ul><li th:each="e:${#fields.detailedErrors()}" th:text="${e.message}"></li></ul></div>
<label for="suggest-name">Име *</label><input id="suggest-name" class="form-control" th:field="*{name}" maxlength="150" required><label for="suggest-city">Град *</label><input id="suggest-city" class="form-control" th:field="*{cityName}" maxlength="100" required><label for="suggest-address">Адрес</label><input id="suggest-address" class="form-control" th:field="*{address}" maxlength="300">
<label for="suggest-phone">Телефон</label><input id="suggest-phone" class="form-control" type="tel" th:field="*{phone}" maxlength="50"><label for="suggest-website">Уебсайт</label><input id="suggest-website" class="form-control" type="url" th:field="*{websiteUrl}" maxlength="500" placeholder="https://..."><label for="suggest-details">Описание и подробности</label><textarea id="suggest-details" class="form-control" th:field="*{details}" maxlength="2000" rows="5"></textarea><label for="suggest-prices">Цени, ако са известни</label><textarea id="suggest-prices" class="form-control" th:field="*{priceInfo}" maxlength="1000" rows="3"></textarea><label for="suggest-image">Адрес на снимка (по желание)</label><input id="suggest-image" class="form-control" th:field="*{imageUrl}" maxlength="1000"><p class="small text-muted">Добавяй само истинска снимка на залата, която имаш право да споделяш. Администраторът ще я прегледа преди публикуване.</p><button class="btn btn-pulse mt-3">Изпрати предложението</button></form></div></main></body></html>
