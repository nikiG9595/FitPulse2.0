<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.suggest.a.gym})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1>[[#{ui.suggest.a.new.gym}]]</h1><p>[[#{ui.suggestions.are.published.after.administrator.approval.enter}]]</p><div th:if="${success}" class="alert alert-success" th:text="${@uiText.label(success)}"></div>
<form method="post" th:action="@{/suggest-gym}" th:object="${gymSuggestionForm}"><div class="alert alert-danger" th:if="${#fields.hasErrors('*')}" role="alert"><ul><li th:each="e:${#fields.detailedErrors()}" th:text="${@uiText.label(e.message)}"></li></ul></div>
<label for="suggest-name">[[#{ui.name.2}]]</label><input id="suggest-name" class="form-control" th:field="*{name}" maxlength="150" required><label for="suggest-city">[[#{ui.city.2}]]</label><input id="suggest-city" class="form-control" th:field="*{cityName}" maxlength="100" required><label for="suggest-address">[[#{ui.address}]]</label><input id="suggest-address" class="form-control" th:field="*{address}" maxlength="300">
<label for="suggest-phone">[[#{ui.phone}]]</label><input id="suggest-phone" class="form-control" type="tel" th:field="*{phone}" maxlength="50"><label for="suggest-website">[[#{ui.website}]]</label><input id="suggest-website" class="form-control" type="url" th:field="*{websiteUrl}" maxlength="500" placeholder="https://..."><label for="suggest-details">[[#{ui.description.and.details}]]</label><textarea id="suggest-details" class="form-control" th:field="*{details}" maxlength="2000" rows="5"></textarea><label for="suggest-prices">[[#{ui.prices.if.known}]]</label><textarea id="suggest-prices" class="form-control" th:field="*{priceInfo}" maxlength="1000" rows="3"></textarea><label for="suggest-image">[[#{ui.photo.url.optional}]]</label><input id="suggest-image" class="form-control" th:field="*{imageUrl}" maxlength="1000"><p class="small text-muted">[[#{ui.share.a.real.photo.of.the.gym}]]</p><button class="btn btn-pulse mt-3">[[#{ui.submit.suggestion}]]</button></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
