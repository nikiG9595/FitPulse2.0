<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/head :: head(#{nav.gyms})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page">
<div class="section-heading"><div class="page-title"><h1>[[#{ui.gym.directory.3}]]</h1><p>[[#{ui.search.by.name.address.or.service.and}]]</p></div>
<a sec:authorize="isAuthenticated()" class="btn btn-pulse" th:href="@{/suggest-gym}">[[#{ui.suggest.a.gym}]]</a>
</div>
<form class="filter-bar gym-catalog-filters" method="get" th:action="@{/gyms}" role="search"><label class="visually-hidden" for="gym-query">[[#{ui.name.address.or.service}]]</label><input id="gym-query" class="form-control" name="q" maxlength="150" th:value="${q}" th:placeholder="#{ui.gym.service.or.address}"><label class="visually-hidden" for="gym-city">[[#{ui.city}]]</label><select id="gym-city" class="form-select" name="city"><option value="">[[#{ui.all.cities}]]</option><option th:each="c:${cities}" th:value="${c.slug}" th:text="${c.name}" th:selected="${c.slug==city}"></option></select>
<button class="btn btn-pulse">[[#{ui.search}]]</button><a class="link-pulse" th:href="@{/gyms}">[[#{ui.clear}]]</a></form>
<p class="mt-3" th:text="${gyms.totalElements}+#{ui.gyms.found}"></p>
<div class="row g-3 mt-2">
    <div class="col-md-6 col-xl-4" th:each="g:${gyms.content}">
        <a class="fit-card gym-catalog-card h-100" th:with="cover=${gymCovers[g.id]}"
           th:classappend="${cover != null ? 'gym-catalog-card-with-photo' : ''}" th:href="@{/gyms/{slug}(slug=${g.slug})}">
            <span class="gym-catalog-media" aria-hidden="true">
                <img th:if="${cover != null}" class="gym-catalog-photo" th:src="${@browserMedia.local(cover.imageUrl)} ? @{${cover.imageUrl}} : null" th:data-external-src="${@browserMedia.external(cover.imageUrl)}" referrerpolicy="no-referrer" data-media-fallback
                     alt="" loading="lazy" decoding="async" onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
                <span th:attr="hidden=${cover != null and @browserMedia.local(cover.imageUrl) ? 'hidden' : null}">
                    <span th:replace="~{fragments/gym-wordmark :: wordmark(${g.name})}"></span>
                </span>
            </span>
            <div class="gym-catalog-card-content">
                <h2 th:text="${g.name}"></h2>
                <p th:text="${#strings.isEmpty(#strings.trim(g.address)) ? g.city.name : g.address + ', ' + g.city.name}"></p>
            </div>
        </a>
    </div>
</div>
<div class="fit-card mt-4" th:if="${gyms.empty}">[[#{ui.no.gyms.match.the.filters}]]</div>
<nav class="d-flex flex-wrap align-items-center gap-3 mt-4" th:aria-label="#{ui.gym.pages}" th:if="${gyms.totalPages>1}"><a class="btn btn-outline-dark" th:if="${gyms.hasPrevious()}" th:href="@{/gyms(city=${city},q=${q},page=${gyms.number-1})}">[[#{ui.previous}]]</a><span th:text="#{ui.page}+${gyms.number+1}+#{ui.of}+${gyms.totalPages}"></span><a class="btn btn-outline-dark" th:if="${gyms.hasNext()}" th:href="@{/gyms(city=${city},q=${q},page=${gyms.number+1})}">[[#{ui.next}]]</a></nav>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
