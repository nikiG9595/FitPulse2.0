<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Фитнеси')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div class="page-title"><h1>Каталог с фитнеси</h1><p>Търси по име, адрес или услуга и филтрирай по град.</p></div><form class="filter-bar" method="get"><input class="form-control" name="q" th:value="${q}" placeholder="Фитнес, услуга или адрес"><select class="form-select" name="city"><option value="">Всички градове</option><option th:each="c:${cities}" th:value="${c.slug}" th:text="${c.name}" th:selected="${c.slug==city}"></option></select><button class="btn btn-pulse">Търси</button></form><div class="row g-4 mt-2"><div class="col-md-6 col-lg-4" th:each="g:${gyms.content}"><article class="fit-card h-100"><img class="gym-cover" th:if="${!g.photos.empty}" th:src="${g.photos[0].imageUrl}" th:alt="${g.photos[0].altText}"><span class="eyebrow" th:text="${g.city.name}"></span><h2 class="h4" th:text="${g.name}"></h2><p th:text="${g.address}"></p><p class="text-muted clamp" th:text="${g.description}"></p><a class="btn btn-dark" th:href="@{/gyms/{slug}(slug=${g.slug})}">Виж фитнеса</a></article></div></div><div class="fit-card mt-4" th:if="${gyms.empty}">Няма фитнеси, които отговарят на филтрите.</div></main></body></html>
