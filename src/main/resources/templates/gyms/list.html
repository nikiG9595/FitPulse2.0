<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Фитнеси')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page">
<div class="section-heading"><div class="page-title"><h1>Каталог с фитнеси</h1><p>Търси по име, адрес или услуга и филтрирай по град.</p></div><a class="btn btn-outline-dark" th:href="@{/suggest-gym}">Предложи фитнес</a></div>
<form class="filter-bar" method="get" th:action="@{/gyms}" role="search"><label class="visually-hidden" for="gym-query">Име, адрес или услуга</label><input id="gym-query" class="form-control" name="q" maxlength="150" th:value="${q}" placeholder="Фитнес, услуга или адрес"><label class="visually-hidden" for="gym-city">Град</label><select id="gym-city" class="form-select" name="city"><option value="">Всички градове</option><option th:each="c:${cities}" th:value="${c.slug}" th:text="${c.name}" th:selected="${c.slug==city}"></option></select><button class="btn btn-pulse">Търси</button><a class="link-pulse" th:href="@{/gyms}">Изчисти</a></form>
<p class="mt-3" th:text="${gyms.totalElements}+' намерени фитнеса'"></p>
<div class="row g-4 mt-2"><div class="col-md-6 col-lg-4" th:each="g:${gyms.content}"><article class="fit-card h-100">
<div th:if="${covers.containsKey(g.id)}"><img class="gym-cover" loading="lazy" th:src="${covers[g.id].imageUrl}" th:alt="${covers[g.id].altText}" onerror="this.hidden=true;this.nextElementSibling.hidden=false;"><p hidden>Снимката не може да се зареди.</p></div><p class="text-muted" th:unless="${covers.containsKey(g.id)}">Няма добавена снимка.</p>
<span class="eyebrow" th:text="${g.city.name}"></span><h2 class="h4" th:text="${g.name}"></h2><p th:text="${#strings.isEmpty(#strings.trim(g.address))?'Няма публикуван адрес.':g.address}"></p><p class="text-muted clamp" th:text="${#strings.isEmpty(#strings.trim(g.description))?'Няма добавено описание.':g.description}"></p><a class="btn btn-dark" th:href="@{/gyms/{slug}(slug=${g.slug})}">Виж фитнеса</a></article></div></div>
<div class="fit-card mt-4" th:if="${gyms.empty}">Няма фитнеси, които отговарят на филтрите.</div>
<nav class="d-flex flex-wrap align-items-center gap-3 mt-4" aria-label="Страници с фитнеси" th:if="${gyms.totalPages>1}"><a class="btn btn-outline-dark" th:if="${gyms.hasPrevious()}" th:href="@{/gyms(city=${city},q=${q},page=${gyms.number-1})}">← Предишна</a><span th:text="'Страница '+${gyms.number+1}+' от '+${gyms.totalPages}"></span><a class="btn btn-outline-dark" th:if="${gyms.hasNext()}" th:href="@{/gyms(city=${city},q=${q},page=${gyms.number+1})}">Следваща →</a></nav>
</main></body></html>
