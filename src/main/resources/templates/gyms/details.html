<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/head :: head(${gym.name})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page"><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div class="fit-card"><div class="row g-4"><div class="col-lg-7"><div class="photo-grid"><img th:each="p:${gym.photos}" th:src="${p.imageUrl}" th:alt="${p.altText}"></div></div><div class="col-lg-5"><span class="eyebrow" th:text="${gym.city.name}"></span><h1 th:text="${gym.name}"></h1><p th:text="${gym.description}"></p><dl><dt>Адрес</dt><dd th:text="${gym.address}"></dd><dt>Работно време</dt><dd th:text="${gym.openingHours?:'Свържете се с фитнеса'}"></dd><dt>Услуги</dt><dd th:text="${gym.services?:'Няма информация'}"></dd><dt>Цени</dt><dd th:text="${gym.priceInfo?:'Свържете се с фитнеса'}"></dd></dl><a class="btn btn-outline-dark" target="_blank" rel="noopener" th:if="${gym.latitude!=null}" th:href="@{'https://www.openstreetmap.org/?mlat='+${gym.latitude}+'&mlon='+${gym.longitude}+'#map=17/'+${gym.latitude}+'/'+${gym.longitude}}">Отвори картата</a><form sec:authorize="isAuthenticated()" class="d-inline" method="post" th:action="@{/gyms/{id}/favorite(id=${gym.id})}"><input type="hidden" name="slug" th:value="${gym.slug}"><button class="btn btn-pulse" th:text="${favorite?'Премахни от любими':'Добави в любими'}"></button></form></div></div></div><section class="mt-5"><h2><span th:text="${#numbers.formatDecimal(averageRating,1,1)}"></span> ★ оценки</h2><form sec:authorize="isAuthenticated()" class="fit-card mb-4" method="post" th:action="@{/gyms/{id}/review(id=${gym.id})}" th:object="${reviewForm}"><input type="hidden" name="slug" th:value="${gym.slug}"><label>Оценка</label><select class="form-select" th:field="*{rating}"><option th:each="n:${#numbers.sequence(1,5)}" th:value="${n}" th:text="${n}+' звезди'"></option></select><label>Коментар</label><textarea class="form-control" th:field="*{comment}"></textarea><button class="btn btn-pulse mt-3">Запази оценката</button></form><div class="fit-card mb-3" th:each="r:${reviews}"><strong th:text="${r.user.displayName?:r.user.username}"></strong><span class="ms-2" th:text="${r.rating}+' ★'"></span><p th:text="${r.comment}"></p><form sec:authorize="isAuthenticated()" method="post" th:action="@{/reviews/{id}/report(id=${r.id})}"><input type="hidden" name="slug" th:value="${gym.slug}"><input class="form-control form-control-sm" name="reason" required maxlength="500" placeholder="Причина за докладване"><button class="btn btn-link btn-sm">Докладвай</button></form></div></section></main></body></html>
