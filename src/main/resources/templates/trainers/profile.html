<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${trainer.name})}"></head>
<body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page trainer-profile-page">
    <a class="back-link" th:href="@{/trainers}">[[#{ui.all.trainers}]]</a>
    <article class="trainer-profile">
        <div class="trainer-portrait"><img th:src="${@browserMedia.local(trainer.photoUrl)} ? @{${trainer.photoUrl}} : null" th:data-external-src="${@browserMedia.external(trainer.photoUrl)}" referrerpolicy="no-referrer" th:alt="#{ui.profile.photo.of}+${trainer.name}"></div>
        <div class="trainer-profile-content"><span class="eyebrow">[[#{ui.trainer.profile}]]</span><h1 th:text="${trainer.name}"></h1>
            <dl class="trainer-facts"><div><dt>[[#{ui.age}]]</dt><dd th:text="${trainer.age}+#{ui.g.3}"></dd></div><div><dt>[[#{ui.country}]]</dt><dd th:text="${trainer.country}"></dd></div><div><dt>[[#{ui.experience}]]</dt><dd th:text="${trainer.experienceYears}+#{ui.g.3}"></dd></div></dl>
            <section class="trainer-about"><h2>[[#{ui.about.the.trainer}]]</h2><p class="preserve-lines" th:text="${trainer.bio}"></p></section>
            <div class="trainer-next-step"><span class="tool-icon"><svg th:replace="~{fragments/icons :: icon('program')}"></svg></span><div><h2>[[#{ui.ready.for.the.next.step}]]</h2><p>[[#{ui.browse.the.library.and.choose.a.program}]]</p><a class="btn btn-pulse" th:href="@{/programs}">[[#{ui.training.programs}]]</a></div></div>
        </div>
    </article>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
