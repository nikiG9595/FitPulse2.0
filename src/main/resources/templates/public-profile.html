<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(#{ui.public.profile})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div>
<main class="container page profile-page">
    <header class="profile-header fit-card"><div class="profile-avatar"><svg th:replace="~{fragments/icons :: icon('user')}"></svg><span class="visually-hidden">[[#{ui.user.avatar}]]</span></div><div class="profile-intro"><span class="eyebrow">[[#{ui.public.profile}]]</span><h1 th:text="${#strings.isEmpty(user.displayName)?user.username:user.displayName}"></h1><p class="profile-username" th:text="'@'+${user.username}"></p><p class="profile-bio" th:if="${!#strings.isEmpty(user.bio)}" th:text="${user.bio}"></p><span class="privacy-badge" th:if="${user.showCity && !#strings.isEmpty(user.homeCity)}" th:text="${user.homeCity}"></span></div></header>
    <section class="profile-favorites" th:if="${user.showFavorites}"><div class="section-heading"><div><span class="eyebrow">[[#{ui.shared.places}]]</span><h2>[[#{ui.favorite.gyms}]]</h2></div></div><div class="fit-card" th:if="${#lists.isEmpty(favorites)}"><p class="text-muted mb-0">[[#{ui.no.favorite.gyms.have.been.shared.yet}]]</p></div><div class="row g-4"><div class="col-md-6 col-xl-4" th:each="f:${favorites}"><article class="fit-card favorite-card"><h3 class="h4" th:text="${f.gym.name}"></h3><p class="text-muted" th:text="${f.gym.address}"></p><a class="btn btn-outline-dark" th:href="@{/gyms/{slug}(slug=${f.gym.slug})}">[[#{ui.view.gym}]]</a></article></div></div></section>
</main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
