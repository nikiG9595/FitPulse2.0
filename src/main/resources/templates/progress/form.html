<!doctype html><html lang="bg" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Запис на прогрес')}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1 th:text="${progressId==null?'Добавяне на прогрес':'Редактиране на прогрес'}"></h1><p class="text-muted">Запишете текущите си измервания.</p><div class="alert alert-danger" th:if="${globalError}" th:text="${globalError}"></div><form th:action="${progressId}==null?@{/progress/create}:@{/progress/{id}/edit(id=${progressId})}" th:object="${progressFormRequest}" method="post"><ul class="field-error" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>Тегло (кг)</label><input class="form-control" type="number" min="20" max="400" step="0.1" th:field="*{weight}"><div class="field-error" th:errors="*{weight}"></div><label>Телесни мазнини (%) — по избор</label><input class="form-control" type="number" min="1" max="80" step="0.1" th:field="*{bodyFatPercentage}"><label>Дата</label><input class="form-control" type="date" th:field="*{recordedAt}"><label>Бележка</label><textarea class="form-control" maxlength="500" th:field="*{note}"></textarea><button class="btn btn-pulse w-100 mt-4">Запази</button><a class="btn btn-outline-secondary w-100 mt-2" th:href="@{/progress}">Отказ</a></form></div></main></body></html>
