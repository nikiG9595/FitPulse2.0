<!doctype html><html lang="bg" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(#{ui.progress.entry})}"></head><body class="page-bg"><div th:replace="~{fragments/nav :: nav}"></div><main class="container page narrow"><div class="fit-card"><h1 th:text="${progressId==null?#messages.msg('ui.add.progress.entry'):#messages.msg('ui.edit.progress.entry')}"></h1><p class="text-muted">[[#{ui.record.your.current.measurements}]]</p><div class="alert alert-danger" th:if="${globalError}" th:text="${@uiText.label(globalError)}"></div><form th:action="${progressId}==null?@{/progress/create}:@{/progress/{id}/edit(id=${progressId})}" th:object="${progressFormRequest}" method="post"><ul class="field-error" th:if="${#fields.hasErrors('*')}"><li th:each="e:${#fields.errors('*')}" th:text="${e}"></li></ul><label>[[#{ui.weight.kg.2}]]</label><input class="form-control" type="number" min="20" max="400" step="0.1" th:field="*{weight}"><div class="field-error" th:errors="*{weight}"></div><label>[[#{ui.body.fat.optional}]]</label><input class="form-control" type="number" min="1" max="80" step="0.1" th:field="*{bodyFatPercentage}"><label>[[#{ui.date}]]</label><input class="form-control" type="date" th:field="*{recordedAt}"><label>[[#{ui.note}]]</label><textarea class="form-control" maxlength="500" th:field="*{note}"></textarea><button class="btn btn-pulse w-100 mt-4">[[#{action.save}]]</button><a class="btn btn-outline-secondary w-100 mt-2" th:href="@{/progress}">[[#{action.cancel}]]</a></form></div></main><div th:replace="~{fragments/footer :: footer(false)}"></div></body></html>
